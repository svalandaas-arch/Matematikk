<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Naturfag 8.–10. trinn</title><meta name="claude:viewport-fit-sides" content="cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a squared maths exercise book. Light = ruteark (blue grid paper), dark = tavle (chalkboard).
   Sticky chapter index on the left, one reading column. Every topic = Lær (step-through model) + Øv (generator). */
:root{
  --paper:#F3F7F2; --grid:rgba(46,120,84,.12); --surface:#FFFFFF; --ink:#14241C; --muted:#56685E;
  --line:#D3DED5; --pen:#1E6B4A; --pen-soft:rgba(30,107,74,.08); --hl:rgba(255,211,59,.78);
  --note:#FFF6D8; --note-line:#E0C04F;
  --c1:rgba(30,107,74,.30); --c2:rgba(194,54,43,.28); --c3:rgba(27,118,70,.30); --c12:rgba(110,45,160,.55);
  --red:#C2362B; --red-soft:rgba(194,54,43,.08); --ok:#1B7646; --ok-soft:rgba(27,118,70,.10); --bad:#B5382C; --bad-soft:rgba(181,56,44,.08);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --mc:30px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15211E; --grid:rgba(214,236,224,.055); --surface:#1C2B27; --ink:#E6EEE9; --muted:#9DB1A7;
    --line:#2F433D; --pen:#93B5FF; --pen-soft:rgba(147,181,255,.11); --hl:rgba(242,205,74,.30);
    --note:rgba(242,205,74,.09); --note-line:rgba(242,205,74,.45);
    --c1:rgba(147,181,255,.38); --c2:rgba(255,139,123,.36); --c3:rgba(99,211,152,.36); --c12:rgba(205,150,255,.55);
    --red:#FF8B7B; --red-soft:rgba(255,139,123,.10); --ok:#63D398; --ok-soft:rgba(99,211,152,.12); --bad:#FF8070; --bad-soft:rgba(255,128,112,.11);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15211E; --grid:rgba(214,236,224,.055); --surface:#1C2B27; --ink:#E6EEE9; --muted:#9DB1A7;
  --line:#2F433D; --pen:#93B5FF; --pen-soft:rgba(147,181,255,.11); --hl:rgba(242,205,74,.30);
  --note:rgba(242,205,74,.09); --note-line:rgba(242,205,74,.45);
  --c1:rgba(147,181,255,.38); --c2:rgba(255,139,123,.36); --c3:rgba(99,211,152,.36); --c12:rgba(205,150,255,.55);
    --red:#FF8B7B; --red-soft:rgba(255,139,123,.10); --ok:#63D398; --ok-soft:rgba(99,211,152,.12); --bad:#FF8070; --bad-soft:rgba(255,128,112,.11);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--pen)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h1{font-weight:800;font-size:clamp(2.2rem,6vw,3.5rem);letter-spacing:-.025em}
h2{font-weight:800;font-size:clamp(1.5rem,3.4vw,2rem);letter-spacing:-.015em}
h3{font-weight:600;font-size:1.25rem}
p{margin:0}
code,.math{font-family:var(--f-mono);font-weight:500;font-size:.94em;white-space:nowrap}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%);padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hand{font-family:var(--f-hand);font-weight:700;color:var(--red);line-height:1.1}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .brand{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--ink);text-decoration:none}
.menu-btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.menu-btn svg{width:18px;height:18px}
.side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:40;background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease;
  padding-block:calc(env(safe-area-inset-top,0px) + 22px) 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,30,.42)}
.brand-big{display:block;font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.1;color:var(--ink);text-decoration:none;margin-bottom:22px}
.brand-big small{display:block;font-family:var(--f-mono);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:6px;font-size:.96rem;line-height:1.35}
.nav a:hover{background:var(--pen-soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav a[aria-current="page"] .tally{color:var(--surface);opacity:.8}
.nav .chap{font-weight:700;margin-top:10px}
.nav .grp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav .sub a{padding-left:20px}
.nav a.tool{font-weight:700;border:1.5px solid var(--pen);color:var(--pen)}.nav a.tool:hover{background:var(--pen-soft)}
.nav .soon{color:var(--muted);padding:6px 10px;font-size:.92rem}
.tally{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tally.done{color:var(--ok);font-weight:700}
@media (min-width:980px){
  .app{grid-template-columns:300px minmax(0,1fr)}
  .topbar,.scrim{display:none!important}
  .side{position:sticky;top:0;height:100vh;transform:none;transition:none;width:auto;z-index:auto}
}
.main{padding-block:44px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.crumb{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumb a{color:var(--muted)}
.lede{font-size:1.15rem;color:var(--muted);max-width:58ch}

/* ---------- buttons & fields ---------- */
.btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--surface);border:1.5px solid var(--ink);
  border-radius:6px;padding:9px 18px;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){background:var(--pen);border-color:var(--pen)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--pen-soft);color:var(--pen);border-color:var(--pen)}
.btn.small{padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.35;cursor:default}
.link-btn{font:inherit;font-size:.92rem;background:none;border:0;color:var(--pen);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.9rem;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:hover{border-color:var(--pen);color:var(--pen)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:3px}
.field label,.flabel{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num-in{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;width:6.5rem;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-align:center}
.num-in.sm{width:4.2rem}
.num-in:focus{border-color:var(--pen);outline:none}
select.num-in{width:4.2rem;cursor:pointer}

/* ---------- home & chapter ---------- */
.home-hero{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.home-hero h1{font-size:clamp(2.6rem,8vw,4.6rem)}
.chapters{display:grid;gap:16px}
.chap-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:start;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:22px 24px;text-decoration:none;color:var(--ink)}
.chap-card:hover{border-color:var(--pen);box-shadow:4px 4px 0 var(--pen)}
.chap-card .num{grid-row:span 3;font-family:var(--f-display);font-weight:800;font-size:4.2rem;line-height:.85;color:var(--pen)}
.chap-card h3{font-size:1.5rem;font-weight:800}
.chap-card .meta{color:var(--muted);font-size:.95rem}
.chap-card.soon{border-style:dashed;border-color:var(--line);background:transparent;color:var(--muted)}
.chap-card.soon .num{color:var(--line)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.steps-how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:s}
.steps-how li{counter-increment:s;display:flex;flex-direction:column;gap:6px}
.steps-how li::before{content:counter(s);font-family:var(--f-hand);font-weight:700;font-size:2.2rem;line-height:1;color:var(--red)}
.steps-how b{font-family:var(--f-display);font-size:1.1rem}
.steps-how span{color:var(--muted);font-size:.96rem}
.chap-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 24px;align-items:end}
.chap-hero .num{font-family:var(--f-display);font-weight:800;font-size:clamp(5rem,15vw,8.5rem);line-height:.78;color:var(--pen);grid-row:span 2}
.chap-hero .lede{grid-column:1/-1;margin-top:14px}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.goals h2{font-family:var(--f-hand);font-weight:700;font-size:1.9rem;color:var(--red);letter-spacing:0;margin-bottom:6px}
.goals ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.goals li{display:flex;gap:10px}
.goals li::before{content:"";flex:none;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;margin-top:5px}
.group{display:flex;flex-direction:column;gap:14px}
.group-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.group-head .eyebrow{color:var(--pen)}
.rows{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.rows li{border-bottom:1px solid var(--line)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:14px 4px;text-decoration:none;color:var(--ink)}
.rows a:hover{background:var(--pen-soft)}
.rows .t{font-family:var(--f-display);font-weight:600;font-size:1.18rem}
.rows .d{grid-column:1;color:var(--muted);font-size:.95rem}
.rows .p{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:84px}
.rows .p .bar{width:84px;margin:0}
footer.foot{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

/* ---------- topic ---------- */
.topic-head{display:flex;flex-direction:column;gap:14px}
.jump{display:flex;gap:10px;flex-wrap:wrap}
.part{display:flex;flex-direction:column;gap:22px}
.part-title{display:flex;align-items:center;gap:14px;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.part-title .tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--surface);padding:3px 8px;border-radius:4px}
.learn{display:flex;flex-direction:column;gap:20px}
.learn > p,.learn > ul{max-width:66ch}
.learn ul,.learn ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.box .lab{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pen);font-weight:700}
.rule{background:var(--pen-soft);border:1.5px dashed var(--pen);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.rule .lab{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1;color:var(--pen)}
.trap{border:1.5px solid var(--red);border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;background:var(--red-soft)}
.trap .lab{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1;color:var(--red)}
.scroll{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.t th{font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--muted);background:var(--pen-soft)}
table.t td{font-family:var(--f-mono)}
.order{list-style:none;padding:0!important;display:grid;gap:8px!important;counter-reset:o}
.order li{counter-increment:o;display:flex;gap:12px;align-items:baseline}
.order li::before{content:counter(o);flex:none;font-family:var(--f-mono);font-weight:700;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--pen);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.terms{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.term{border:2px solid var(--pen);background:var(--pen-soft);color:var(--ink);border-radius:8px;padding:4px 12px}
.term.done{border-color:var(--ok);background:var(--ok-soft)}
.opb{color:var(--red);font-size:1.3rem;padding:0 2px}

.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;border-top:1.5px solid var(--ink);padding-top:20px}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pager a:hover{border-color:var(--pen)}
.pager a.next{text-align:right}
.pager b{font-family:var(--f-display);font-size:1.1rem}
.vid{margin:0;display:flex;flex-direction:column;gap:8px}
.vid video{width:100%;border-radius:10px;border:1.5px solid var(--ink);background:#000;aspect-ratio:16/9;display:block}
.vid figcaption{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grade-sw{display:flex;gap:4px;margin:10px 0 14px;background:var(--line);padding:3px;border-radius:99px;width:max-content}
.grade-sw button{font:inherit;font-size:.85rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:99px;cursor:pointer}
.grade-sw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.grade-sw button:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.g-note .grade-sw{display:inline-flex;vertical-align:middle;margin:0 0 0 8px}
.hero-row{display:flex;flex-wrap:wrap;gap:10px}
.muted{color:var(--muted);font-size:.95rem}
.km{display:inline-block;font-family:var(--f-mono);font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--pen);background:var(--pen-soft);border:1px solid var(--pen);border-radius:4px;padding:1px 6px;text-decoration:none;line-height:1.5;white-space:nowrap}
a.km:hover{background:var(--pen);color:var(--surface)}
.kms{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.chap-card .kms{justify-content:flex-start}
.rows .p .kms{max-width:160px}
.rows .ix{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);margin-right:10px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:.92rem}
.kmbox{border-left:4px solid var(--pen);padding:4px 0 4px 18px;display:flex;flex-direction:column;gap:10px}
.kmbox ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.kmbox li{display:flex;gap:12px;align-items:baseline}
.kml{list-style:none;padding:0!important;margin:0;display:grid;gap:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.slot{position:relative;border:1.5px dashed var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.slot .lab{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pen);font-weight:700}
.slot b{font-family:var(--f-display);font-size:1.08rem}
.slot p{color:var(--muted);font-size:.93rem}
.soon-tag{position:absolute;top:12px;right:12px;font-family:var(--f-hand);font-weight:700;font-size:1.15rem;color:var(--red);transform:rotate(-4deg)}
.done-check{display:flex;gap:10px;align-items:center;font-weight:700;background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:8px;padding:12px 16px;cursor:pointer}
.done-check input{width:20px;height:20px;accent-color:var(--ok)}
.km-t{border-collapse:collapse;width:100%;min-width:620px;table-layout:fixed;font-size:.95rem}
.km-t th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1.5px solid var(--ink)}
.km-t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.km-t td:nth-child(n+3){text-align:center}
.km-t th:nth-child(n+3){text-align:center}
.km-t .kn{font-family:var(--f-mono);font-weight:700;color:var(--pen);white-space:nowrap}
.cc{font-family:var(--f-mono);font-weight:700;font-size:.85rem;text-decoration:none;background:var(--ok-soft);color:var(--ok);border-radius:4px;padding:1px 5px}
.dash{color:var(--line)}
.trap ul{margin:0;padding-left:1.2em}
.chap-card.soon .km{opacity:.6}
.model{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.model-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.model-head h3{font-size:1.15rem}
.model-head .tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pen);font-weight:700}
.model-ctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.model-ctl .op{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;padding-bottom:6px;color:var(--muted)}
.model-ctl .sp{flex:1}
.model-err{color:var(--bad);font-weight:700;font-size:.9rem;padding:0 18px}
.model-err:empty{display:none}
:root{--lv1:#2E9E5B;--lv2:#D79A12;--lv3:#C2362B}
h4{font-family:var(--f-display);font-size:1.05rem;margin:0 0 8px}
.learn h3{margin-top:6px}
table.t.tl td{font-family:var(--f-body);text-align:left;vertical-align:top}
table.t.tl th{text-align:left}
.eq{font-family:var(--f-mono);font-weight:500;background:var(--paper);border-radius:6px;padding:8px 12px;text-align:center;font-size:.95rem}
.muted{color:var(--muted);font-size:.93rem}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig figcaption{font-size:.88rem;color:var(--muted)}
.svgfig{width:100%;height:auto;display:block;color:var(--ink)}
.svgfig .fbox{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.svgfig .fbox.acc,.svgfig .acc .fbox{fill:var(--hl)}
.svgfig .g .fbox{fill:var(--ok-soft);stroke:var(--ok)}
.svgfig .ft{fill:var(--ink);font-family:var(--f-body);font-size:14px}
.svgfig .ft.b{font-weight:700;font-size:15px}
.svgfig .ft.s{font-size:12px;fill:var(--muted)}
.svgfig .ft.tiny{font-size:10px;fill:var(--surface);font-weight:700}
.svgfig .ft.ok{fill:var(--ok)}
.svgfig .fl{stroke:var(--ink);stroke-width:2;fill:none}
.svgfig .fl.ok{stroke:var(--ok)}
.svgfig .fl.acc{stroke:var(--ok)}
.svgfig .fl.dash{stroke-dasharray:6 5}
.svgfig .water{fill:rgba(60,130,220,.25);stroke:rgba(60,130,220,.6)}
.svgfig .pipe{stroke:rgba(60,130,220,.7);stroke-width:12;fill:none}
.svgfig .ax{stroke:var(--muted);stroke-width:1.5}
.svgfig .ln{fill:none;stroke-width:3}
.svgfig .ln.h{stroke:var(--pen)}.svgfig .ln.p{stroke:var(--red)}
.svgfig .dot{fill:var(--pen)}
.svgfig .mean{stroke:var(--red);stroke-width:2;stroke-dasharray:4 3}
.svgfig .spread{fill:var(--pen-soft);stroke:var(--pen)}
.svgfig .shell{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.svgfig .shell.on{stroke:var(--pen);stroke-dasharray:none}
.svgfig .el{fill:var(--pen)}
.svgfig .nuc{fill:var(--red-soft);stroke:var(--red);stroke-width:2}
.legend{display:flex;gap:16px;font-size:.88rem;color:var(--muted)}
.lg::before{content:"";display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.lg.h::before{background:var(--pen)}.lg.p::before{background:var(--red)}
/* model internals */
.m-view{padding:18px;display:flex;flex-direction:column;gap:10px}
.m-exp{padding:0 18px 4px;display:flex;flex-direction:column;gap:8px}
.m-exp:empty{display:none}
.m-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px 16px}
.m-nav:empty{display:none}
.m-count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-right:auto}
.m-nav .m-count{order:-1}
.m-q{font-weight:700}
.field.grow{flex:1;min-width:180px}
.field input[type=range]{width:100%;accent-color:var(--pen)}
.num-in.md{width:7.5rem}
select.num-in.wide{width:auto;min-width:12rem;text-align:left}
.py{display:flex;flex-direction:column;gap:6px;align-items:center}
.py-row{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.35}
.py-row.on{opacity:1}
.py-bar{display:block;height:26px;border-radius:4px;background:var(--ok-soft);border:1.5px solid var(--ok)}
.py-row.cur .py-bar{background:var(--hl);border-color:var(--ink)}
.py-lab{font-size:.88rem}
.bio{display:flex;flex-direction:column;gap:6px}
.bio-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 80px;gap:10px;align-items:center;opacity:.35}
.bio-row.on{opacity:1}
.bio-n{font-size:.92rem}
.bio-bar{height:18px;background:var(--paper);border-radius:4px;overflow:hidden}
.bio-bar i{display:block;height:100%;background:var(--red);border-radius:4px;transition:width .3s}
.bio-v{font-family:var(--f-mono);font-size:.85rem;text-align:right}
ul.sort{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.sort li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
ul.sort li.ok{border-color:var(--ok);background:var(--ok-soft)}
ul.sort li.bad{border-color:var(--bad);background:var(--bad-soft)}
ul.sort li small{flex-basis:100%;color:var(--muted)}
.atom-wrap{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:20px;align-items:center}
@media (max-width:560px){.atom-wrap{grid-template-columns:1fr}}
.atom-card{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--ink);border-radius:8px;padding:14px 16px;background:var(--paper);max-width:220px}
.atom-card .sym{font-family:var(--f-display);font-weight:800;font-size:2.8rem;line-height:1;color:var(--pen)}
.scale{display:flex;flex-direction:column;align-items:center;gap:0}
.vessel{position:relative;width:110px;height:120px;display:flex;align-items:flex-end;justify-content:center}
.vessel.cl{border:3px solid var(--ink);border-top:0;border-radius:0 0 18px 18px;width:80px;height:130px}
.vessel.cl::before{content:"";position:absolute;top:-22px;width:24px;height:22px;border:3px solid var(--ink);border-bottom:0;left:50%;transform:translateX(-50%)}
.vessel.op{border:3px solid var(--ink);border-top:0;border-radius:0 0 40px 40px;height:60px;width:130px;margin-top:70px}
.liq{display:block;width:100%;height:45%;background:rgba(60,130,220,.25);border-radius:0 0 16px 16px}
.vessel.op .liq{height:60%;border-radius:0 0 36px 36px}
.balloon{position:absolute;top:-52px;left:50%;transform:translateX(-50%);width:26px;height:30px;border-radius:50% 50% 45% 45%;background:var(--red);opacity:.8;transition:all .4s}
.balloon.big{width:62px;height:66px;top:-88px}
.bub{position:absolute;bottom:30%;font-size:1.2rem;color:rgba(60,130,220,.9);line-height:.9;text-align:center}
.disp{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;background:var(--ink);color:#7CFFB0;border-radius:6px;padding:6px 18px;margin-top:-2px;border:6px solid var(--line);min-width:170px;text-align:center}
.rmx{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:6px;max-width:340px}
.rlab{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rlab.y{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.rlab.x{grid-column:2;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.rc{aspect-ratio:1;border:2px solid transparent;border-radius:6px;cursor:pointer}
.rc.lo{background:rgba(46,158,91,.35)}.rc.mid{background:rgba(215,154,18,.45)}.rc.hi{background:rgba(194,54,43,.45)}
.rc.sel{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.rc.ans{outline:3px dashed var(--ink);outline-offset:-8px}
.ebar{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1.5px solid var(--ink);font-size:.8rem;font-weight:700}
.ebar.big{height:44px}
.ebar span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;transition:width .3s}
.ebar .e1{background:var(--ok-soft);color:var(--ok)}.ebar .e2{background:var(--red-soft);color:var(--red)}
.ebar .ef{background:rgba(215,154,18,.35)}.ebar .ek{background:rgba(60,130,220,.25)}.ebar .ep{background:rgba(194,54,43,.22)}
.ball-wrap{display:flex;flex-direction:column;gap:10px}
.hazards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hz{margin:0;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.hz svg{width:58px;height:58px;flex:none}
.hz figcaption{display:flex;flex-direction:column;font-size:.85rem;line-height:1.3}
.hz figcaption span{color:var(--muted);font-size:.8rem}
/* ordforklaringer */
dl.defs{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
dl.defs > div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
dl.defs.sm{grid-template-columns:1fr;gap:0}
dl.defs.sm > div{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:12px}
dl.defs.sm > div:last-child{border-bottom:0}
dl.defs dt{font-weight:700}
dl.defs dd{margin:0;color:var(--muted);font-size:.95rem}
@media (max-width:560px){dl.defs.sm > div{grid-template-columns:1fr;gap:2px}}
/* øving */
.trainer{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.trainer-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tr-q{display:flex;flex-direction:column;gap:6px}
.tr-q .eyebrow{display:inline}
.tr-q p{font-size:1.08rem;font-weight:700}
.tr-q i{font-weight:400}
.tr-o{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{font:inherit;text-align:left;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--pen);background:var(--pen-soft)}
.opt:disabled{cursor:default;opacity:.7}
.opt.right{border-color:var(--ok);background:var(--ok-soft);opacity:1;font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:1;text-decoration:line-through}
.fb{border-radius:8px;padding:10px 14px}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.tr-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tr-score{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
/* forsøk */
.labx{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.labx > header{display:flex;flex-direction:column;gap:4px}
.lab-tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--surface);background:var(--pen);border-radius:4px;padding:2px 8px;align-self:flex-start}
.labx h3{font-size:1.5rem;font-weight:800}
.lab-q{font-size:1.05rem}
.vars th{width:34%;font-family:var(--f-body)!important;font-size:.9rem!important;color:var(--ink)!important}
.vars th small{display:block;font-weight:400;color:var(--muted)}
.lab-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px}
@media (max-width:700px){.lab-cols{grid-template-columns:1fr}}
.lab-cols ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.box ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.talk ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
tr.flash td{animation:fl 2s ease}
@keyframes fl{0%,40%{background:var(--hl)}100%{background:transparent}}
.m-view{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px}
.m-exp{margin:12px 18px 0;background:var(--note);border:1.5px dashed var(--note-line);border-radius:8px;padding:12px 16px}
.hazards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
/* forsøksbank */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.lcard:hover{border-color:var(--pen);box-shadow:3px 3px 0 var(--pen)}
.lcard b{font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.lq{color:var(--muted);font-size:.92rem;line-height:1.4}
.lch{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:auto;padding-top:4px}
.ltags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ltype{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 7px;color:#fff;background:var(--pen)}
.ltype.t-feltarbeid{background:#7A5A12}.ltype.t-modell{background:#5B3E99}.ltype.t-demonstrasjon{background:#9C3B2E}.ltype.t-aktivitet{background:#2C6A8A}.ltype.t-programmering{background:#333}
.lmin{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:10px}
.group-head .tally{margin-left:auto}
/* modeller 9.–10. trinn */
pre.code{font-family:var(--f-mono);font-size:.88rem;background:var(--ink);color:#E6F2EA;border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0;line-height:1.55;white-space:pre}
.learn code,.m-exp code{background:var(--pen-soft);border-radius:4px;padding:0 4px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fstep{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);font-weight:700;font-size:.92rem;opacity:.55}
.fstep.done{opacity:.85;border-color:var(--ok)}
.fstep.cur{opacity:1;background:var(--hl);border-color:var(--ink)}
.farr{color:var(--muted)}
.svgfig .sun{fill:#FFC93C;stroke:#E0A400}
.svgfig .atm{fill:rgba(130,170,220,.5)}
.svgfig .ground{transition:fill .3s}
.svgfig .sw{stroke:#E0A400;stroke-width:4;color:#E0A400}
.svgfig .ir{fill:none;stroke-width:3;color:var(--red)}
.svgfig .ir.out{stroke:var(--red);stroke-dasharray:6 4}
.svgfig .ir.back{stroke:var(--red)}
.svgfig .grid{stroke:var(--line);stroke-width:1}
.svgfig .pl{fill:var(--muted)}
.svgfig .hz-zone{fill:var(--ok-soft);stroke:var(--ok);stroke-dasharray:4 3}
.svgfig .ft.tiny2{font-size:9px;fill:var(--muted)}
.mk{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.mk-field{width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#fffdf3 0%,#f3eed6 70%,#d9d2b0 100%);border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mk-cell{display:block;border:3px solid #6f8f3a;background:rgba(160,200,90,.35);border-radius:6px;transition:all .3s}
.cellwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.cellwrap{grid-template-columns:1fr}}
.cellsvg .o{cursor:pointer;stroke:var(--ink);stroke-width:1.5}
.cellsvg .o.sel{stroke:var(--red);stroke-width:4}
.cellsvg .vegg{fill:#C9DDA3}.cellsvg .membran{fill:#F4F1E4}.cellsvg .cyto{fill:#EDE6C8}.cellsvg .vak{fill:#CFE6F5}.cellsvg .kjerne{fill:#C9B8E8}.cellsvg .mito{fill:#F2B38A}.cellsvg .kloro{fill:#6DBE5A}.cellsvg .ribo{fill:#555}.cellsvg .nucleolus{fill:#8C72C2;pointer-events:none}
.olist{display:flex;flex-direction:column;gap:4px}
.ob{font:inherit;text-align:left;display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.92rem}
.ob.on{border-color:var(--red);font-weight:700}
.ob i{width:14px;height:14px;border-radius:3px;border:1px solid var(--ink);flex:none}
.sw-kjerne{background:#C9B8E8}.sw-mito{background:#F2B38A}.sw-ribo{background:#555}.sw-membran{background:#F4F1E4}.sw-cyto{background:#EDE6C8}.sw-vegg{background:#C9DDA3}.sw-kloro{background:#6DBE5A}.sw-vak{background:#CFE6F5}
.preg{display:flex;flex-direction:column;gap:10px}
.preg-bar{height:26px;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.preg-bar i{display:block;height:100%;background:var(--red-soft);border-right:3px solid var(--red);transition:width .3s}
.weeks{display:flex;gap:6px;flex-wrap:wrap}
.weeks span{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
.weeks span.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);margin-left:8px}
.tl-i{display:flex;align-items:baseline;gap:10px;padding:4px 0 4px 16px;position:relative;opacity:.45}
.tl-i.done{opacity:.8}.tl-i.cur{opacity:1}
.tl-dot{position:absolute;left:-7px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl-i.done .tl-dot{background:var(--ok)}.tl-i.cur .tl-dot{background:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.tl-i small{font-family:var(--f-mono);color:var(--muted)}
.plates .plate{stroke:#7A5A3A;stroke-width:22;fill:none}
.plates .plate.ocean{stroke:#3E6E9A}.plates .plate.thick{stroke-width:34}
.plates .plate2{fill:#C8B08A;stroke:#7A5A3A;stroke-width:2}
.plates .magma{stroke:#E8553A;stroke-width:10;fill:none}
.plates .volc{fill:#9C3B2E}.plates .mount{fill:#A08060}
.plates .arw{stroke:var(--ink);stroke-width:4;color:var(--ink)}
.plates .fault{stroke:var(--red);stroke-width:4;stroke-dasharray:8 6}
.moths{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;padding:10px;border-radius:8px}
.moths.l{background:#E9E4D6}.moths.d{background:#3A3630}
.moth{aspect-ratio:1.4;border-radius:50% 50% 40% 40%}
.moth.lt{background:#F7F3E8;border:1px solid #bbb}.moth.dk{background:#1E1B17;border:1px solid #666}
.syn .cellA{fill:rgba(147,181,255,.25);stroke:var(--pen);stroke-width:2}
.syn .cellB{fill:rgba(99,211,152,.2);stroke:var(--ok);stroke-width:2}
.syn .ves{fill:#FFF3C4;stroke:#D79A12}
.syn .nt{fill:#D79A12}
.syn .rec{fill:var(--line)}.syn .rec.on{fill:var(--ok)}
.syn .imp{stroke:#E0A400;stroke-width:6;stroke-dasharray:14 8;fill:none}
.svgfig .normal{fill:var(--ok-soft)}
.svgfig .insbar{fill:rgba(60,130,220,.45)}
.lg.ins::before{background:rgba(60,130,220,.6);height:10px}
.fgrid{display:grid;gap:2px;max-width:420px}
.fc{aspect-ratio:1;border-radius:3px}
.fc.v{background:#7FB6E6}.fc.s{background:#E2E2DA}.fc.i{background:var(--red)}.fc.r{background:#9C8E7E}
.lg2::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:middle}
.lg2.v::before{background:#7FB6E6}.lg2.s::before{background:#E2E2DA}.lg2.i::before{background:var(--red)}.lg2.r::before{background:#9C8E7E}
.legend{flex-wrap:wrap}
ol.algo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:a}
ol.algo li{counter-increment:a;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
ol.algo li::before{content:counter(a)".";font-family:var(--f-mono);color:var(--muted);margin-right:6px}
ol.algo li span:first-of-type{flex:1}
ol.algo li.ok{border-color:var(--ok);background:var(--ok-soft)}ol.algo li.bad{border-color:var(--bad);background:var(--bad-soft)}
.trace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.trace{grid-template-columns:1fr}}
.trace .cl{display:block;padding:0 4px;border-radius:3px}
.trace .cl.on{background:rgba(242,205,74,.35);outline:1px solid #F2CD4A}
.vars2{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}

  <div class="box"><span class="lab">Tre roller i naturen</span><ul>

   <li><b>Konsumenter</b> får næring ved å spise andre organismer. <i>Planteetere</i> er førstekonsumenter, <i>rovdyr</i> som spiser planteetere er andrekonsumenter, og så videre.</li>

  <p>En <b>næringskjede</b> viser én rekke av hvem som spiser hvem. I virkeligheten spiser de fleste dyr flere slags mat og blir spist av flere. Når vi tegner alle sammenhengene, får vi et <b>næringsnett</b>.</p>

  <p>Energien går gjennom systemet, men <b>stoffene</b> brukes om igjen. Karbon er et godt eksempel. Plantene tar opp karbondioksid (CO₂) fra lufta i <b>fotosyntesen</b> og bygger sukker. Dyr og planter bryter ned sukkeret igjen i <b>celleåndingen</b> og slipper ut CO₂. Når organismer dør, sørger nedbryterne for at karbonet kommer tilbake til lufta og jorda.</p>

  <p><b>Miljøgifter</b> er stoffer som er giftige, brytes langsomt ned og hoper seg opp i levende organismer. Eksempler er PCB, kvikksølv og noen plantevernmidler. De lagres ofte i fettet og skilles nesten ikke ut.</p>
  <p>Når et dyr spiser mange byttedyr, får det i seg giftene fra alle sammen. Derfor øker konsentrasjonen for hvert ledd i næringskjeden. Dette kalles <b>bioakkumulering</b> (eller oppkonsentrering).</p>

CONTENT.vitenskap = {
 learn:`<p><b>Vitenskap</b> er en systematisk måte å skaffe kunnskap på. Naturvitenskapen prøver å forklare naturen med observasjoner, målinger og forsøk som andre kan sjekke.</p>
  <div class="box"><span class="lab">Kjennetegn på vitenskapelig kunnskap</span><ul><li><b>Bygger på bevis</b> – observasjoner og data, ikke bare meninger.</li><li><b>Kan testes</b> – en påstand må kunne vise seg å være feil.</li><li><b>Er åpen</b> – metode og resultater publiseres slik at andre kan gjenta forsøkene.</li><li><b>Kan endres</b> – ny kunnskap kan rette opp gammel.</li></ul></div>
  <h3>Hypotese og teori</h3>
  <p>En <b>hypotese</b> er en mulig forklaring som kan testes. En <b>teori</b> er en forklaring som er testet mange ganger og støttes av mye bevis, for eksempel evolusjonsteorien og platetektonikkteorien.</p>
  <div class="trap"><span class="lab">Vanlig feil</span><p>I dagligtale betyr «teori» ofte en gjetning. I naturvitenskapen er en teori noe av det sikreste vi har.</p></div>
  <h3>Forskere jobber sammen</h3>
  <p>Før en forskningsartikkel publiseres, blir den lest av andre eksperter på feltet. Dette kalles <b>fagfellevurdering</b>. De ser etter feil i metode og konklusjoner. Etter publisering kan andre forskere gjenta forsøkene. Uenighet og kritikk er en viktig del av vitenskapen.</p>
  <div class="box"><span class="lab">Eksempel: Semmelweis og håndvask</span><p>I 1847 la legen Ignaz Semmelweis merke til at mange flere mødre døde av barselfeber på en avdeling der leger kom rett fra obduksjoner. Han innførte håndvask med klorkalk, og dødeligheten falt kraftig. Mange leger avviste ideen fordi den ikke passet med det de trodde om sykdom. Først senere, da bakterier ble oppdaget, ble han trodd. Nye ideer kan ta tid å bli akseptert – et skifte i hvordan forskere tenker kalles et <b>paradigmeskifte</b>.</p></div>
  <div class="model" data-model="testbar"></div>
  <div class="rule"><span class="lab">Husk</span><p>Vitenskap gir ikke evige sannheter, men den sikreste kunnskapen vi har akkurat nå.</p></div>`,

  <h3>Variabler</h3>

CONTENT.hjernen = {
 learn:`<p>Hjernen vår er rask og flink til å finne mønstre, men den tar ofte <b>snarveier</b>. Det gjør at vi kan bli lurt – både av øynene og av våre egne tanker. Det er en viktig grunn til at vi trenger naturvitenskapelig metode.</p>
  <h3>Sansene kan lure oss</h3>
  <figure class="fig">${FIG.illusion}<figcaption>Er de grønne strekene like lange? Mål med linjal.</figcaption></figure>
  <p>Et <b>synsbedrag</b> oppstår når hjernen tolker det øynene ser på en feil måte. Hjernen fyller inn hull og bruker sammenhengen rundt for å gjette.</p>
  <div class="model" data-model="illusjon"></div>
  <h3>Tankefeller</h3>
  <ul><li><b>Bekreftelsesfeil:</b> Vi legger mer merke til det som støtter det vi allerede tror, og overser det som ikke passer.</li><li><b>Korrelasjon er ikke årsak:</b> At to ting skjer samtidig, betyr ikke at den ene forårsaker den andre. Is-salget og antall drukningsulykker øker begge om sommeren, men isen er ikke årsaken – varmt vær er.</li><li><b>Tilfeldigheter:</b> Vi ser mønstre selv i tilfeldige ting, som ansikter i skyer.</li><li><b>Enkelthistorier:</b> «Min bestefar røykte og ble 95» sier lite om hva som gjelder for de fleste.</li></ul>
  <div class="model" data-model="aarsak"></div>
  <div class="box"><span class="lab">Placeboeffekten</span><p>Hvis noen tror de får medisin, kan de føle seg bedre selv om pillen er en sukkerpille. Dette kalles <b>placeboeffekten</b>. Derfor tester man medisiner med en kontrollgruppe som får placebo, og helst slik at verken pasienter eller leger vet hvem som får hva (en <b>dobbeltblind</b> studie).</p></div>
  <div class="rule"><span class="lab">Husk</span><p>Metoden er laget for å beskytte oss mot våre egne feil: Mål i stedet for å anslå, bruk kontrollgrupper, gjenta forsøk og la andre sjekke.</p></div>`,

CONTENT.ki = {
 learn:`<p><b>Kunstig intelligens (KI)</b> er dataprogrammer som kan løse oppgaver vi vanligvis tenker krever menneskelig intelligens: kjenne igjen bilder, oversette språk, svare på spørsmål og lage tekst og bilder.</p>
  <h3>Hvordan lærer en maskin?</h3>
  <p>De fleste moderne KI-systemer bruker <b>maskinlæring</b>. I stedet for at en programmerer skriver alle reglene, får programmet store mengder eksempler – <b>treningsdata</b> – og finner selv mønstre. En <b>algoritme</b> er en oppskrift som forteller datamaskinen hvordan den skal gå fram.</p>
  <div class="box"><span class="lab">Eksempel: gjenkjenne sopp</span><ol class="order"><li><span>Programmet får tusenvis av bilder av sopp, merket med artsnavn.</span></li><li><span>Det finner mønstre i farge, form og struktur.</span></li><li><span>Når det får et nytt bilde, gjetter det art og hvor sikkert det er.</span></li></ol></div>
  <div class="trap"><span class="lab">KI kan ta feil</span><ul><li><b>Skjevhet:</b> Er treningsdataene skjeve, blir svarene skjeve. Har programmet nesten bare sett sopp fra Sør-Europa, kan det ta feil om norske arter.</li><li><b>Hallusinering:</b> Språkmodeller kan lage svar som høres riktige ut, men er oppdiktet – også falske kilder.</li><li><b>Ingen forståelse:</b> KI finner mønstre, men vet ikke hva en sopp «er». Spis aldri sopp bare fordi en app sier den er trygg.</li></ul></div>

  <h3>Usikkerhet i målinger</h3>
  <p>Måler flere personer det samme, får de litt forskjellige svar. Derfor tar vi flere målinger og regner ut <b>gjennomsnittet</b>. Hvor mye målingene sprer seg, sier noe om <b>usikkerheten</b>.</p>

  <div class="rule"><span class="lab">Husk</span><p>Et resultat er <b>gjentakbart</b> når andre kan gjøre det samme forsøket og få omtrent samme svar. Da stoler vi mer på det.</p></div>
  <h3>Modeller</h3>
  <p>En <b>modell</b> er en forenklet beskrivelse av virkeligheten. Det kan være en tegning, en fysisk modell, en formel eller et dataprogram. En globus er en modell av jorda. Klimamodeller er dataprogrammer som beregner hvordan klimaet kan endre seg.</p>

   <tr><td>Atommodell med skall</td><td>Forklarer mange egenskaper til grunnstoffer</td><td>Elektronene går ikke i baner som planeter</td></tr></tbody></table></div></div>

CONTENT['kjemiske-stoffer'] = {
 learn:`<p>Det finnes bare rundt 118 grunnstoffer, men millioner av ulike stoffer. Det er fordi atomene kan binde seg sammen på mange måter.</p>
  <div class="box"><span class="lab">Stoffer og blandinger</span><ul><li><b>Grunnstoff:</b> bare én type atomer, for eksempel jern (Fe) og oksygen (O₂).</li><li><b>Kjemisk forbindelse:</b> to eller flere grunnstoffer som er bundet sammen kjemisk, for eksempel vann (H₂O) og koksalt (NaCl).</li><li><b>Blanding:</b> flere stoffer som er blandet uten å binde seg, for eksempel saltvann og luft. Blandinger kan skilles med for eksempel filtrering eller fordamping.</li></ul></div>
  <h3>Kjemiske bindinger</h3>
  <p>Atomer binder seg for å få fullt ytterste skall.</p>
  <ul><li><b>Kovalent binding:</b> Ikke-metaller <i>deler</i> elektroner. Atomene danner <b>molekyler</b>, som vann (H₂O) og karbondioksid (CO₂).</li><li><b>Ionebinding:</b> Et metall <i>gir fra seg</i> elektroner til et ikke-metall. Da blir atomene til ladde partikler, <b>ioner</b>, som trekker hverandre til seg. Natrium blir Na⁺ og klor blir Cl⁻, og sammen danner de salt.</li></ul>
  <div class="model" data-model="ionebinding"></div>
  <div class="rule"><span class="lab">Egenskaper</span><p>Salter (ionebinding) har ofte høyt smeltepunkt og leder strøm når de er løst i vann. Mange molekylære stoffer, som sukker, leder ikke strøm i vann.</p></div>
  <h3>Kjemiske reaksjoner</h3>
  <p>I en <b>kjemisk reaksjon</b> blir stoffene du starter med (<b>reaktantene</b>) til nye stoffer (<b>produktene</b>). Atomene bytter partnere, men ingen atomer forsvinner eller blir laget. Derfor er massen den samme før og etter. Dette kalles <b>massebevaring</b>.</p>

  <div class="model" data-model="masse"></div>
  <h3>Forbrenning</h3>

  <p class="eq">brennstoff + oksygen → karbondioksid + vann + energi</p>
  <p>Forbrenning gir oss varme og energi i motorer og kraftverk, men slipper ut CO₂ som bidrar til klimaendringer. Celleåndingen i kroppen er en langsom «forbrenning» av sukker.</p>
  <div class="trap"><span class="lab">Vanlig feil</span><p>Når et lys brenner ned, ser det ut som stoff forsvinner. Men stearinet blir til gasser (CO₂ og vanndamp) som går ut i lufta. Massen er bevart.</p></div>`,

 // stepper: steps = array of render fns
 function stepper(s, n, render){
  let i=0; const draw=()=>{ render(i); s.nav.innerHTML=`<button class="btn ghost small" data-p ${i===0?'disabled':''}>← Forrige</button><span class="m-count">Steg ${i+1} av ${n()}</span><button class="btn small" data-n ${i>=n()-1?'disabled':''}>Neste steg →</button>`; };

 }

 M.pyramid = el=>{
  const a=uid('py'), b=uid('py');
  const s=shell(el,'Modell','Energien i næringskjeden', num(a,'Energi hos produsentene (kJ)',100000,1000,1000000,1000,'md')+num(b,'Antall ledd',4,2,5,1,'sm'));
  const names=['Produsenter (planter)','1. konsumenter (planteetere)','2. konsumenter (rovdyr)','3. konsumenter (toppredatorer)','4. konsumenter'];
  const E=()=>Math.max(1000,+s.q('#'+a).value||100000), L=()=>Math.min(5,Math.max(2,+s.q('#'+b).value||4));
  const st=stepper(s,()=>L()+1,i=>{
   const e0=E(), n=L(); let rows='';
   for(let k=n-1;k>=0;k--){ const e=e0*Math.pow(.1,k), w=Math.max(4,100*Math.pow(e/e0,.32)); const on=k<=i-1||(i===0&&k===0);

   s.view.innerHTML=`<div class="py">${rows}</div>`;
   if(i===0) s.exp.innerHTML=`<p>Trykk «Neste steg» for å følge energien oppover i næringskjeden. Plantene starter med <b>${nf(e0)} kJ</b> som de har fått fra sola.</p>`;
   else if(i===1) s.exp.innerHTML=`<p>Produsentene har <b>${nf(e0)} kJ</b>. Dette er grunnlaget for hele kjeden.</p>`;
   else { const e=e0*Math.pow(.1,i-1); s.exp.innerHTML=`<p><b>${names[i-1]}</b> får bare 10 % av energien i leddet under: ${nf(e*10)} kJ · 0,1 = <b>${nf(e)} kJ</b>. Resten (${nf(e*9)} kJ) ble brukt til livsprosesser og gikk tapt som varme, eller ble ikke spist.</p>${i===n?`<p class="hand">Bare ${nf(100*e/e0)} % av energien når toppen!</p>`:''}`; }
  });

  const s=shell(el,'Kalkulator','Forstørrelse i mikroskopet', sel(a,'Okular',['10×','15×'])+sel(b,'Objektiv',['4×','10×','40×','100×'])+num(c,'Virkelig størrelse (µm)',50,1,1000,1,'md'));
  const run=()=>{ const ok=[10,15][+s.q('#'+a).value], ob=[4,10,40,100][+s.q('#'+b).value], f=ok*ob, r=+s.q('#'+c).value||50, mm=r*f/1000;
   const px=Math.min(260,Math.max(4,mm*2));
   s.view.innerHTML=`<div class="mk"><div class="mk-field"><span class="mk-cell" style="width:${px}px;height:${px*.7}px"></span></div><div class="atom-card"><span class="sym">${f}×</span><span>${ok} × ${ob} = ${f}</span></div></div>`;
   s.exp.innerHTML=`<p class="eq">${ok} × ${ob} = <b>${f}× forstørrelse</b></p><p>En celle som er ${r} µm (${nf(r/1000)} mm) i virkeligheten, ser ut som om den er ${nf(r/1000)} mm · ${f} = <b>${nf(Math.round(mm*10)/10)} mm</b>.</p><p class="muted">1 mm = 1000 µm (mikrometer). En typisk plantecelle er 20–100 µm, en bakterie 1–10 µm.</p>`; };
  [a,b,c].forEach(x=>s.q('#'+x).addEventListener('input',run)); run();
 };

 M.utvalg = el=>{

  const s=shell(el,'Simulering','Naturlig utvalg hos bjørkemåleren',`<div class="seg" role="group"><button type="button" data-bg="l" aria-pressed="true">Lyse trestammer</button><button type="button" data-bg="d" aria-pressed="false">Sotete trestammer</button></div>`+rng(a,'Andel mørke ved start (%)',10,1,90,1));

  const gen=()=>{ let p=hist[hist.length-1]; const sd=bg==='l'?[0.9,0.6]:[0.6,0.9]; // overlevelse [lys, mørk]
    let n=200, d=0; for(let i=0;i<n;i++){ if(Math.random()<p) d++; } let surL=0,surD=0; for(let i=0;i<n-d;i++) if(Math.random()<sd[0]) surL++; for(let i=0;i<d;i++) if(Math.random()<sd[1]) surD++;
    hist.push((surD)/(surL+surD||1)); };
  const draw=()=>{ const W=600,H=200,x=i=>40+i*(W-60)/20,y=v=>H-24-v*(H-40);
   const cur=hist[hist.length-1], n=40;

   s.nav.innerHTML=`<span class="m-count">Generasjon ${hist.length-1} · ${Math.round(cur*100)} % mørke</span><button class="btn ghost small" data-rs>Start på nytt</button><button class="btn small" data-g ${hist.length>20?'disabled':''}>Neste generasjon →</button><button class="btn small" data-g10 ${hist.length>20?'disabled':''}>+10</button>`;
   s.exp.innerHTML=`<p>Fugler ser og spiser lettest de sommerfuglene som skiller seg ut fra trestammen. På ${bg==='l'?'lyse':'sotete'} stammer overlever ${bg==='l'?'lyse':'mørke'} sommerfugler oftere og får flere avkom. Fargen arves.</p><p class="muted">Simuleringen har tilfeldighet. Kjør flere ganger og sammenlign.</p>`; };

 /* --- næringsnett: fjern en art --- */
 M.naeringsnett = el=>{
  const SP={gras:['Gras',0,60,'p'],bla:['Blåbærlyng',0,200,'p'],tre:['Bjørk',0,340,'p'],mus:['Skogmus',1,100,'k'],hare:['Hare',1,230,'k'],elg:['Elg',1,350,'k'],rev:['Rev',2,60,'r'],ugle:['Hubro',2,180,'r'],gaupe:['Gaupe',2,300,'r']};
  const EAT={mus:['gras','bla'],hare:['gras','bla','tre'],elg:['tre','bla'],rev:['mus','hare'],ugle:['mus','hare'],gaupe:['hare','elg']};
  const s=shell(el,'Fenomen','Næringsnett: hva skjer hvis en art forsvinner?','<span class="muted">Klikk på en art for å fjerne den. Klikk igjen for å sette den tilbake.</span>');
  const gone=new Set();
  const calc=()=>{ const dead=new Set(gone); let ch=true; while(ch){ ch=false; for(const [k,f] of Object.entries(EAT)){ if(!dead.has(k)&&f.every(x=>dead.has(x))){ dead.add(k); ch=true; } } }
   const up=new Set(); for(const k of Object.keys(SP)){ const preds=Object.entries(EAT).filter(([p,f])=>f.includes(k)).map(x=>x[0]); if(!dead.has(k)&&preds.length&&preds.some(p=>gone.has(p))) up.add(k); } return {dead,up}; };
  const draw=()=>{ const {dead,up}=calc(); const X=k=>SP[k][2]+20, Y=k=>200-SP[k][1]*80;
   let e=''; for(const [k,f] of Object.entries(EAT)) f.forEach(x=>{ e+=`<line x1="${X(x)}" y1="${Y(x)-16}" x2="${X(k)}" y2="${Y(k)+16}" class="web${dead.has(k)||dead.has(x)?' off':''}"/>`; });
   s.view.innerHTML=`<svg viewBox="0 0 420 240" class="svgfig web-svg">${e}${Object.entries(SP).map(([k,v])=>`<g class="sp ${v[3]}${dead.has(k)?' dead':''}${gone.has(k)?' rm':''}${up.has(k)?' up':''}" data-sp="${k}" role="button" tabindex="0" aria-label="${v[0]}"><rect x="${X(k)-42}" y="${Y(k)-16}" width="84" height="32" rx="16"/><text x="${X(k)}" y="${Y(k)+5}" text-anchor="middle">${v[0]}</text></g>`).join('')}</svg>`;
   const lost=[...dead].filter(k=>!gone.has(k));
   s.exp.innerHTML=!gone.size?`<p>Pilene går fra mat til den som spiser. Planteeterne har flere matkilder, så nettet tåler en del endringer.</p>`:`<p>Du fjernet: <b>${[...gone].map(k=>SP[k][0]).join(', ')}</b>.</p>${lost.length?`<p>Dette fører til at <b>${lost.map(k=>SP[k][0]).join(', ')}</b> også forsvinner – de har ikke mer mat.</p>`:'<p>Ingen andre arter forsvinner, fordi alle har annen mat å spise.</p>'}${up.size?`<p>Bestanden av <b>${[...up].map(k=>SP[k][0]).join(', ')}</b> kan øke, fordi noen av dem som spiser dem, er borte.</p>`:''}<p class="muted">Jo flere matkilder hver art har, jo mer robust er økosystemet.</p>`; };
  s.view.addEventListener('click',e=>{ const g=e.target.closest('[data-sp]'); if(!g) return; const k=g.dataset.sp; gone.has(k)?gone.delete(k):gone.add(k); draw(); });
  s.view.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ const g=e.target.closest('[data-sp]'); if(g){ e.preventDefault(); g.dispatchEvent(new MouseEvent('click',{bubbles:true})); } } });
  draw();
 };

 M.partikler = el=>{

  for(let i=0;i<N;i++){ const gx=i%8, gy=Math.floor(i/8); P.push({hx:200+gx*22,hy:90+gy*22,x:200+gx*22,y:90+gy*22,vx:Math.random()-.5,vy:Math.random()-.5}); }

   s.view.querySelector('.pstate').innerHTML=`<span class="st ${st==='fast'?'on':''}">Is (fast)</span><span class="st ${st==='flytende'?'on':''}">Vann (flytende)</span><span class="st ${st==='gass'?'on':''}">Vanndamp (gass)</span>`;

   s.exp.innerHTML+=`<p class="muted">Temperatur er et mål på hvor raskt partiklene beveger seg. Ved 0 °C smelter is, og ved 100 °C koker vann (ved vanlig lufttrykk).</p>`; };
  s.q('#'+a).addEventListener('input',upd); upd();

   const sc=Math.max(.55,Math.min(1.35,1+d*0.35)), burst=t==='b'&&c<0.3;

   s.exp.innerHTML=Math.abs(d)<0.15?`<p>Saltinnholdet er omtrent likt inne og ute. Like mye vann går inn som ut – cellen beholder formen.</p>`:d>0?`<p>Det er mindre salt utenfor enn inne i cellen. <b>Vann går inn</b> i cellen ved osmose${t==='b'?(burst?', og den røde blodcellen sprekker!':', og den sveller.'):'. Plantecellen blir stram, men celleveggen hindrer at den sprekker. Det gjør at planter står oppreist.'}</p>`:`<p>Det er mer salt utenfor cellen. <b>Vann går ut</b> av cellen ved osmose, og den ${t==='b'?'skrumper':'mister trykket – membranen trekker seg bort fra celleveggen, og planten visner'}.</p>`;

    <li><a href="#spill" ${cur('spill')}><span>Spill</span><span class="tally">kommer</span></a></li>
    <li><a href="#laerer" ${cur('laerer')}><span>For lærere</span><span class="tally">kommer</span></a></li>`;

}

/* ---------- delkapittel ---------- */
function renderTopic(ch, tid){
  const t=TOPICS[tid], C=has(tid)?CONTENT[tid]:null, ord=ch.topics, idx=ord.indexOf(tid), prev=ord[idx-1], next=ord[idx+1];
  const kmRule=`<div class="rule"><span class="lab">Kompetansemål</span><ul class="kml">${t.km.map(n=>`<li>${kmChip(n)} ${KM[n-1].t}</li>`).join('')}</ul></div>`;
  const learn = C ? `<div class="learn">${C.learn}
        <div class="box"><span class="lab">Ordforklaringer</span><dl class="defs sm">${Object.entries(C.defs).map(([w,d])=>`<div><dt>${w}</dt><dd>${d}</dd></div>`).join('')}</dl></div>${kmRule}</div>`
    : `<div class="learn"><div class="box"><span class="lab">Nøkkelbegreper</span><div class="chips">${t.terms.map(w=>`<span class="chip">${w}</span>`).join('')}</div></div>
        ${slot('Fagtekst','Forklaring med figurer','Kort fagtekst med illustrasjoner og «Husk»-bokser.')}${slot('Modell','Interaktiv modell','Trinnvis modell eller simulering som viser hvordan det henger sammen.')}${kmRule}</div>`;
  const tb=bankFor(ch.id).filter(b=>b.t===tid), own=tb.find(b=>b.id===tid||b.id===tid.replace(/-9$/,'')), more=tb.filter(b=>b!==own);
  const explore = (own?labHTML(own.lab,null,null,own):'') + (C?`<div class="box talk"><span class="lab">Diskuter</span><ul>${C.talk.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'')
    + (!own&&more.length?more.map(b=>labHTML(b.lab,null,null,b)).join(''):'')
    + (own&&more.length?`<div class="group"><h3>Flere forsøk til dette delkapitlet</h3><div class="lgrid">${more.map(labCard).join('')}</div></div>`:'')
    + (!own&&!more.length?`<div class="box"><span class="lab">Forsøksbank</span><p>Det er ikke knyttet egne forsøk til dette delkapitlet. Se <a href="#${ch.id}">forsøkene til kapittel ${ch.num}</a> eller hele <a href="#forsok">forsøksbanken</a>.</p></div>`:'');
  const practice = C ? `<div class="trainer" id="tQuiz"></div><div class="trainer" id="tTerms"></div>`
    : `<div class="slots">${slot('Begreper','Begrepstrening','Koble begrep og forklaring.')}${slot('Oppgaver','Oppgaver på tre nivåer','Nye oppgaver hver gang, med tilbakemelding.')}</div>`;
  main.innerHTML=`<div class="col">
    <nav class="crumb" aria-label="Brødsmuler"><a href="#">Forside</a><span>›</span><a href="#${ch.id}">Kapittel ${ch.num}</a><span>›</span><span>${ch.num}.${idx+1}</span></nav>
    <header class="topic-head"><p class="eyebrow">${ch.title}</p><h1>${t.title}</h1><p class="lede">${t.short}</p>
      <div class="jump"><button class="btn ghost small" data-jump="laer">Lær</button><button class="btn ghost small" data-jump="utforsk">Utforsk</button><button class="btn ghost small" data-jump="ov">Øv</button></div></header>
    <section class="part" id="laer" aria-labelledby="lh"><div class="part-title"><span class="tag">Lær</span><h2 id="lh">Fagstoff</h2></div>${learn}</section>
    <section class="part" id="utforsk" aria-labelledby="uh"><div class="part-title"><span class="tag">Utforsk</span><h2 id="uh">Forsøk og aktiviteter</h2></div>${explore}</section>
    <section class="part" id="ov" aria-labelledby="oh"><div class="part-title"><span class="tag">Øv</span><h2 id="oh">Oppgaver</h2></div>${practice}</section>
    <nav class="pager" aria-label="Neste og forrige">
      ${prev?`<a href="#${ch.id}-${prev}"><span class="eyebrow">← Forrige</span><b>${TOPICS[prev].title}</b></a>`:`<a href="#${ch.id}"><span class="eyebrow">← Tilbake</span><b>Kapittel ${ch.num}</b></a>`}
      ${next?`<a class="next" href="#${ch.id}-${next}"><span class="eyebrow">Neste →</span><b>${TOPICS[next].title}</b></a>`:`<a class="next" href="#${ch.id}"><span class="eyebrow">Ferdig →</span><b>Oversikt kapittel ${ch.num}</b></a>`}
    </nav></div>`;
  if(!C) return;
  main.querySelectorAll('[data-model]').forEach(el=>{ el.setAttribute('role','group'); el.setAttribute('aria-label','Interaktiv modell'); try{ MODELS[el.dataset.model](el); }catch(e){ console.error(e); el.innerHTML='<p class="model-err" style="padding:16px">Modellen kunne ikke vises.</p>'; } });
  const prog=()=>{ const s=topicStat(tid); return s.n>=s.t?`<span class="tally done">✓ Mestret – ${GOAL} riktige</span>`:`<span class="tally">Fremgang: ${s.n} av ${GOAL} riktige</span>`; };
  mountTrainer($('#tQuiz'), quizPool([tid]), {title:'Oppgaver på tre nivåer', progress:prog, onRight(){ ST[tid]=Math.min(GOAL,(ST[tid]||0)+1); save(); renderNav(curRoute); }});
  mountTrainer($('#tTerms'), termPool([tid], ch.topics), {title:'Begrepstrening'});
}

/* ---------- ruting ---------- */
function route(){
  const r=decodeURIComponent(location.hash.slice(1));
  const ch=BOOK.chapters.find(c=>r===c.id||r.startsWith(c.id+'-'));
  let cur='';
  if(ch&&ch.grade!==GRADE) setGrade(ch.grade);
  if(r==='maal'){ renderGoals(); cur=r; }
  else if(r==='forsok'){ renderLabs(); cur=r; }
  else if(r.startsWith('forsok-')&&bankById(r.slice(7))){ renderLab(r.slice(7)); cur='forsok'; }
  else if(r==='spill'||r==='laerer'){ renderSoon(r); cur=r; }
  else if(ch&&r===ch.id){ renderChapter(ch); cur=r; }
  else if(ch&&TOPICS[r.slice(ch.id.length+1)]&&ch.topics.includes(r.slice(ch.id.length+1))){ renderTopic(ch,r.slice(ch.id.length+1)); cur=r; }
  else renderHome();
  curRoute=cur; renderNav(cur); closeMenu(); window.scrollTo(0,0);
  if(location.hash) main.focus({preventScroll:true});
}
main.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.jump){ const t=document.getElementById(b.dataset.jump); if(t) t.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'}); }
  if(b.id==='reset'){ if(b.dataset.arm){ ST={}; save(); route(); } else { b.dataset.arm='1'; b.textContent='Trykk igjen for å slette all fremgang'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arm; b.textContent='Nullstill fremgangen min'; } },4000); } }
});
const menuBtn=$('#menuBtn'), scrim=$('#scrim');
function openMenu(){ side.classList.add('open'); scrim.hidden=false; menuBtn.setAttribute('aria-expanded','true'); const a=side.querySelector('a'); if(a) a.focus(); }
function closeMenu(){ side.classList.remove('open'); scrim.hidden=true; menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.addEventListener('click',()=>side.classList.contains('open')?closeMenu():openMenu());
scrim.addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&side.classList.contains('open')){ closeMenu(); menuBtn.focus(); } });
document.addEventListener('click',e=>{ const b=e.target.closest('[data-grade]'); if(!b) return; const g=+b.dataset.grade; if(g===GRADE) return; setGrade(g);
  const r=decodeURIComponent(location.hash.slice(1)); if(['','maal','forsok','spill','laerer'].includes(r)) route(); else location.hash=''; });
main.addEventListener('click',e=>{ const a=e.target.closest('a.km'); if(a){ e.preventDefault(); const n=a.textContent.slice(2); location.hash='maal'; setTimeout(()=>{ const r=document.getElementById('km'+n); if(r){ r.scrollIntoView({block:'center'}); r.classList.add('flash'); } },60); } });
setGrade(GRADE);
window.addEventListener('hashchange',route);
route();
})();
</script></body></html>
