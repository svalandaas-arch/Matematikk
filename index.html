      <div class="jump"><button class="btn ghost small" data-jump="laer">Lær</button><button class="btn ghost small" data-jump="ov">Øv</button></div></header>
    <section class="part" id="laer" aria-labelledby="lh"><div class="part-title"><span class="tag">Lær</span><h2 id="lh">Slik gjør du det</h2></div>${VIDS.includes(tid)?`<figure class="vid"><video controls preload="none" playsinline poster="video/${tid}.jpg" src="video/${tid}.mp4"></video><figcaption>Video · forklaring med tale, cirka ett minutt</figcaption></figure>`:''}<div class="learn">${t.learn}</div></section>
    <section class="part" id="ov" aria-labelledby="oh"><div class="part-title"><span class="tag">Øv</span><h2 id="oh">Oppgaver</h2></div>
      ${t.trainers.map(x=>`<div class="trainer" data-trainer="${x.id}"></div>`).join('')}</section>
    <nav class="pager" aria-label="Neste og forrige">
      ${prev?`<a href="#${ch.id}-${prev}"><span class="eyebrow">← Forrige</span><b>${TOPICS[prev].title}</b></a>`:`<a href="#${ch.id}"><span class="eyebrow">← Tilbake</span><b>Kapittel ${ch.num}</b></a>`}
      ${next?`<a class="next" href="#${ch.id}-${next}"><span class="eyebrow">Neste →</span><b>${TOPICS[next].title}</b></a>`:`<a class="next" href="#${ch.id}"><span class="eyebrow">Ferdig →</span><b>Oversikt kapittel ${ch.num}</b></a>`}
    </nav></div>`;
  const apis={};
  main.querySelectorAll('[data-model]').forEach(el=>{ el.setAttribute('role','group'); el.setAttribute('aria-label','Trinnvis modell'); try{ apis[el.dataset.model]=MODELS[el.dataset.model](el)||{}; }catch(e){ el.innerHTML='<p class="model-err" style="padding:16px">Modellen kunne ikke vises.</p>'; console.error(e); } });
  const onModel = m => { const api=apis[m.id]; const el=main.querySelector(`[data-model="${m.id}"]`); if(!api||!api.load||!el) return; api.load(m.v); el.scrollIntoView({behavior:reduceMotion()?'auto':'smooth', block:'start'}); };
  main.querySelectorAll('[data-trainer]').forEach(el=>{ try{ mountTrainer(el, el.dataset.trainer, onModel); }catch(e){ console.error(e); } });
}

const deg=d=>d*Math.PI/180;
const pt=(x,y)=>({x,y});
const polyP=(pts)=>pts.map(p=>`${r2(p.x)},${r2(p.y)}`).join(' ');
function arcP(c,r,a0,a1){ // degrees, math orientation (counter-clockwise, y up) mapped to svg (y down)
  const x0=c.x+r*Math.cos(deg(a0)), y0=c.y-r*Math.sin(deg(a0)), x1=c.x+r*Math.cos(deg(a1)), y1=c.y-r*Math.sin(deg(a1)), large=((a1-a0+360)%360)>180?1:0;
  return `M${c.x} ${c.y} L${x0} ${y0} A${r} ${r} 0 ${large} 0 ${x1} ${y1} Z`; }
const angArc=(c,r,a0,a1,cls)=>Math.abs(((a1-a0+360)%360)-90)<0.01?`<path class="${cls||'ang'}" d="M${c.x} ${c.y} L${c.x+r*.7*Math.cos(deg(a0))} ${c.y-r*.7*Math.sin(deg(a0))} L${c.x+r*.7*Math.SQRT2*Math.cos(deg(a0+45))} ${c.y-r*.7*Math.SQRT2*Math.sin(deg(a0+45))} L${c.x+r*.7*Math.cos(deg(a1))} ${c.y-r*.7*Math.sin(deg(a1))} Z"/>`:`<path class="${cls||'ang'}" d="${arcP(c,r,a0,a1)}"/>`;
const dirA=(p,q)=>{ let a=Math.atan2(-(q.y-p.y),q.x-p.x)*180/Math.PI; return (a+360)%360; };
const angAt=(P,A,B,r,cls)=>{ const a0=dirA(P,A), a1=dirA(P,B); let d=(a1-a0+360)%360; return d<=180?angArc(P,r,a0,a1,cls):angArc(P,r,a1,a0,cls); };
const midL=(p,q,t,off,cls)=>{ const mx=(p.x+q.x)/2, my=(p.y+q.y)/2, dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy)||1; return k9t(mx-dy/L*(off||16), my+dx/L*(off||16)+5, t, cls||'tb'); };
// fit polygon(s) into box
function fitPts(sets,W,H,pad){ const all=sets.flat(); const xs=all.map(p=>p.x), ys=all.map(p=>p.y); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const s=Math.min((W-2*pad)/((x1-x0)||1),(H-2*pad)/((y1-y0)||1)); const ox=(W-(x1-x0)*s)/2, oy=(H-(y1-y0)*s)/2;
  return {s, map:p=>pt(ox+(p.x-x0)*s, H-(oy+(p.y-y0)*s))}; }
function regPoly(n,R,cx,cy,rot){ return Array.from({length:n},(_,i)=>pt(cx+R*Math.cos(deg((rot||90)+i*360/n)), cy-R*Math.sin(deg((rot||90)+i*360/n)))); }

/* ---- geometriske mønstre ---- */
function stickFig(kind,n,hiLast){ const u=34, h=Math.round(u*0.866), seg=[];
  if(kind==='kv'){ for(let i=0;i<n;i++){ const x=i*u, nw=i===n-1; if(i===0) seg.push([0,0,0,u,nw]); seg.push([x,0,x+u,0,nw],[x,u,x+u,u,nw],[x+u,0,x+u,u,nw]); } }
  else if(kind==='tr'){ const B=k=>[k*u,h], T=k=>[(k+.5)*u,0]; seg.push([...B(0),...T(0),n===1],[...T(0),...B(1),n===1],[...B(0),...B(1),n===1]);
    for(let i=1;i<n;i++){ const nw=i===n-1; if(i%2){ const j=(i-1)/2; seg.push([...T(j),...T(j+1),nw],[...B(j+1),...T(j+1),nw]); } else { const j=i/2; seg.push([...T(j),...B(j+1),nw],[...B(j),...B(j+1),nw]); } } }
  else { for(let i=0;i<n;i++){ const x=i*u, nw=i===n-1; if(i===0) seg.push([0,0,0,2*u,nw]); seg.push([x,0,x+u,0,nw],[x,u,x+u,u,nw],[x,2*u,x+u,2*u,nw],[x+u,0,x+u,2*u,nw]); } }
  const W=Math.max(...seg.map(q=>Math.max(q[0],q[2])))+8, H=Math.max(...seg.map(q=>Math.max(q[1],q[3])))+8;
  return `<svg class="k9" viewBox="-4 -4 ${W} ${H}" style="width:${W}px;max-width:100%">${seg.map(q=>`<line class="${hiLast&&q[4]&&n>1?'lr':'lp'}" x1="${q[0]}" y1="${q[1]}" x2="${q[2]}" y2="${q[3]}"/>`).join('')}</svg>`; }
const STICK={kv:{t:'Kvadrater på rad',a:3,b:1},tr:{t:'Trekanter på rad',a:2,b:1},dk:{t:'Doble kvadrater',a:5,b:2}};
function mountK9Sticks(el){
  return k9Model(el,{title:'Fyrstikkmønster',modes:[['kv','Kvadrater'],['tr','Trekanter'],['dk','Doble kvadrater']],fields:[{id:'n',label:'Figur nummer',def:4,lo:2,hi:8}],
    rand:()=>({n:rnd(3,8)}),
    steps(v,m){ const S=STICK[m], f=k=>S.a*k+S.b, figsH=k=>`<div class="k9-sp">${Array.from({length:k},(_,i)=>`<figure style="margin:0;text-align:center">${stickFig(m,i+1,true)}<figcaption class="eyebrow">Figur ${i+1} · ${f(i+1)}</figcaption></figure>`).join('')}</div>`;
      const st=[{s:figsH(1),c:`Figur 1 består av <b>${f(1)}</b> fyrstikker.`}];
      for(let k=2;k<=Math.min(3,v.n);k++) st.push({s:figsH(k),c:`Figur ${k} har ${f(k)} fyrstikker. Den nye delen (rød) trenger <b>${S.a}</b> fyrstikker til.`});
      st.push({s:k9htab([['Figur',...Array.from({length:v.n},(_,i)=>i+1)],['Fyrstikker',...Array.from({length:v.n},(_,i)=>f(i+1))]]),c:`I tabellen øker antallet med <b>${S.a}</b> for hver figur. Det er økningen.`});
      st.push({s:eqH(`antall = ${S.a} · n + ${S.b}`)+eqH(`Figur ${v.n}: ${S.a} · ${v.n} + ${S.b} = ${f(v.n)}`),c:`Formelen: ${S.a} fyrstikker for hver figur, pluss <b>${S.b}</b> som er med fra starten. Figur ${v.n} trenger <b>${f(v.n)}</b> fyrstikker.`});

function pythFig(a,b,mode,k){ // right angle at C; legs a (vertical), b (horizontal)
  const f=fitPts([[pt(0,0),pt(b,0),pt(0,a),pt(-a,a),pt(-a,0),pt(b,-b),pt(0,-b),pt(b+a,b),pt(a,a+b)]],460,330,16);
  const M=f.map, C=M(pt(0,0)), Bv=M(pt(b,0)), Av=M(pt(0,a));
  const sqA=[pt(0,0),pt(0,a),pt(-a,a),pt(-a,0)].map(M), sqB=[pt(0,0),pt(b,0),pt(b,-b),pt(0,-b)].map(M), sqC=[pt(0,a),pt(b,0),pt(b+a,b),pt(a,a+b)].map(M);
  let s=''; if(k>=1){ s+=`<polygon class="sh" points="${polyP(sqA)}"/><polygon class="sh" points="${polyP(sqB)}"/>`; } if(k>=2) s+=`<polygon class="sh2" points="${polyP(sqC)}"/>`;
  s+=`<polygon class="shy" points="${polyP([C,Bv,Av])}"/>`+angArc(C,14,0,90);
  const ctr=q=>pt(q.reduce((x,p)=>x+p.x,0)/4,q.reduce((y,p)=>y+p.y,0)/4);
  if(k>=1){ const c1=ctr(sqA), c2=ctr(sqB); s+=k9t(c1.x,c1.y+5,`${k9f(a)}² = ${k9f(r2d(a*a))}`,'tb s')+k9t(c2.x,c2.y+5,`${k9f(b)}² = ${k9f(r2d(b*b))}`,'tb s'); }
  if(k>=2){ const c3=ctr(sqC); s+=k9t(c3.x,c3.y+5,`c² = ${k9f(r2d(a*a+b*b))}`,'r tb s'); }
  s+=midL(C,Av,`${k9f(a)}`,16)+midL(C,Bv,mode==='katet'?'b':`${k9f(b)}`,-16)+midL(Av,Bv,mode==='katet'?'c':'c',16,'r tb');
  return k9svg(460,330,s,'Rettvinklet trekant med kvadrater på sidene'); }
function mountK9Pyth(el,mode){
  const hyp=mode!=='katet';
  return k9Model(el,{title:hyp?'Pytagoras: finn hypotenusen':'Pytagoras: finn en katet',fields:hyp?[{id:'a',label:'Katet a',def:3,lo:1,hi:30,dec:true},{id:'b',label:'Katet b',def:4,lo:1,hi:30,dec:true}]:[{id:'c',label:'Hypotenus c',def:13,lo:2,hi:40,dec:true},{id:'a',label:'Kjent katet a',def:5,lo:1,hi:39,dec:true}],
    rand:()=>{ const t=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[7,24,25]]); return hyp?{a:t[0],b:t[1]}:{c:t[2],a:t[0]}; },
    steps(v,m,e){ if(hyp){ const {a,b}=v, c=Math.sqrt(a*a+b*b);
        return [{s:pythFig(a,b,'hyp',0),c:`En rettvinklet trekant. De to korte sidene kalles <b>kateter</b> (${k9f(a)} og ${k9f(b)}). Den lengste siden, motsatt den rette vinkelen, er <b>hypotenusen</b> c.`},
          {s:pythFig(a,b,'hyp',1),c:`Vi tegner kvadrater på katetene. Arealene er ${k9f(a)}² = ${k9f(r2d(a*a))} og ${k9f(b)}² = ${k9f(r2d(b*b))}.`},
          {s:pythFig(a,b,'hyp',2),c:`<b>Pytagoras-setningen:</b> kvadratet på hypotenusen er like stort som de to andre til sammen: c² = ${k9f(r2d(a*a))} + ${k9f(r2d(b*b))} = <b>${k9f(r2d(a*a+b*b))}</b>.`},
          {s:pythFig(a,b,'hyp',2)+eqH(`c² = a² + b² = ${k9f(r2d(a*a+b*b))}`)+eqH(`c = √${k9f(r2d(a*a+b*b))} ${Number.isInteger(c)?'=':'≈'} ${k9f(r1(c))}`),c:`Vi tar kvadratroten: hypotenusen er <b>${Number.isInteger(c)?'':'omtrent '}${k9f(r1(c))}</b>.`}]; }
      const {c,a}=v; if(a>=c){ e.push('Katetet må være kortere enn hypotenusen.'); return null; } const b=Math.sqrt(c*c-a*a);
      return [{s:pythFig(a,b,'katet',0),c:`Vi kjenner hypotenusen c = ${k9f(c)} og katetet a = ${k9f(a)}. Vi skal finne det andre katetet b.`},
        {s:pythFig(a,b,'katet',2),c:`Pytagoras: a² + b² = c². Det store kvadratet (${k9f(r2d(c*c))}) er like stort som de to små til sammen.`},
        {s:pythFig(a,b,'katet',2)+eqH(`b² = c² − a² = ${k9f(r2d(c*c))} − ${k9f(r2d(a*a))} = ${k9f(r2d(c*c-a*a))}`),c:`Da må b² være det store kvadratet <b>minus</b> det kjente: b² = ${k9f(r2d(c*c-a*a))}.`},
        {s:pythFig(a,b,'katet',2)+eqH(`b = √${k9f(r2d(c*c-a*a))} ${Number.isInteger(b)?'=':'≈'} ${k9f(r1(b))}`),c:`Katetet er <b>${Number.isInteger(b)?'':'omtrent '}${k9f(r1(b))}</b>.`}]; } });

function transFig(kind,k){ const u=26, ox=40, oy=20, W=520, H=230, gx=Math.floor((W-2*ox)/u), gy=Math.floor((H-2*oy)/u); let s='';

 pytagoras:{ title:'Pytagoras-setningen', short:'a² + b² = c² i rettvinklede trekanter.',
  learn:`<p>I en rettvinklet trekant kalles de to korteste sidene <b>kateter</b> og den lengste <b>hypotenus</b>. Pytagoras-setningen sier at kvadratet på hypotenusen er like stort som summen av kvadratene på katetene.</p><div class="model" data-model="k9pythchk"></div>
   <div class="rule"><span class="lab">Pytagoras</span><p class="eq">a² + b² = c²</p><p>Setningen virker også motsatt: stemmer a² + b² = c², er trekanten rettvinklet.</p></div>`, trainers:[{id:'k9pytsjekk'}] },
 hypotenus:{ title:'Regne ut hypotenusen', short:'c = √(a² + b²).',
  learn:`<p>Når vi kjenner begge katetene, finner vi hypotenusen.</p><div class="model" data-model="k9hyp"></div><div class="rule"><span class="lab">Slik gjør du</span><ol class="order"><li><span>Kvadrer katetene.</span></li><li><span>Legg sammen.</span></li><li><span>Ta kvadratroten.</span></li></ol></div>`, trainers:[{id:'k9hyp'}] },
 katet:{ title:'Regne ut en ukjent katet', short:'b = √(c² − a²).',
  learn:`<p>Kjenner vi hypotenusen og én katet, trekker vi fra i stedet for å legge sammen.</p><div class="model" data-model="k9kat"></div><div class="trap"><span class="lab">Sjekk</span><p>En katet er alltid kortere enn hypotenusen. Får du et større tall, har du lagt sammen i stedet for å trekke fra.</p></div>`, trainers:[{id:'k9katet'}] },

Object.assign(WS_HUSK,{'geo-monster':'Finn økningen fra figur til figur. Formel: økning · n + startverdi.','monster-alg':'Lineært mønster: a · n + b. Øker økningen, inneholder formelen n².',vinkler:'Nabovinkler er til sammen 180°. Toppvinkler er like store.',vinkelsum:'Vinkelsum = (n − 2) · 180°. Trekant 180°, firkant 360°.',trekanter:'Likesidet: alle 60°. Likebeint: to like grunnvinkler. Rettvinklet: de to andre er til sammen 90°.',regulare:'Vinkel = (n − 2) · 180° : n. Vinkel i sentrum = 360° : n.',sirkelen:'d = 2r. O = π · d ≈ 3,14 · d.',rektangel:'O = 2l + 2b. A = l · b.',kvadrat:'O = 4s. A = s². s = √A.',parallellogram:'A = g · h. Høyden står vinkelrett på grunnlinja.',trapes:'A = (a + b) · h : 2.','trekant-areal':'A = g · h : 2.','sirkel-areal':'A = π · r². Bruk radien.',pytagoras:'a² + b² = c². c er hypotenusen, den lengste siden.',hypotenus:'c = √(a² + b²).',katet:'b = √(c² − a²).','likebeint-rett':'Hypotenus = katet · √2 ≈ katet · 1,41.','trekant-30-60':'Hypotenus = 2 · korteste side. Lengste katet = korteste side · √3.',kongruens:'Kongruente figurer har samme form og størrelse.',formlikhet:'Formlike figurer har like vinkler, og sidene står i samme forhold.','formlik-sider':'Forstørrelsesfaktor = stor side : samsvarende liten side.',sammensatte:'Del opp figuren, eller regn ut en stor figur og trekk fra.','utforsking-plan':'Tegn en skisse, finn ut om du trenger lengde, omkrets eller areal, og sjekk enhetene.'});
Object.assign(WS_TALK,{'geo-monster':'Lag et eget fyrstikkmønster. Bytt med sidemannen og finn formelen til hverandres mønster.','monster-alg':'Hvorfor øker n² raskere enn 10n når n blir stor? Prøv med n = 5, 10 og 20.',vinkler:'Hvorfor er toppvinkler like store? Forklar med nabovinkler.',vinkelsum:'Hvorfor blir det alltid to færre trekanter enn hjørner?',trekanter:'Kan en trekant ha to rette vinkler? Kan den ha to butte vinkler? Forklar.',regulare:'Hvilke regulære mangekanter kan dekke et gulv uten mellomrom? Hvorfor?',sirkelen:'Mål omkrets og diameter på runde ting hjemme. Del omkretsen på diameteren. Hva får dere?',rektangel:'Kan to rektangler ha samme omkrets, men ulikt areal? Finn eksempler.',kvadrat:'Hva skjer med arealet når siden i et kvadrat dobles?',parallellogram:'Hvorfor kan vi ikke bruke den skrå siden som høyde?',trapes:'Hvordan kan formelen for trapes også gi arealet av et rektangel og en trekant?','trekant-areal':'Tegn tre ulike trekanter med samme grunnlinje og høyde. Hvorfor har de samme areal?','sirkel-areal':'Hva skjer med arealet når radien dobles? Forklar med formelen.',pytagoras:'Hvordan kan en snekker bruke tallene 3, 4 og 5 til å lage et rett hjørne?',hypotenus:'Hvorfor må hypotenusen alltid være den lengste siden?',katet:'Lag en tekstoppgave der dere må finne en ukjent katet.','likebeint-rett':'Hvorfor er diagonalen i et kvadrat alltid siden · √2?','trekant-30-60':'Forklar hvorfor hypotenusen er dobbelt så lang som den korteste kateten.',kongruens:'Finn kongruente figurer i klasserommet. Hvordan kan dere vise at de er kongruente?',formlikhet:'Er alle sirkler formlike? Er alle rektangler formlike? Forklar.','formlik-sider':'Hvordan kan dere måle høyden på skolen med en meterstokk og skyggen?',sammensatte:'Finn to ulike måter å dele den samme figuren på. Får dere samme svar?','utforsking-plan':'Planlegg et nytt gulv eller en vegg hjemme. Hva trenger dere å måle?'});

// skrå parallellprojeksjon: x bortover, z opp, y innover (dybde)
const OBL=0.45, OBA=deg(35);
function boxSVG(l,b,h,o){ o=o||{}; const u=o.u||Math.min(34,300/(l+b*OBL), 210/(h+b*OBL*0.6)), dx=Math.cos(OBA)*OBL*u, dy=Math.sin(OBA)*OBL*u;
  const W=l*u+b*dx+80, H=h*u+b*dy+40, ox=54, oy=H-20, P=(x,y,z)=>pt(ox+x*u+y*dx, oy-z*u-y*dy);
  const face=(pts,cls)=>`<polygon class="${cls}" points="${polyP(pts)}"/>`; let s='';
  const L=o.layers===undefined?h:o.layers;
  if(o.cubes){
    for(let z=0;z<L;z++) for(let y=b-1;y>=0;y--) for(let x=0;x<l;x++){ const c=(X,Y,Z)=>P(x+X,y+Y,z+Z); s+=face([c(0,0,1),c(1,0,1),c(1,1,1),c(0,1,1)],'top')+face([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)],'cube')+face([c(1,0,0),c(1,1,0),c(1,1,1),c(1,0,1)],'sd'); }
    if(L<h) s+=`<polygon class="ln dsh" fill="none" points="${polyP([P(0,0,0),P(l,0,0),P(l,0,h),P(0,0,h)])}"/><polyline class="ln dsh" fill="none" points="${polyP([P(0,0,h),P(0,b,h),P(l,b,h),P(l,0,h)])}"/><line class="ln dsh" x1="${P(l,0,0).x}" y1="${P(l,0,0).y}" x2="${P(l,b,0).x}" y2="${P(l,b,0).y}"/><line class="ln dsh" x1="${P(l,b,0).x}" y1="${P(l,b,0).y}" x2="${P(l,b,h).x}" y2="${P(l,b,h).y}"/>`;
  } else { s+=face([P(0,0,h),P(l,0,h),P(l,b,h),P(0,b,h)],o.hiTop?'sh2':'top')+face([P(0,0,0),P(l,0,0),P(l,0,h),P(0,0,h)],o.hiFront?'sh2':'cube')+face([P(l,0,0),P(l,b,0),P(l,b,h),P(l,0,h)],o.hiSide?'sh2':'sd');
    if(o.hidden) s+=`<polyline class="lt dsh" fill="none" points="${polyP([P(0,b,h),P(0,b,0),P(l,b,0)])}"/><line class="lt dsh" x1="${P(0,0,0).x}" y1="${P(0,0,0).y}" x2="${P(0,b,0).x}" y2="${P(0,b,0).y}"/>`; }
  if(o.labels!==false){ s+=k9t((P(0,0,0).x+P(l,0,0).x)/2,P(0,0,0).y+18,o.ll||`${k9f(l)}`)+k9t(P(0,0,0).x-8,(P(0,0,0).y+P(0,0,h).y)/2+5,o.lh||`${k9f(h)}`,'','end')+k9t((P(l,0,0).x+P(l,b,0).x)/2+12,(P(l,0,0).y+P(l,b,0).y)/2+10,o.lb||`${k9f(b)}`,'','start'); }
  return k9svg(Math.max(W+40,200),H,s,'Prisme'); }
function netSVG(l,b,h,hi){ const u=Math.min(22,460/(2*l+2*b),240/(2*b+h)), ox=20, oy=10; let s='';
  const R=(x,y,w,hh,k)=>`<rect class="${hi&&hi.includes(k)?'sh2':k==='t'||k==='u'?'top':k==='f'||k==='k'?'cube':'sd'}" x="${ox+x*u}" y="${oy+y*u}" width="${w*u}" height="${hh*u}"/>`;
  s+=R(b,0,l,b,'t')+R(0,b,b,h,'v')+R(b,b,l,h,'f')+R(b+l,b,b,h,'h')+R(2*b+l,b,l,h,'k')+R(b,b+h,l,b,'u');
  return k9svg(ox*2+(2*l+2*b)*u,oy*2+(2*b+h)*u,s,'Utbrett prisme'); }
function mountK9Box(el,kind){ const sq=kind==='kv';
  return k9Model(el,{title:sq?'Kvadratisk prisme: volum og overflate':'Rett prisme: volum med enhetsterninger',fields:sq?[{id:'s',label:'Side i grunnflaten',def:3,lo:1,hi:8},{id:'h',label:'Høyde',def:4,lo:1,hi:8}]:[{id:'l',label:'Lengde',def:5,lo:1,hi:8},{id:'b',label:'Bredde',def:3,lo:1,hi:6},{id:'h',label:'Høyde',def:4,lo:1,hi:6}],
    rand:()=>sq?{s:rnd(2,6),h:rnd(2,7)}:{l:rnd(2,7),b:rnd(2,5),h:rnd(2,5)},
    steps(v){ const l=sq?v.s:v.l, b=sq?v.s:v.b, h=v.h, G=l*b, V=G*h;
      const st=[{s:boxSVG(l,b,h,{hidden:true}),c:`Et rett prisme med lengde ${l}, bredde ${b} og høyde ${h} (cm). Hvor mange terninger på 1 cm³ får plass?`},
        {s:boxSVG(l,b,h,{cubes:true,layers:1}),c:`Det nederste laget har ${l} · ${b} = <b>${G}</b> terninger. Det er det samme som arealet av grunnflaten, ${G} cm².`},
        {s:boxSVG(l,b,h,{cubes:true,layers:Math.min(2,h)}),c:`Hvert nye lag har også ${G} terninger.`},
        {s:boxSVG(l,b,h,{cubes:true}),c:`Det er ${h} lag: ${G} · ${h} = <b>${V}</b> terninger.`},
        {s:boxSVG(l,b,h,{})+eqH(`V = G · h = ${l} · ${b} · ${h} = ${V} cm³`),c:`Volumet av et prisme er <b>grunnflate · høyde</b>: V = ${V} cm³.`}];
      if(sq){ const O=2*l*l+4*l*h; st.push({s:netSVG(l,b,h,['t','u'])+eqH(`O = 2 · ${l}² + 4 · ${l} · ${h} = ${2*l*l} + ${4*l*h} = ${O} cm²`),c:`Overflaten: to kvadrater (topp og bunn) og fire like rektangler: <b>${O} cm²</b>.`}); }
      return st; } });
}
function mountK9Net(el){

        {s:netSVG(l,b,h)+eqH(`O = ${2*l*b} + ${2*l*h} + ${2*b*h} = ${O} cm²`),c:`Til sammen: <b>${O} cm²</b>.`}]; } });

function triPrismSVG(g,ht,L,hi){ const u=Math.min(26,250/(g+L*OBL),190/(ht+L*OBL*0.6)), dx=Math.cos(OBA)*OBL*u, dy=Math.sin(OBA)*OBL*u, ox=30, oy=ht*u+L*dy+20, top=g/2;

function mountK9TriPrism(el){

function pyrSVG(s,h,mode){ const u=Math.min(30,230/(s+s*OBL),190/(h+s*OBL*0.6)), dx=Math.cos(OBA)*OBL*u, dy=Math.sin(OBA)*OBL*u, ox=30, oy=h*u+s*dy+20;
  const P=(x,y,z)=>pt(ox+x*u+y*dx, oy-z*u-y*dy), T=P(s/2,s/2,h); let g='';

function mountK9Pyr(el){

      {s:pyrSVG(s,h,0)+eqH(`V = ${F('G · h',3)} = ${F(`${G} · ${h}`,3)} = ${k9f(r2d(V))}`),c:`Pyramiden er en tredel: <b>V = G · h : 3 = ${k9f(r2d(V))}</b>.`}]; } });

function cylSVG(r,h,o){ o=o||{}; const u=Math.min(26,120/r,200/h), R=r*u, ry=R*0.32, cx=R+40, top=ry+12, bot=top+h*u; let s='';

  else { s+=`<path class="cube" d="M${cx-R} ${top} L${cx-R} ${bot} A${R} ${ry} 0 0 0 ${cx+R} ${bot} L${cx+R} ${top}"/><ellipse class="${o.hiTop?'sh2':'top'}" cx="${cx}" cy="${top}" rx="${R}" ry="${ry}"/>`; if(o.layers) for(let i=1;i<h;i++) s+=`<path class="lt" fill="none" d="M${cx-R} ${top+i*u} A${R} ${ry} 0 0 0 ${cx+R} ${top+i*u}"/>`; }
  s+=`<line class="lr" x1="${cx}" y1="${o.cone?bot:top}" x2="${cx+R}" y2="${o.cone?bot:top}"/>`+k9t(cx+R/2,(o.cone?bot:top)-5,`r = ${k9f(r)}`,'r s')+k9t(cx+R+8,(top+bot)/2,`h = ${k9f(h)}`,'s','start');
  return k9svg(cx+R+90,bot+ry+14,s,o.cone?'Kjegle':'Sylinder'); }
function mountK9CylV(el){

    steps(v){ const {r,h}=v, G=PI*r*r, V=G*h; return [{s:cylSVG(r,h),c:`En sylinder er et «rundt prisme». Grunnflaten er en sirkel.`},

function cylNet(r,h,hi){ const u=Math.min(16,380/(2*PI*r),230/(h+4*r)), R=r*u, Wr=2*PI*r*u, ox=20, oy=10; let s=`<circle class="${hi==='c'?'sh2':'top'}" cx="${ox+Wr/2}" cy="${oy+R}" r="${R}"/><rect class="${hi==='m'?'sh2':'cube'}" x="${ox}" y="${oy+2*R}" width="${Wr}" height="${h*u}"/><circle class="${hi==='c'?'sh2':'top'}" cx="${ox+Wr/2}" cy="${oy+2*R+h*u+R}" r="${R}"/>`;

function mountK9CylO(el){

function mountK9Sphere(el){

function mountK9Dens(el){
  return k9Model(el,{title:'Massetetthet',fields:[{id:'s',label:'Terningens side (cm)',def:5,lo:1,hi:20},{id:'m',label:'Masse (g)',def:338,lo:1,hi:99999}],rand:()=>{ const s=rnd(2,8), mat=pick([2.7,7.9,0.9,1,8.9,0.5]); return {s,m:Math.round(s**3*mat)}; },
    steps(v){ const {s,m}=v, V=s**3, rho=m/V; const mats=[['Kork',0.25],['Tre (gran)',0.5],['Is',0.92],['Vann',1],['Aluminium',2.7],['Jern',7.9],['Kobber',8.9],['Gull',19.3]];
      let best=mats[0]; mats.forEach(x=>{ if(Math.abs(x[1]-rho)<Math.abs(best[1]-rho)) best=x; });
      const cube=boxSVG(Math.min(s,6),Math.min(s,6),Math.min(s,6),{ll:`${s} cm`,lh:`${s} cm`,lb:`${s} cm`,u:22});
      return [{s:cube,c:`En terning med side ${s} cm veier ${k9f(m)} g. Hva er den laget av?`},
        {s:cube+eqH(`V = ${s} · ${s} · ${s} = ${V} cm³`),c:`Først finner vi volumet: <b>${V} cm³</b>.`},
        {s:eqH(`ρ = ${F('m','V')} = ${F(k9f(m),V)} = ${k9f(r2d(rho))} g/cm³`),c:`<b>Massetetthet</b> er masse per volum: ρ = m : V = <b>${k9f(r2d(rho))} g/cm³</b>. Det betyr at 1 cm³ veier ${k9f(r2d(rho))} g.`},
        {s:k9tab(['Stoff','g/cm³'],mats.map(x=>[x[0]===best[0]?`<b>${x[0]}</b>`:x[0],x[0]===best[0]?`<b>${k9f(x[1])}</b>`:k9f(x[1])])),c:`Vi sammenligner med en tabell. Massetettheten passer best med <b>${best[0].toLowerCase()}</b>. ${rho<1?'Den flyter i vann, fordi massetettheten er mindre enn 1 g/cm³.':'Den synker i vann.'}`}]; } });
}
function mountK9Units(el){

function mountK9Mult(el){

   else { const g=rnd(8,15), j=rnd(8,15); tot=g+j; fav=pick([g,j]); txt=`<p>I en klasse er det ${g} gutter og ${j} jenter. Én elev trekkes ut tilfeldig. `; desc=fav===g?'en gutt':'en jente'; }
   if(f.t==='mot') return {q:`${txt}Hva er sannsynligheten for at du <b>ikke</b> får ${desc}?</p>`, fr:sfr(tot-fav,tot), steps:[`P(${desc}) = ${F(fav,tot)}`,`P(ikke) = 1 − ${F(fav,tot)} = <b>${frS(tot-fav,tot)}</b>`], model};
   if(f.t==='pst') return {q:`${txt}Hva er sannsynligheten for å få ${desc}? Svar i prosent med én desimal.</p>`, a:Math.round(fav/tot*1000)/10, u:'%', tol:0.051, steps:[`${F(fav,tot)} = ${nf(Math.round(fav/tot*10000)/10000)}`,`= <b>${pctT(fav,tot)}</b>`], model};
   return {q:`${txt}Hva er sannsynligheten for å få ${desc}?</p>`, fr:sfr(fav,tot), steps:[`Gunstige: ${fav}, mulige: ${tot}`,`P = <b>${frEq(fav,tot)}</b>`], model}; } },
 k9flere:{ title:'Flere hendelser', levels:LV3, filters:[{k:'t',label:'Type',opts:[['mynt','Mynter'],['sum','Sum av to terninger'],['tab','Andre terningspill']],def:'sum'}],
  gen(L,f){ if(f.t==='mynt'){ const c=pick(L===1?[['to mynter','to kron',1,4],['to mynter','én kron og én mynt',2,4],['to mynter','minst én mynt',3,4]]:[['tre mynter','tre kron',1,8],['tre mynter','nøyaktig én kron',3,8],['tre mynter','minst én kron',7,8],['to mynter','to like',2,4]]);
     return {q:`Du kaster ${c[0]}. Hva er sannsynligheten for ${c[1]}?`, fr:sfr(c[2],c[3]), steps:[`${c[3]} like sannsynlige utfall`,`${c[2]} gunstige`,`P = <b>${frEq(c[2],c[3])}</b>`], model:c[3]===4?{id:'k9outcomes',v:{mode:'2mynt'}}:null}; }
   if(f.t==='tab'&&L>1){ const c=pick([['produktet er 6',(i,j)=>i*j===6],['produktet er et partall',(i,j)=>i*j%2===0],['differansen mellom tallene er 2',(i,j)=>Math.abs(i-j)===2],['minst én sekser',(i,j)=>i===6||j===6],['begge viser oddetall',(i,j)=>i%2&&j%2],['summen er et primtall',(i,j)=>isPrime(i+j)]]); let k=0; for(let i=1;i<=6;i++) for(let j=1;j<=6;j++) if(c[1](i,j)) k++;
     return {q:`${L===2?diceTab(null,(i,j)=>`${i},${j}`):''}<p>Du kaster to terninger. Hva er sannsynligheten for at ${c[0]}?</p>`, fr:sfr(k,36), steps:[`Tell i 6 · 6-tabellen: ${k} gunstige`,`P = <b>${frEq(k,36)}</b>`]}; }
   const S=L===1?pick([2,3,7,11,12]):rnd(2,12), mode=L===3&&Math.random()<.5?'minst':'sum'; let k=0; for(let i=1;i<=6;i++) for(let j=1;j<=6;j++) if(mode==='sum'?i+j===S:i+j>=S) k++;
   return {q:`${L===1?diceTab():''}<p>Du kaster to terninger og legger sammen. Hva er sannsynligheten for at summen er ${mode==='minst'?'minst ':''}${S}?</p>`, fr:sfr(k,36), steps:[`${k} av 36 utfall`,`P = <b>${frEq(k,36)}</b>`], model:{id:'k9dice2',v:{mode,S}}}; } },
 k9mult:{ title:'Multiplikasjonsprinsippet', levels:LV3, filters:[{k:'t',label:'Type',opts:[['uavh','Uavhengige forsøk'],['med','Med tilbakelegging'],['uten','Uten tilbakelegging']],def:'uavh'}],
  gen(L,f){ if(f.t==='uavh'){ const c=pick(L===1?[['kaster en mynt og en terning','kron og sekser',[[1,2],[1,6]]],['kaster to mynter','kron på begge',[[1,2],[1,2]]],['kaster en mynt og en terning','mynt og et partall',[[1,2],[3,6]]]]:L===2?[['kaster to terninger','to seksere',[[1,6],[1,6]]],['kaster en terning to ganger','partall begge gangene',[[3,6],[3,6]]],['kaster en terning og snurrer et lykkehjul med 4 like felt (ett er rødt)','sekser og rødt',[[1,6],[1,4]]]]:[['kaster en mynt tre ganger','kron alle tre gangene',[[1,2],[1,2],[1,2]]],['kaster en terning tre ganger','sekser alle tre gangene',[[1,6],[1,6],[1,6]]],['kaster to terninger','ingen seksere',[[5,6],[5,6]]],['kaster en terning to ganger','først mer enn 4, så et oddetall',[[2,6],[3,6]]]]);
     const n=c[2].reduce((a,p)=>a*p[0],1), d=c[2].reduce((a,p)=>a*p[1],1);
     return {q:`Du ${c[0]}. Hva er sannsynligheten for ${c[1]}?`, fr:sfr(n,d), steps:[`Uavhengige hendelser: gang sammen`,`${c[2].map(p=>`${p[0]}/${p[1]}`).join(' · ')} = <b>${frEq(n,d)}</b>`]}; }
   const r=rnd(2,L===1?4:7), b=rnd(2,L===1?4:7), N=r+b, med=f.t==='med';
   if(L===3&&!med&&Math.random()<.5){ const n=2*r*b, d=N*(N-1); return {q:`I en pose er det ${r} røde og ${b} blå kuler. Du trekker to kuler uten tilbakelegging. Hva er sannsynligheten for én av hver farge?`, fr:sfr(n,d), steps:[`RB: ${r}/${N} · ${b}/${N-1}`,`BR: ${b}/${N} · ${r}/${N-1}`,`Sum: <b>${frEq(n,d)}</b>`], model:{id:'k9mult',v:{mode:'uten',r,b}}}; }
   const col=pick([0,1]), k=col?b:r, nm=col?'blå':'røde', n=med?k*k:k*(k-1), d=med?N*N:N*(N-1);
   return {q:`I en pose er det ${r} røde og ${b} blå kuler. Du trekker to kuler ${med?'med tilbakelegging':'uten tilbakelegging'}. Hva er sannsynligheten for at begge er ${nm}?`, fr:sfr(n,d), steps:[med?`${k}/${N} · ${k}/${N}`:`${k}/${N} · ${k-1}/${N-1}`,`= <b>${frEq(n,d)}</b>`], model:{id:'k9mult',v:{mode:f.t,r,b}}}; } },
 k9likesann:{ title:'Like sannsynlige utfall', levels:LV3, filters:[{k:'t',label:'Type',opts:[['mc','Like sannsynlige?'],['hjul','Lykkehjul']],def:'mc'}],
  gen(L,f){ if(f.t==='mc'){ const c=pick([['Kaste en vanlig terning og se på antall øyne',0],['Kaste en tegnestift: spissen opp eller ned',1],['Trekke et kort fra en godt blandet kortstokk og se om det er rødt eller svart',0],['Kaste to terninger og se på summen',1],['Kaste en mynt',0],['Om det regner eller ikke i morgen',1],['Trekke et lodd fra en bolle med 10 lodd nummerert 1–10',0],['Kaste to mynter: to kron, to mynt eller én av hver',1],['Snurre et lykkehjul med fire like store felt',0],['Snurre et lykkehjul der det røde feltet er dobbelt så stort som de andre',1],['Kaste en fyrstikkeske og se hvilken side den lander på',1]]);
     return {q:`Er utfallene like sannsynlige? <b>${c[0]}</b>`, mc:{opts:['Ja, like sannsynlige','Nei, ikke like sannsynlige'],a:c[1]}, steps:[c[1]?'Nei: noen utfall har større sjanse enn andre.':'Ja: alle utfallene har like stor sjanse.']}; }
   const sets=L===1?[[180,90,90],[90,90,90,90],[120,120,120],[180,180]]:L===2?[[180,120,60],[90,90,180],[60,60,120,120],[240,60,60]]:[[150,90,120],[45,135,90,90],[30,90,120,120],[72,72,72,144]];
   const sz=shuffle(pick(sets).slice()), k=rnd(0,sz.length-1), nm=['blått','gult','rosa','grønt'][k];
   return {q:`${spinSVG(sz,{deg:true})}<p>Hva er sannsynligheten for at lykkehjulet stopper på det ${nm} feltet (felt nr. ${k+1} med klokka fra toppen)?</p>`, fr:sfr(sz[k],360), steps:[`Feltet er ${sz[k]}° av 360°`,`P = ${F(sz[k],360)} = <b>${frS(sz[k],360)}</b>`], model:{id:'k9fair',v:{sz:sz.map(x=>x/gcdA(sz)).join(', ')}}}; } },
 k9statsann:{ title:'Sannsynlighet fra statistikk', levels:LV3, filters:[{k:'t',label:'Type',opts:[['rel','Relativ frekvens'],['forv','Forventet antall'],['velg','Beste estimat']],def:'rel'}],
  gen(L,f){ if(f.t==='rel'){ const n=pick(L===1?[20,50,100]:[40,80,120,250,400]), k=rnd(Math.round(n*.3),Math.round(n*.75)), c=pick([['en tegnestift','med spissen opp'],['en kopp','med bunnen ned'],['en flaskekork','med åpningen opp']]);
     return {q:`${NAVN[rnd(0,NAVN.length-1)]} kastet ${c[0]} ${n} ganger. Den landet ${c[1]} ${k} ganger. Hva er den relative frekvensen? Svar i prosent${n===20||n===50||n===100?'':' med én desimal'}.`, a:Math.round(k/n*1000)/10, u:'%', tol:0.051, steps:[`${k} : ${n} = ${nf(Math.round(k/n*10000)/10000)}`,`= <b>${pctT(k,n)}</b>`], model:{id:'k9relfreq',v:{n,k,ny:1000}}}; }
   if(f.t==='forv'){ const c=pick([['Erfaring viser at {p} % av eggene i en eske er knust.','egg','er knust'],['{p} % av elevene på en skole sykler til skolen.','elever','sykler'],['En fabrikk vet at {p} % av lyspærene er defekte.','lyspærer','er defekte']]), p=pick(L===1?[10,20,25,50]:[4,6,12,15,35]), N=pick(L===1?[100,200,300]:[150,250,400,1200]);
     return {q:`${c[0].replace('{p}',p)} Hvor mange av ${N} ${c[1]} kan vi forvente ${c[2]}?`, a:Math.round(p*N/100*10)/10, tol:0.051, steps:[`${nf(p/100)} · ${N} = <b>${nf(p*N/100)}</b>`]}; }
   const ns=shuffle([rnd(10,30),rnd(40,90),rnd(300,800)]), names=shuffle(NAVN.slice()).slice(0,3), best=ns.indexOf(Math.max(...ns));
   return {q:`Tre elever kastet en tegnestift for å finne sannsynligheten for «spissen opp». ${names.map((x,i)=>`${x} kastet ${ns[i]} ganger`).join(', ')}. Hvem har det beste estimatet?`, mc:{opts:names,a:best}, steps:[`Flest forsøk gir det sikreste estimatet: ${names[best]}`]}; } },
 k9simq:{ title:'Simulering', levels:LV3, filters:[{k:'t',label:'Type',opts:[['forv','Forventet antall'],['est','Fra simulering'],['begrep','Store talls lov']],def:'forv'}],
  gen(L,f){ if(f.t==='forv'){ const c=pick(L===1?[['kaster en mynt','kron',2,[50,100,200]],['kaster en terning','sekser',6,[60,120,300]]]:[['kaster en terning','partall',2,[300,500]],['kaster to mynter','to kron',4,[200,400,1000]],['kaster en terning','mer enn 4',3,[300,900]],['kaster to terninger','summen 7',6,[360,1200]]]), N=pick(c[3]);
     return {q:`Du ${c[0]} ${N} ganger. Omtrent hvor mange ganger kan du forvente å få ${c[1]}?`, a:N/c[2], steps:[`P = 1/${c[2]}`,`${N} · 1/${c[2]} = <b>${N/c[2]}</b>`], model:L===1?{id:'k9sim',v:{mode:c[1]==='kron'?'mynt':'terning',n:Math.max(100,N)}}:null}; }
   if(f.t==='est'){ const n=pick([500,1000,2000]), p=pick([0.12,0.18,0.24,0.3]), k=Math.round(n*(p+(Math.random()-.5)*.04));
     return {q:`En datamaskin simulerte ${nf(n)} straffespark. Keeperen reddet ${nf(k)} av dem. Hva er den relative frekvensen for redning? Svar med tre desimaler.`, a:Math.round(k/n*1000)/1000, tol:0.0011, steps:[`${nf(k)} : ${nf(n)} = <b>${nf(Math.round(k/n*1000)/1000)}</b>`]}; }
   const c=pick([['Jo flere forsøk, desto nærmere kommer den relative frekvensen sannsynligheten.',0],['Har du fått kron fem ganger på rad, er det større sjanse for mynt neste gang.',1],['Kaster du en terning 6 ganger, får du alltid nøyaktig én sekser.',1],['En simulering kan brukes til å anslå sannsynligheter som er vanskelige å regne ut.',0],['Med 10 kast er den relative frekvensen alltid lik sannsynligheten.',1],['Mynten husker ikke hva den landet på sist.',0]]);

      <div class="g-tbar"><span class="g-count" data-g="count" aria-live="polite"></span><button type="button" class="btn ghost small" data-all="1">Velg alle</button><button type="button" class="btn ghost small" data-all="0">Fjern alle</button></div>
      <div class="g-chaps">${CHS().map(ch=>`<fieldset class="g-chap"><legend><label class="g-chk g-chk-ch"><input type="checkbox" data-ch="${ch.id}"><span>Kapittel ${ch.num} · ${ch.title}</span></label></legend><div class="g-tops">${chips(ch)}</div></fieldset>`).join('')}</div></section>
    <section class="g-step" aria-labelledby="gs2"><div class="g-step-h"><span class="g-n">2</span><h2 id="gs2">Velg nivå på spørsmålene</h2></div>
      <div class="seg" role="group" aria-labelledby="gs2">${[1,2,3].map(n=>`<button type="button" data-lv="${n}" aria-pressed="${GS.L===n}">Nivå ${n}</button>`).join('')}</div></section>
    <section class="g-step" aria-labelledby="gs3"><div class="g-step-h"><span class="g-n">3</span><h2 id="gs3">Velg spill</h2></div>
      <p class="g-warn" data-g="warn" hidden>Kryss av for minst ett tema i steg 1 før du velger spill.</p>
      <div class="g-pick">${GAMES.map(g=>`<button type="button" class="g-tile" data-game="${g.id}" aria-pressed="false"><span class="g-ico">${g.icon}</span><span class="g-name">${g.name}</span><span class="g-desc">${g.desc}</span><span class="g-best">Rekord: <b data-best="${g.id}">${GS.best[g.id]||0}</b></span></button>`).join('')}</div></section>
    <section class="g-wrap" data-g="wrap" aria-label="Spill"></section>
    <p class="g-note">Rekordene lagres bare i denne nettleseren.</p></div>`;
  const wrap=main.querySelector('[data-g=wrap]'), warn=main.querySelector('[data-g=warn]');
  const sync=()=>{ const n=curTopics().length, tot=ALLT().length;
    main.querySelector('[data-g=count]').textContent=n===tot?`Alle ${tot} delkapitler er valgt`:`${n} av ${tot} delkapitler valgt`;
    CHS().forEach(ch=>{ const ts=order(ch), k=ts.filter(t=>GS.topics.includes(t)).length, cb=main.querySelector(`[data-ch="${ch.id}"]`); cb.checked=k===ts.length; cb.indeterminate=k>0&&k<ts.length; });
    main.querySelectorAll('[data-t]').forEach(cb=>{ cb.checked=GS.topics.includes(cb.dataset.t); });
    const none=!n; warn.hidden=!none; main.querySelectorAll('[data-game]').forEach(b=>b.setAttribute('aria-disabled',String(none)));
    if(none&&GAME){ GAME.destroy(); GAME=null; wrap.innerHTML=''; main.querySelectorAll('[data-game]').forEach(x=>x.setAttribute('aria-pressed','false')); }
    gSave(GS); };
  const setT=(list,on)=>{ const s=new Set(GS.topics); list.forEach(t=>on?s.add(t):s.delete(t)); GS.topics=[...GS.topics.filter(t=>!ALLT().includes(t)),...ALLT().filter(t=>s.has(t))]; sync(); };
  main.querySelectorAll('[data-t]').forEach(cb=>cb.addEventListener('change',()=>setT([cb.dataset.t],cb.checked)));
  main.querySelectorAll('[data-ch]').forEach(cb=>cb.addEventListener('change',()=>{ const ch=BOOK.chapters.find(c=>c.id===cb.dataset.ch); setT(order(ch),cb.checked); }));
  main.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>setT(ALLT(),b.dataset.all==='1')));
  main.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>{ GS.L=+b.dataset.lv; gSave(GS); main.querySelectorAll('[data-lv]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }));
  const pick=id=>{ if(!curTopics().length){ warn.hidden=false; warn.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'center'}); return; }
    GS.game=id; gSave(GS); main.querySelectorAll('[data-game]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.game===id))); if(GAME) GAME.destroy(); GAME=id==='monster'?mountMonsters(wrap):mountGame(wrap,id);
    wrap.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'nearest'}); };
  main.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.game)));
  sync();
}
function route(){
  const r=decodeURIComponent(location.hash.slice(1));
  const ch=BOOK.chapters.find(c=>r===c.id||r.startsWith(c.id+'-'));
  let cur='';
  if(GAME){ GAME.destroy(); GAME=null; }
  if(ch&&gradeOf(ch)!==GRADE) setGrade(gradeOf(ch));
  if (r==='laerer'){ renderTeacher(); cur=r; }
  else if (r==='spill'){ renderGames(); cur=r; }
  else if (ch && r===ch.id){ renderChapter(ch); cur=r; }
  else if (ch && TOPICS[r.slice(ch.id.length+1)]){ renderTopic(ch, r.slice(ch.id.length+1)); cur=r; }
  else renderHome();
  curRoute=cur; renderNav(cur); closeMenu(); window.scrollTo(0,0);
  if (location.hash) main.focus({preventScroll:true});
}
main.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if (b.dataset.jump){ const t=document.getElementById(b.dataset.jump); if(t) t.scrollIntoView({behavior:reduceMotion()?'auto':'smooth', block:'start'}); }
  if (b.id==='reset'){ if(b.dataset.arm){ ST={}; save(); route(); } else { b.dataset.arm='1'; b.textContent='Trykk igjen for å slette all fremgang'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arm; b.textContent='Nullstill fremgangen min'; } },4000); } }
});
const menuBtn=$('#menuBtn'), scrim=$('#scrim');

menuBtn.addEventListener('click', ()=> side.classList.contains('open')?closeMenu():openMenu());
scrim.addEventListener('click', closeMenu);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&side.classList.contains('open')){ closeMenu(); menuBtn.focus(); } });

document.addEventListener('click',e=>{ const b=e.target.closest('[data-grade]'); if(!b) return; const g=+b.dataset.grade; if(g===GRADE) return; setGrade(g);
  const r=decodeURIComponent(location.hash.slice(1)); if(r==='laerer'||r==='spill'||r==='') route(); else location.hash=''; });
setGrade(GRADE);
window.addEventListener('hashchange', route);
route();
