  trainers:[{id:'likning'}] },
 problemlosning:{ title:'Problemløsning med likninger', short:'Fra tekst via strimmeldiagram til likning.',
  learn:`<p>En likning er et godt verktøy for tekstoppgaver. Et <b>strimmeldiagram</b> hjelper deg å se hvordan tallene henger sammen før du skriver likningen.</p>
   <div class="rule"><span class="lab">Fem steg</span><ol class="order"><li><span>Les oppgaven og finn ut hva du skal finne.</span></li><li><span>Tegn et strimmeldiagram.</span></li><li><span>Kall det ukjente tallet x.</span></li><li><span>Sett opp likningen og løs den.</span></li><li><span>Svar med hele setninger og sjekk at svaret passer.</span></li></ol></div>
   <div class="model" data-model="tape"></div>`,
  trainers:[{id:'problem'}] },
 koordinater:{ title:'Koordinatsystemet', short:'Punkter, akser, origo og kvadranter.',
  learn:`<p>Et <b>koordinatsystem</b> har en vannrett x-akse og en loddrett y-akse. De krysser i <b>origo</b>, (0, 0). Hvert punkt har to koordinater: (x, y).</p>
   <div class="model" data-model="coord"></div>

  trainers:[{id:'koord'}] },
 funksjonsuttrykk:{ title:'Fra situasjon til funksjon', short:'Tekst, tabell, graf og formel.',
  learn:`<p>En <b>funksjon</b> er en regel som gir ett svar for hver verdi vi setter inn. Den samme funksjonen kan vises på fire måter: med ord, i en tabell, som graf og som formel.</p>
   <div class="model" data-model="situation"></div>

 grafer:{ title:'Tegne grafer', short:'Verditabell, punkter, stigningstall og konstantledd.',
  learn:`<p>Grafen til en lineær funksjon er en rett linje. Vi kan tegne den med en verditabell, eller ved å bruke konstantleddet og stigningstallet direkte.</p>

 diagrammer:{ title:'Avlesing og tolking', short:'Les av og forklar grafer og diagrammer fra hverdagen.',

/* ===================== pages ===================== */
const $ = s => document.querySelector(s);
const main=$('#main'), side=$('#side');
function chapterOf(tid){ for(const ch of BOOK.chapters) for(const g of ch.groups) if(g.topics.includes(tid)) return {ch,g}; }
const order = ch => ch.groups.flatMap(g=>g.topics);
const gradeOf = ch => (ch&&ch.grade)||8;
let GRADE=(()=>{ try{ const g=+localStorage.getItem('mat8-grade'); return g===9||g===10?g:8; }catch(e){ return 8; } })();
const setGrade=g=>{ GRADE=g; try{ localStorage.setItem('mat8-grade',String(g)); }catch(e){} document.title=`Matematikk ${g}. trinn`; };
const CHS = () => BOOK.chapters.filter(c=>gradeOf(c)===GRADE);
const gradeTids = (g) => BOOK.chapters.filter(c=>gradeOf(c)===(g||GRADE)).flatMap(order);
const gradeSw = () => `<div class="grade-sw" role="group" aria-label="Velg trinn">${[8,9,10].map(g=>`<button type="button" data-grade="${g}" aria-pressed="${GRADE===g}">${g}. trinn</button>`).join('')}</div>`;
const bar = s => `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${s.t}" aria-valuenow="${s.n}" aria-label="${pct(s)} prosent fullført"><i style="width:${pct(s)}%"></i></div>`;
const tally = s => s.t && s.n>=s.t ? `<span class="tally done">✓ mestret</span>` : `<span class="tally">${pct(s)} %</span>`;
let curRoute='';
function renderNav(route){
  let h=`<a class="brand-big" href="#">Matematikk<small>${GRADE}. trinn</small></a>${gradeSw()}<ul class="nav"><li><a href="#" ${route===''?'aria-current="page"':''}><span>Forside</span></a></li><li><a href="#spill" ${route==='spill'?'aria-current="page"':''}><span>Spill</span><span class="tally">5 spill</span></a></li><li><a href="#aktiviteter" ${route==='aktiviteter'?'aria-current="page"':''}><span>Klasseaktiviteter</span><span class="tally">${ACTS.length} opplegg</span></a></li><li><a href="#laerer" ${route==='laerer'?'aria-current="page"':''}><span>For lærere</span><span class="tally">PDF</span></a></li>`;
  CHS().forEach(ch=>{
    h+=`<li><a class="chap" href="#${ch.id}" ${route===ch.id?'aria-current="page"':''}><span>Kap ${ch.num} · ${ch.title}</span></a></li>`;
    ch.groups.forEach(g=>{ h+=`<li class="grp">${g.title}</li>`; g.topics.forEach(tid=>{ const r=`${ch.id}-${tid}`; h+=`<li class="sub"><a href="#${r}" ${route===r?'aria-current="page"':''}><span>${TOPICS[tid].title}</span>${tally(topicStat(tid))}</a></li>`; }); });
  });
  side.innerHTML = h+`</ul>`;
}
function refreshNav(){ renderNav(curRoute); }
function renderHome(){
  const CH=CHS(), ch=CH.find(c=>chapterStat(c).n<chapterStat(c).t)||CH[0], started=CH.some(c=>chapterStat(c).n>0);
  main.innerHTML=`<div class="col">
    <header class="home-hero"><p class="eyebrow">Digital lærebok · ${GRADE}. trinn</p><h1>Matematikk <span class="hl">${GRADE}. trinn</span></h1>

function textTasks(tid,L,k){
  const pool=(TP[tid]||[]).map((t,i)=>({t,i})).filter(o=>o.t[0]<=L&&L<=o.t[1]);
  const out=[], seen=new Set(); let round=0;
  while(out.length<k&&round<6&&pool.length){ round++;
    for(const o of pool.slice().sort(()=>Math.random()-.5)){ if(out.length>=k) break; if(round===1&&out.some(x=>x.i===o.i)) continue;
      let r=null; for(let g=0;g<8&&!r;g++){ try{ const x=o.t[2](L); if(x&&!seen.has(x[0])) r=x; }catch(e){} }
      if(!r) continue; seen.add(r[0]); out.push({i:o.i,q:r[0],a:r[1],steps:r[2]||[],w:r[3]||'s'}); } }

 k9sektor:{ title:'Sektordiagram', levels:LV3, filters:[{k:'t',label:'Type',opts:[['grad','Finn vinkelen'],['pst','Fra vinkel til prosent'],['antall','Fra vinkel til antall']],def:'grad'}],

 datasett:{ title:'Data og datasett', short:'Rådata, frekvens og relativ frekvens.',
  learn:`<p>Når vi samler inn svar i en undersøkelse, får vi <b>data</b>. Alle svarene til sammen kalles et <b>datasett</b>. For å se mønstre sorterer vi dataene og lager en <b>frekvenstabell</b>.</p>

   <div class="box"><span class="lab">Kategoriske og numeriske data</span><p><b>Numeriske data</b> er tall vi kan regne med, for eksempel antall søsken. <b>Kategoriske data</b> er ord eller grupper, for eksempel favorittfarge.</p></div>`,

  learn:`<p>Et <b>sentralmål</b> er ett tall som beskriver hva som er «typisk» i et datasett. Et <b>spredningsmål</b> viser hvor mye dataene varierer.</p>
   <div class="model" data-model="k9central"></div>

  trainers:[{id:'k9sentral'}] },
 linjediagram:{ title:'Linjediagram', short:'Vis utvikling over tid.',
  learn:`<p>Et <b>linjediagram</b> viser hvordan noe endrer seg over tid. Tiden står langs x-aksen, og punktene bindes sammen med linjer.</p>

   <div class="model" data-model="k9bar"></div>
   <div class="rule"><span class="lab">Husk</span><ul><li>Stolpene skal være like brede og ha lik avstand.</li><li>Skalaen på y-aksen skal starte på 0.</li><li>Skriv navn på kategoriene og hva y-aksen viser.</li></ul></div>`,
  trainers:[{id:'k9stolpe'}] },

const deg=d=>d*Math.PI/180;

function arcP(c,r,a0,a1){ // degrees, math orientation (counter-clockwise, y up) mapped to svg (y down)
  const x0=c.x+r*Math.cos(deg(a0)), y0=c.y-r*Math.sin(deg(a0)), x1=c.x+r*Math.cos(deg(a1)), y1=c.y-r*Math.sin(deg(a1)), large=((a1-a0+360)%360)>180?1:0;

function fitPts(sets,W,H,pad){ const all=sets.flat(); const xs=all.map(p=>p.x), ys=all.map(p=>p.y); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const s=Math.min((W-2*pad)/((x1-x0)||1),(H-2*pad)/((y1-y0)||1)); const ox=(W-(x1-x0)*s)/2, oy=(H-(y1-y0)*s)/2;

/* ---- Pytagoras ---- */
function pythFig(a,b,mode,k){ // right angle at C; legs a (vertical), b (horizontal)
  const f=fitPts([[pt(0,0),pt(b,0),pt(0,a),pt(-a,a),pt(-a,0),pt(b,-b),pt(0,-b),pt(b+a,b),pt(a,a+b)]],460,330,16);

  const sqA=[pt(0,0),pt(0,a),pt(-a,a),pt(-a,0)].map(M), sqB=[pt(0,0),pt(b,0),pt(b,-b),pt(0,-b)].map(M), sqC=[pt(0,a),pt(b,0),pt(b+a,b),pt(a,a+b)].map(M);
  let s=''; if(k>=1){ s+=`<polygon class="sh" points="${polyP(sqA)}"/><polygon class="sh" points="${polyP(sqB)}"/>`; } if(k>=2) s+=`<polygon class="sh2" points="${polyP(sqC)}"/>`;
  s+=`<polygon class="shy" points="${polyP([C,Bv,Av])}"/>`+angArc(C,14,0,90);
  const ctr=q=>pt(q.reduce((x,p)=>x+p.x,0)/4,q.reduce((y,p)=>y+p.y,0)/4);
  if(k>=1){ const c1=ctr(sqA), c2=ctr(sqB); s+=k9t(c1.x,c1.y+5,`${k9f(a)}² = ${k9f(r2d(a*a))}`,'tb s')+k9t(c2.x,c2.y+5,`${k9f(b)}² = ${k9f(r2d(b*b))}`,'tb s'); }
  if(k>=2){ const c3=ctr(sqC); s+=k9t(c3.x,c3.y+5,`c² = ${k9f(r2d(a*a+b*b))}`,'r tb s'); }
  s+=midL(C,Av,`${k9f(a)}`,16)+midL(C,Bv,mode==='katet'?'b':`${k9f(b)}`,-16)+midL(Av,Bv,mode==='katet'?'c':'c',16,'r tb');
  return k9svg(460,330,s,'Rettvinklet trekant med kvadrater på sidene'); }
function mountK9Pyth(el,mode){
  const hyp=mode!=='katet';
  return k9Model(el,{title:hyp?'Pytagoras: finn hypotenusen':'Pytagoras: finn en katet',fields:hyp?[{id:'a',label:'Katet a',def:3,lo:1,hi:30,dec:true},{id:'b',label:'Katet b',def:4,lo:1,hi:30,dec:true}]:[{id:'c',label:'Hypotenus c',def:13,lo:2,hi:40,dec:true},{id:'a',label:'Kjent katet a',def:5,lo:1,hi:39,dec:true}],
    rand:()=>{ const t=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[7,24,25]]); return hyp?{a:t[0],b:t[1]}:{c:t[2],a:t[0]}; },
    steps(v,m,e){ if(hyp){ const {a,b}=v, c=Math.sqrt(a*a+b*b);
        return [{s:pythFig(a,b,'hyp',0),c:`En rettvinklet trekant. De to korte sidene kalles <b>kateter</b> (${k9f(a)} og ${k9f(b)}). Den lengste siden, motsatt den rette vinkelen, er <b>hypotenusen</b> c.`},
          {s:pythFig(a,b,'hyp',1),c:`Vi tegner kvadrater på katetene. Arealene er ${k9f(a)}² = ${k9f(r2d(a*a))} og ${k9f(b)}² = ${k9f(r2d(b*b))}.`},
          {s:pythFig(a,b,'hyp',2),c:`<b>Pytagoras-setningen:</b> kvadratet på hypotenusen er like stort som de to andre til sammen: c² = ${k9f(r2d(a*a))} + ${k9f(r2d(b*b))} = <b>${k9f(r2d(a*a+b*b))}</b>.`},
          {s:pythFig(a,b,'hyp',2)+eqH(`c² = a² + b² = ${k9f(r2d(a*a+b*b))}`)+eqH(`c = √${k9f(r2d(a*a+b*b))} ${Number.isInteger(c)?'=':'≈'} ${k9f(r1(c))}`),c:`Vi tar kvadratroten: hypotenusen er <b>${Number.isInteger(c)?'':'omtrent '}${k9f(r1(c))}</b>.`}]; }
      const {c,a}=v; if(a>=c){ e.push('Katetet må være kortere enn hypotenusen.'); return null; } const b=Math.sqrt(c*c-a*a);

        {s:pythFig(a,b,'katet',2),c:`Pytagoras: a² + b² = c². Det store kvadratet (${k9f(r2d(c*c))}) er like stort som de to små til sammen.`},

        {s:pythFig(a,b,'katet',2)+eqH(`b = √${k9f(r2d(c*c-a*a))} ${Number.isInteger(b)?'=':'≈'} ${k9f(r1(b))}`),c:`Katetet er <b>${Number.isInteger(b)?'':'omtrent '}${k9f(r1(b))}</b>.`}]; } });

function transFig(kind,k){ const u=26, ox=40, oy=20, W=520, H=230, gx=Math.floor((W-2*ox)/u), gy=Math.floor((H-2*oy)/u); let s='';
  for(let i=0;i<=gx;i++) s+=`<line class="grid" x1="${ox+i*u}" y1="${oy}" x2="${ox+i*u}" y2="${oy+gy*u}"/>`; for(let j=0;j<=gy;j++) s+=`<line class="grid" x1="${ox}" y1="${oy+j*u}" x2="${ox+gx*u}" y2="${oy+j*u}"/>`;
  const P=(arr,cls)=>`<polygon class="${cls}" points="${arr.map(p=>`${ox+p.x*u},${oy+(gy-p.y)*u}`).join(' ')}"/>`;
  const base=LSH.map(p=>pt(p.x+2,p.y+2)); s+=P(base,'sh');
  let img; if(kind==='flytt') img=base.map(p=>pt(p.x+9,p.y+1)); else if(kind==='speil'){ s+=`<line class="lr dsh" x1="${ox+8*u}" y1="${oy}" x2="${ox+8*u}" y2="${oy+gy*u}"/>`; img=base.map(p=>pt(16-p.x,p.y)); } else { const c=pt(9,3); s+=`<circle class="dot r" cx="${ox+c.x*u}" cy="${oy+(gy-c.y)*u}" r="5"/>`; img=base.map(p=>pt(c.x+(p.y-c.y)*-1+0, c.y+(p.x-c.x))).map(p=>pt(p.x+6,p.y)); }
  if(k) s+=P(img,'sh2'); return k9svg(W,H,s,'Figur og bilde'); }

// skrå parallellprojeksjon: x bortover, z opp, y innover (dybde)
const OBL=0.45, OBA=deg(35);
function boxSVG(l,b,h,o){ o=o||{}; const u=o.u||Math.min(34,300/(l+b*OBL), 210/(h+b*OBL*0.6)), dx=Math.cos(OBA)*OBL*u, dy=Math.sin(OBA)*OBL*u;
  const W=l*u+b*dx+80, H=h*u+b*dy+40, ox=54, oy=H-20, P=(x,y,z)=>pt(ox+x*u+y*dx, oy-z*u-y*dy);
  const face=(pts,cls)=>`<polygon class="${cls}" points="${polyP(pts)}"/>`; let s='';
  const L=o.layers===undefined?h:o.layers;
  if(o.cubes){
    for(let z=0;z<L;z++) for(let y=b-1;y>=0;y--) for(let x=0;x<l;x++){ const c=(X,Y,Z)=>P(x+X,y+Y,z+Z); s+=face([c(0,0,1),c(1,0,1),c(1,1,1),c(0,1,1)],'top')+face([c(0,0,0),c(1,0,0),c(1,0,1),c(0,0,1)],'cube')+face([c(1,0,0),c(1,1,0),c(1,1,1),c(1,0,1)],'sd'); }
    if(L<h) s+=`<polygon class="ln dsh" fill="none" points="${polyP([P(0,0,0),P(l,0,0),P(l,0,h),P(0,0,h)])}"/><polyline class="ln dsh" fill="none" points="${polyP([P(0,0,h),P(0,b,h),P(l,b,h),P(l,0,h)])}"/><line class="ln dsh" x1="${P(l,0,0).x}" y1="${P(l,0,0).y}" x2="${P(l,b,0).x}" y2="${P(l,b,0).y}"/><line class="ln dsh" x1="${P(l,b,0).x}" y1="${P(l,b,0).y}" x2="${P(l,b,h).x}" y2="${P(l,b,h).y}"/>`;
  } else { s+=face([P(0,0,h),P(l,0,h),P(l,b,h),P(0,b,h)],o.hiTop?'sh2':'top')+face([P(0,0,0),P(l,0,0),P(l,0,h),P(0,0,h)],o.hiFront?'sh2':'cube')+face([P(l,0,0),P(l,b,0),P(l,b,h),P(l,0,h)],o.hiSide?'sh2':'sd');
    if(o.hidden) s+=`<polyline class="lt dsh" fill="none" points="${polyP([P(0,b,h),P(0,b,0),P(l,b,0)])}"/><line class="lt dsh" x1="${P(0,0,0).x}" y1="${P(0,0,0).y}" x2="${P(0,b,0).x}" y2="${P(0,b,0).y}"/>`; }
  if(o.labels!==false){ s+=k9t((P(0,0,0).x+P(l,0,0).x)/2,P(0,0,0).y+18,o.ll||`${k9f(l)}`)+k9t(P(0,0,0).x-8,(P(0,0,0).y+P(0,0,h).y)/2+5,o.lh||`${k9f(h)}`,'','end')+k9t((P(l,0,0).x+P(l,b,0).x)/2+12,(P(l,0,0).y+P(l,b,0).y)/2+10,o.lb||`${k9f(b)}`,'','start'); }
  return k9svg(Math.max(W+40,200),H,s,'Prisme'); }
function netSVG(l,b,h,hi){ const u=Math.min(22,460/(2*l+2*b),240/(2*b+h)), ox=20, oy=10; let s='';
  const R=(x,y,w,hh,k)=>`<rect class="${hi&&hi.includes(k)?'sh2':k==='t'||k==='u'?'top':k==='f'||k==='k'?'cube':'sd'}" x="${ox+x*u}" y="${oy+y*u}" width="${w*u}" height="${hh*u}"/>`;
  s+=R(b,0,l,b,'t')+R(0,b,b,h,'v')+R(b,b,l,h,'f')+R(b+l,b,b,h,'h')+R(2*b+l,b,l,h,'k')+R(b,b+h,l,b,'u');
  return k9svg(ox*2+(2*l+2*b)*u,oy*2+(2*b+h)*u,s,'Utbrett prisme'); }
function mountK9Box(el,kind){ const sq=kind==='kv';
  return k9Model(el,{title:sq?'Kvadratisk prisme: volum og overflate':'Rett prisme: volum med enhetsterninger',fields:sq?[{id:'s',label:'Side i grunnflaten',def:3,lo:1,hi:8},{id:'h',label:'Høyde',def:4,lo:1,hi:8}]:[{id:'l',label:'Lengde',def:5,lo:1,hi:8},{id:'b',label:'Bredde',def:3,lo:1,hi:6},{id:'h',label:'Høyde',def:4,lo:1,hi:6}],
    rand:()=>sq?{s:rnd(2,6),h:rnd(2,7)}:{l:rnd(2,7),b:rnd(2,5),h:rnd(2,5)},
    steps(v){ const l=sq?v.s:v.l, b=sq?v.s:v.b, h=v.h, G=l*b, V=G*h;
      const st=[{s:boxSVG(l,b,h,{hidden:true}),c:`Et rett prisme med lengde ${l}, bredde ${b} og høyde ${h} (cm). Hvor mange terninger på 1 cm³ får plass?`},
        {s:boxSVG(l,b,h,{cubes:true,layers:1}),c:`Det nederste laget har ${l} · ${b} = <b>${G}</b> terninger. Det er det samme som arealet av grunnflaten, ${G} cm².`},
        {s:boxSVG(l,b,h,{cubes:true,layers:Math.min(2,h)}),c:`Hvert nye lag har også ${G} terninger.`},
        {s:boxSVG(l,b,h,{cubes:true}),c:`Det er ${h} lag: ${G} · ${h} = <b>${V}</b> terninger.`},
        {s:boxSVG(l,b,h,{})+eqH(`V = G · h = ${l} · ${b} · ${h} = ${V} cm³`),c:`Volumet av et prisme er <b>grunnflate · høyde</b>: V = ${V} cm³.`}];
      if(sq){ const O=2*l*l+4*l*h; st.push({s:netSVG(l,b,h,['t','u'])+eqH(`O = 2 · ${l}² + 4 · ${l} · ${h} = ${2*l*l} + ${4*l*h} = ${O} cm²`),c:`Overflaten: to kvadrater (topp og bunn) og fire like rektangler: <b>${O} cm²</b>.`}); }
      return st; } });
}
function mountK9Net(el){
  return k9Model(el,{title:'Overflaten av et rett prisme',fields:[{id:'l',label:'Lengde',def:5,lo:1,hi:12},{id:'b',label:'Bredde',def:3,lo:1,hi:8},{id:'h',label:'Høyde',def:4,lo:1,hi:8}],rand:()=>({l:rnd(2,10),b:rnd(2,6),h:rnd(2,6)}),

        {s:netSVG(l,b,h,['t','u'])+eqH(`2 · ${l} · ${b} = ${2*l*b}`),c:`Topp og bunn er like: 2 · ${l} · ${b} = ${2*l*b} cm².`},
        {s:netSVG(l,b,h,['f','k'])+eqH(`2 · ${l} · ${h} = ${2*l*h}`),c:`Forside og bakside: 2 · ${l} · ${h} = ${2*l*h} cm².`},
        {s:netSVG(l,b,h,['v','h'])+eqH(`2 · ${b} · ${h} = ${2*b*h}`),c:`De to endeflatene: 2 · ${b} · ${h} = ${2*b*h} cm².`},
        {s:netSVG(l,b,h)+eqH(`O = ${2*l*b} + ${2*l*h} + ${2*b*h} = ${O} cm²`),c:`Til sammen: <b>${O} cm²</b>.`}]; } });
}
function triPrismSVG(g,ht,L,hi){ const u=Math.min(26,250/(g+L*OBL),190/(ht+L*OBL*0.6)), dx=Math.cos(OBA)*OBL*u, dy=Math.sin(OBA)*OBL*u, ox=30, oy=ht*u+L*dy+20, top=g/2;

  return k9svg(Math.max(260,g*u+L*dx+90),oy+30,s,'Trekantet prisme'); }
function mountK9TriPrism(el){
  return k9Model(el,{title:'Trekantet prisme',fields:[{id:'g',label:'Grunnlinje i trekanten',def:6,lo:1,hi:12},{id:'ht',label:'Høyde i trekanten',def:4,lo:1,hi:10},{id:'L',label:'Lengde på prismet',def:8,lo:1,hi:15}],rand:()=>({g:rnd(3,10),ht:rnd(2,8),L:rnd(4,12)}),

function pyrSVG(s,h,mode){ const u=Math.min(30,230/(s+s*OBL),190/(h+s*OBL*0.6)), dx=Math.cos(OBA)*OBL*u, dy=Math.sin(OBA)*OBL*u, ox=30, oy=h*u+s*dy+20;

function mountK9Pyr(el){

function cylSVG(r,h,o){ o=o||{}; const u=Math.min(26,120/r,200/h), R=r*u, ry=R*0.32, cx=R+40, top=ry+12, bot=top+h*u; let s='';

  else { s+=`<path class="cube" d="M${cx-R} ${top} L${cx-R} ${bot} A${R} ${ry} 0 0 0 ${cx+R} ${bot} L${cx+R} ${top}"/><ellipse class="${o.hiTop?'sh2':'top'}" cx="${cx}" cy="${top}" rx="${R}" ry="${ry}"/>`; if(o.layers) for(let i=1;i<h;i++) s+=`<path class="lt" fill="none" d="M${cx-R} ${top+i*u} A${R} ${ry} 0 0 0 ${cx+R} ${top+i*u}"/>`; }
  s+=`<line class="lr" x1="${cx}" y1="${o.cone?bot:top}" x2="${cx+R}" y2="${o.cone?bot:top}"/>`+k9t(cx+R/2,(o.cone?bot:top)-5,`r = ${k9f(r)}`,'r s')+k9t(cx+R+8,(top+bot)/2,`h = ${k9f(h)}`,'s','start');
  return k9svg(cx+R+90,bot+ry+14,s,o.cone?'Kjegle':'Sylinder'); }
function mountK9CylV(el){
  return k9Model(el,{title:'Sylinder: volum',fields:[{id:'r',label:'Radius',def:3,lo:1,hi:20,dec:true},{id:'h',label:'Høyde',def:8,lo:1,hi:30,dec:true}],rand:()=>({r:rnd(2,8),h:rnd(4,15)}),
    steps(v){ const {r,h}=v, G=PI*r*r, V=G*h; return [{s:cylSVG(r,h),c:`En sylinder er et «rundt prisme». Grunnflaten er en sirkel.`},
      {s:cylSVG(r,h,{hiTop:true})+eqH(`G = 3,14 · ${k9f(r)}² = ${k9f(r2d(G))}`),c:`Grunnflaten: π · r² = <b>${k9f(r2d(G))}</b>.`},
      {s:cylSVG(r,h,{layers:true}),c:`Som for prismer stabler vi grunnflaten ${k9f(h)} ganger i høyden.`},
      {s:cylSVG(r,h)+eqH(`V = π · r² · h = ${k9f(r2d(G))} · ${k9f(h)} = ${k9f(r2d(V))}`),c:`Volumet er <b>π · r² · h ≈ ${k9f(r2d(V))}</b>.`}]; } });
}
function cylNet(r,h,hi){ const u=Math.min(16,380/(2*PI*r),230/(h+4*r)), R=r*u, Wr=2*PI*r*u, ox=20, oy=10; let s=`<circle class="${hi==='c'?'sh2':'top'}" cx="${ox+Wr/2}" cy="${oy+R}" r="${R}"/><rect class="${hi==='m'?'sh2':'cube'}" x="${ox}" y="${oy+2*R}" width="${Wr}" height="${h*u}"/><circle class="${hi==='c'?'sh2':'top'}" cx="${ox+Wr/2}" cy="${oy+2*R+h*u+R}" r="${R}"/>`;
  s+=k9t(ox+Wr/2+R+8,oy+2*R-7,`2 · π · r = ${k9f(r2d(2*PI*r))}`,'s','start')+k9t(ox+Wr+8,oy+2*R+h*u/2+5,`h = ${k9f(h)}`,'s','start');
  return k9svg(Math.max(Wr+ox*2+70,ox+Wr/2+R+190),4*R+h*u+oy*2,s,'Utbrett sylinder'); }
function mountK9CylO(el){
  return k9Model(el,{title:'Sylinder: overflate',fields:[{id:'r',label:'Radius',def:3,lo:1,hi:15,dec:true},{id:'h',label:'Høyde',def:8,lo:1,hi:30,dec:true}],rand:()=>({r:rnd(2,8),h:rnd(4,15)}),
    steps(v){ const {r,h}=v, C=PI*r*r, M=2*PI*r*h; return [{s:cylSVG(r,h),c:`Vi skal finne overflaten av sylinderen.`},

      {s:cylNet(r,h,'c')+eqH(`2 · 3,14 · ${k9f(r)}² = ${k9f(r2d(2*C))}`),c:`De to sirklene: 2 · π · r² = ${k9f(r2d(2*C))}.`},
      {s:cylNet(r,h,'m')+eqH(`2 · 3,14 · ${k9f(r)} · ${k9f(h)} = ${k9f(r2d(M))}`),c:`Rektangelet (sideflaten, også kalt <b>mantelen</b>): 2 · π · r · h = ${k9f(r2d(M))}.`},
      {s:cylNet(r,h)+eqH(`O = ${k9f(r2d(2*C))} + ${k9f(r2d(M))} = ${k9f(r2d(2*C+M))}`),c:`Overflaten er <b>${k9f(r2d(2*C+M))}</b>.`}]; } });
}
function mountK9Cone(el){
  return k9Model(el,{title:'Kjegle: en tredel av sylinderen',fields:[{id:'r',label:'Radius',def:4,lo:1,hi:15,dec:true},{id:'h',label:'Høyde',def:9,lo:1,hi:30,dec:true}],rand:()=>({r:rnd(2,8),h:rnd(4,15)}),
    steps(v){ const {r,h}=v, V=PI*r*r*h/3; return [{s:cylSVG(r,h,{cone:true}),c:`En kjegle har en sirkel som grunnflate og en spiss topp.`},

      {s:cylSVG(r,h,{cone:true})+eqH(`V = ${F('π · r² · h',3)} = ${k9f(r2d(V))}`),c:`Volumet av kjeglen: <b>π · r² · h : 3 ≈ ${k9f(r2d(V))}</b>.`}]; } });

function sphereSVG(r,cyl){ const u=Math.min(30,110/r), R=r*u, cx=R+40, cy=R+20; let s='';
  if(cyl) s+=`<path class="lt dsh" fill="none" d="M${cx-R} ${cy-R} L${cx-R} ${cy+R} M${cx+R} ${cy-R} L${cx+R} ${cy+R}"/><ellipse class="lt dsh" fill="none" cx="${cx}" cy="${cy-R}" rx="${R}" ry="${R*0.3}"/><ellipse class="lt dsh" fill="none" cx="${cx}" cy="${cy+R}" rx="${R}" ry="${R*0.3}"/>`;
  s+=`<circle class="cube" cx="${cx}" cy="${cy}" r="${R}"/><ellipse class="lt" fill="none" cx="${cx}" cy="${cy}" rx="${R}" ry="${R*0.3}"/><line class="lr" x1="${cx}" y1="${cy}" x2="${cx+R}" y2="${cy}"/>`+k9t(cx+R/2,cy-6,`r = ${k9f(r)}`,'r s');
  return k9svg(cx+R+40,2*R+44,s,'Kule'); }
function mountK9Sphere(el){
  return k9Model(el,{title:'Kule: volum og overflate',fields:[{id:'r',label:'Radius',def:3,lo:1,hi:30,dec:true}],rand:()=>({r:rnd(1,10)}),
    steps(v){ const r=v.r, V=4/3*PI*r**3, O=4*PI*r*r; return [{s:sphereSVG(r),c:`En kule har alle punktene på overflaten like langt fra sentrum. Avstanden er radien r = ${k9f(r)}.`},
      {s:sphereSVG(r,true),c:`Kulen passer inni en sylinder med samme radius og høyde 2r. Kulen fyller nøyaktig <b>to tredeler</b> av sylinderen.`},
      {s:sphereSVG(r)+eqH(`V = ${F(4,3)} · π · r³ = ${F(4,3)} · 3,14 · ${k9f(r)}³ = ${k9f(r2d(V))}`),c:`Volumet: <b>4/3 · π · r³ ≈ ${k9f(r2d(V))}</b>.`},
      {s:sphereSVG(r)+eqH(`O = 4 · π · r² = 4 · 3,14 · ${k9f(r)}² = ${k9f(r2d(O))}`),c:`Overflaten er like stor som fire sirkler med samme radius: <b>4 · π · r² ≈ ${k9f(r2d(O))}</b>.`}]; } });

function mountK9Dens(el){
  return k9Model(el,{title:'Massetetthet',fields:[{id:'s',label:'Terningens side (cm)',def:5,lo:1,hi:20},{id:'m',label:'Masse (g)',def:338,lo:1,hi:99999}],rand:()=>{ const s=rnd(2,8), mat=pick([2.7,7.9,0.9,1,8.9,0.5]); return {s,m:Math.round(s**3*mat)}; },
    steps(v){ const {s,m}=v, V=s**3, rho=m/V; const mats=[['Kork',0.25],['Tre (gran)',0.5],['Is',0.92],['Vann',1],['Aluminium',2.7],['Jern',7.9],['Kobber',8.9],['Gull',19.3]];
      let best=mats[0]; mats.forEach(x=>{ if(Math.abs(x[1]-rho)<Math.abs(best[1]-rho)) best=x; });
      const cube=boxSVG(Math.min(s,6),Math.min(s,6),Math.min(s,6),{ll:`${s} cm`,lh:`${s} cm`,lb:`${s} cm`,u:22});
      return [{s:cube,c:`En terning med side ${s} cm veier ${k9f(m)} g. Hva er den laget av?`},
        {s:cube+eqH(`V = ${s} · ${s} · ${s} = ${V} cm³`),c:`Først finner vi volumet: <b>${V} cm³</b>.`},
        {s:eqH(`ρ = ${F('m','V')} = ${F(k9f(m),V)} = ${k9f(r2d(rho))} g/cm³`),c:`<b>Massetetthet</b> er masse per volum: ρ = m : V = <b>${k9f(r2d(rho))} g/cm³</b>. Det betyr at 1 cm³ veier ${k9f(r2d(rho))} g.`},
        {s:k9tab(['Stoff','g/cm³'],mats.map(x=>[x[0]===best[0]?`<b>${x[0]}</b>`:x[0],x[0]===best[0]?`<b>${k9f(x[1])}</b>`:k9f(x[1])])),c:`Vi sammenligner med en tabell. Massetettheten passer best med <b>${best[0].toLowerCase()}</b>. ${rho<1?'Den flyter i vann, fordi massetettheten er mindre enn 1 g/cm³.':'Den synker i vann.'}`}]; } });
}
function mountK9Units(el){

      {s:eqH(`${nf(V)} cm³ = ${nf(V/1000)} dm³ = ${nf(V/1000)} L`),c:`Vi deler på 1 000: akvariet rommer <b>${nf(V/1000)} liter</b>. Alternativt: regn i dm fra starten: ${k9f(l/10)} · ${k9f(b/10)} · ${k9f(h/10)} = ${nf(V/1000)} dm³.`}]; } });

/* ===================== 9. TRINN KAP 4: SANNSYNLIGHET ===================== */
const COL=[['rød','#E5484D'],['blå','#5B8DEF'],['grønn','#6CC04A'],['gul','#F2C230']];
const frS=(n,d)=>{ const [a,b]=simp(n,d); return F(a,b); };
const frT=(n,d)=>{ if(n===0) return '0'; const [a,b]=simp(n,d); return b===1?String(a):`${a}/${b}`; };
const pctT=(n,d)=>`${nf(Math.round(n/d*1000)/10)} %`;
const sfr=(n,d)=>{ const [a,b]=simp(n,d); return {n:a,d:b}; };
const frEq=(n,d)=>{ const [a,b]=simp(n,d); return (a!==n?`${F(n,d)} = `:'')+F(a,b); };
const lw=s=>String(s).length*8.6;
/* ---------- tegnehjelpere ---------- */
function probTreeSVG(lv,o){ o=o||{}; const depth=o.depth===undefined?lv.length:o.depth, lh=o.lh||(o.elab?40:30);
  const maxW=Math.max(...lv.flat().map(lw)), colW=maxW+(o.elab?120:64);
  const below=d=>lv.slice(d).reduce((a,l)=>a*l.length,1), N=below(0), H=N*lh+16;
  const pos=(d,k)=>{ const n=below(d); return {x:16+colW*d, y:8+lh*(k*n+n/2)}; };
  const pathOf=(d,k)=>{ const p=[]; for(let j=d;j>=1;j--){ const len=lv[j-1].length; p.unshift(k%len); k=Math.floor(k/len); } return p; };
  let s=`<circle cx="${pos(0,0).x}" cy="${pos(0,0).y}" r="4.5" class="dot"/>`, leafW=24;
  for(let d=1; d<=depth; d++){ const cnt=lv.slice(0,d).reduce((a,l)=>a*l.length,1);
    for(let k=0;k<cnt;k++){ const len=lv[d-1].length, i=k%len, par=Math.floor(k/len), P0=pos(d-1,par), P1=pos(d,k), path=pathOf(d,k), on=!!(o.hi&&o.hi(path));
      const x0=P0.x+(d===1?6:lw(lv[d-2][path[d-2]])+6), x1=P1.x-5;
      s+=`<line class="${on?'lr':'lt'}" x1="${x0}" y1="${P0.y}" x2="${x1}" y2="${P1.y}"/>`+k9t(P1.x,P1.y+5,lv[d-1][i],on?'r tb':'tb','start');
      if(o.elab){ const t=o.elab(d,path); if(t!==undefined&&t!=='') s+=k9t((x0+x1)/2,(P0.y+P1.y)/2+(P1.y<P0.y?-8:P1.y>P0.y?17:-6),t,on?'r s tb':'p s tb','middle'); }
      if(d===lv.length&&o.leaf){ const t=o.leaf(path); s+=k9t(P1.x+lw(lv[d-1][i])+14,P1.y+5,t,on?'r s tb':'s','start'); leafW=Math.max(leafW,lw(t)+lw(lv[d-1][i])+30); } } }
  return k9svg(Math.round(16+colW*lv.length+maxW+leafW),H,s,o.aria||'Valgtre'); }
function ballsSVG(counts,hi){ const all=[]; counts.forEach((c,i)=>{ for(let k=0;k<c;k++) all.push(i); });
  const per=Math.min(10,Math.max(5,Math.ceil(Math.sqrt(all.length*2)))), rows=Math.ceil(all.length/per)||1, R=13, S=32;
  let s=`<path class="ln" d="M14 8 L14 ${rows*S+24} Q14 ${rows*S+34} 26 ${rows*S+34} L${per*S+14} ${rows*S+34} Q${per*S+26} ${rows*S+34} ${per*S+26} ${rows*S+24} L${per*S+26} 8" />`;
  all.forEach((c,k)=>{ const x=36+(k%per)*S, y=28+Math.floor(k/per)*S, dim=hi!==undefined&&hi!==null&&!(Array.isArray(hi)?hi.includes(c):hi===c);
    s+=`<circle cx="${x}" cy="${y}" r="${R}" fill="${COL[c][1]}" stroke="var(--ink)" stroke-width="1.5" style="opacity:${dim?.22:1}"/>`; });
  return k9svg(per*S+40,rows*S+44,s,'Kuler i en pose'); }
function dieF(n,x,y,s,cls){ const P=[[],[[.5,.5]],[[.27,.27],[.73,.73]],[[.27,.27],[.5,.5],[.73,.73]],[[.27,.27],[.73,.27],[.27,.73],[.73,.73]],[[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],[[.27,.25],[.73,.25],[.27,.5],[.73,.5],[.27,.75],[.73,.75]]][n];
  return `<rect class="${cls||'cube'}" x="${x}" y="${y}" width="${s}" height="${s}" rx="${s*.18}"/>`+P.map(p=>`<circle class="dot" cx="${x+p[0]*s}" cy="${y+p[1]*s}" r="${s*.085}"/>`).join(''); }
function diceRow(hi,dim){ let s=''; for(let n=1;n<=6;n++){ const on=hi&&hi(n); s+=dieF(n,10+(n-1)*62,10,48,on?'sh2':'cube'); }
  return k9svg(384,70,s,'Terningflater'); }
function coinsSVG(labels,hi){ let s=''; labels.forEach((t,i)=>{ const x=40+i*76; s+=`<circle class="${hi&&hi(i)?'sh2':'top'}" cx="${x}" cy="40" r="28"/><circle class="lt" fill="none" cx="${x}" cy="40" r="22"/>`+k9t(x,47,t,'tb'); });
  return k9svg(labels.length*76+10,84,s,'Mynter'); }
function spinSVG(sizes,o){ o=o||{}; const tot=sum(sizes), R=105, cx=130, cy=125; let s='', a0=-90;
  sizes.forEach((v,i)=>{ const ang=v/tot*360, a1=a0+ang, rad=d=>d*Math.PI/180, x0=cx+R*Math.cos(rad(a0)), y0=cy+R*Math.sin(rad(a0)), x1=cx+R*Math.cos(rad(a1)), y1=cy+R*Math.sin(rad(a1));
    const fill=o.colors?o.colors[i]:PAL[i%PAL.length], dim=o.hi&&!o.hi(i);
    s+= ang>=359.99?`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${fill}" stroke="var(--ink)" stroke-width="1.5"/>`:`<path d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${ang>180?1:0} 1 ${x1} ${y1} Z" fill="${fill}" stroke="var(--ink)" stroke-width="1.5" style="opacity:${dim?.25:1}"/>`;
    const am=rad(a0+ang/2), lab=o.labels?o.labels[i]:(o.deg?`${fmt(r1(ang))}°`:''); if(lab!==''&&ang>=18) s+=k9t(cx+R*0.62*Math.cos(am),cy+R*0.62*Math.sin(am)+5,lab,'tb');
    a0=a1; });
  s+=`<circle cx="${cx}" cy="${cy}" r="6" class="dot"/><path d="M${cx} ${cy-R+6} L${cx-9} ${cy-R-14} L${cx+9} ${cy-R-14} Z" class="dot r"/>`;
  return k9svg(260,250,s,'Lykkehjul'); }
function diceTab(hi,show){ let h=`<div class="scroll"><table class="t k9-dice"><thead><tr><th>+</th>${[1,2,3,4,5,6].map(j=>`<th>${j}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=1;i<=6;i++){ h+=`<tr><th>${i}</th>`; for(let j=1;j<=6;j++){ const on=hi&&hi(i,j); h+=`<td class="${on?'on':''}">${show?show(i,j):i+j}</td>`; } h+='</tr>'; }
  return h+'</tbody></table></div>'; }
const simCache={}; let simSeed=1;
function simSeq(p,n,key){ const k=key+'|'+n+'|'+simSeed; if(!simCache[k]) simCache[k]=Array.from({length:n},()=>Math.random()<p?1:0); return simCache[k]; }
function simSVG(seq,p,upto){ const W=480, H=240, L=44, R=14, T=16, B=34, iw=W-L-R, ih=H-T-B, X=i=>L+iw*i/seq.length, Y=v=>T+ih*(1-v);
  let s=''; [0,.25,.5,.75,1].forEach(v=>{ s+=`<line class="grid" x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}"/>`+k9t(L-6,Y(v)+4,fmt(v),'s m','end'); });
  [0,.25,.5,.75,1].forEach(f=>s+=k9t(X(seq.length*f),H-14,nf(Math.round(seq.length*f)),'s m'));
  s+=`<line class="lr dsh" x1="${L}" y1="${Y(p)}" x2="${W-R}" y2="${Y(p)}"/>`;
  let c=0; const pts=[]; const step=Math.max(1,Math.floor(upto/300));
  for(let i=0;i<upto;i++){ c+=seq[i]; if(i%step===0||i===upto-1) pts.push(`${X(i+1).toFixed(1)},${Y(c/(i+1)).toFixed(1)}`); }
  s+=`<polyline class="lp" fill="none" points="${pts.join(' ')}"/>`+k9t(W-R,Y(p)-6,`p = ${nf(r2d(p))}`,'r s','end');
  return k9svg(W,H,s,'Relativ frekvens i simulering'); }

/* ---------- modeller ---------- */
function mountK9Tree(el){
  return k9Model(el,{title:'Valgtre: hvor mange kombinasjoner?',fields:[{id:'a',label:'T-skjorter',def:3,lo:1,hi:5},{id:'b',label:'Bukser',def:2,lo:1,hi:5},{id:'c',label:'Par sko (0 = ingen)',def:0,lo:0,hi:4}],
    rand:()=>({a:rnd(2,4),b:rnd(2,3),c:pick([0,0,2])}),
    steps(v,m,e){ const {a,b,c}=v, lv=[Array.from({length:a},(_,i)=>'T'+(i+1)),Array.from({length:b},(_,i)=>'B'+(i+1))]; if(c) lv.push(Array.from({length:c},(_,i)=>'S'+(i+1)));
      const N=a*b*(c||1), big=N>36, tr=d=>big?'':probTreeSVG(lv,{depth:d,leaf:p=>p.map((x,j)=>lv[j][x]).join(' ')});
      if(big) e.push('Treet blir for stort til å tegnes, men utregningen virker.');
      const st=[{s:tr(1),c:`Du har ${a} T-skjorter, ${b} bukser${c?` og ${c} par sko`:''}. Hvor mange ulike antrekk kan du lage? Vi tegner et <b>valgtre</b>. Først velger du T-skjorte: ${a} greiner.`},
        {s:tr(2),c:`Fra hver T-skjorte går det ${b} greiner, én for hver bukse. Det gir ${a} · ${b} = <b>${a*b}</b> kombinasjoner.`}];
      if(c) st.push({s:tr(3),c:`Fra hver av de ${a*b} kombinasjonene går det ${c} nye greiner for sko: ${a*b} · ${c} = <b>${N}</b>.`});
      st.push({s:tr(lv.length)+eqH(`${a} · ${b}${c?` · ${c}`:''} = ${N}`),c:`<b>Multiplikasjonsprinsippet</b> for kombinasjoner: gang antall valg på hvert trinn. Det blir ${N} antrekk.`});
      return st; } });
}
function mountK9Outcomes(el){
  return k9Model(el,{title:'Utfall og utfallsrom',modes:[['mynt','Mynt'],['terning','Terning'],['2mynt','To mynter'],['hjul','Lykkehjul']],fields:[{id:'n',label:'Felt på lykkehjulet',def:5,lo:2,hi:10}],
    rand:()=>({n:rnd(3,8)}),
    steps(v,m){ const n=v.n;
      if(m==='mynt') return [{s:coinsSVG(['K','M']),c:`Vi kaster en mynt. Den kan lande på <b>kron</b> (K) eller <b>mynt</b> (M).`},{s:k9chips(['K','M']),c:`Hvert mulig resultat kalles et <b>utfall</b>. Alle utfallene til sammen er <b>utfallsrommet</b>: {K, M}. Det er 2 utfall.`},{s:coinsSVG(['K','M'],i=>i===0)+k9chips(['K','M'],(x,i)=>i===0?'alt':'x'),c:`En <b>hendelse</b> er ett eller flere utfall. Hendelsen «kron» består av <b>1</b> av de 2 utfallene.`}];
      if(m==='terning') return [{s:diceRow(),c:`Vi kaster en vanlig terning.`},{s:k9chips([1,2,3,4,5,6]),c:`Utfallsrommet er {1, 2, 3, 4, 5, 6}. Det er <b>6</b> utfall.`},{s:diceRow(x=>x%2===0)+k9chips([1,2,3,4,5,6],x=>x%2===0?'alt':'x'),c:`Hendelsen «partall» består av utfallene 2, 4 og 6. Det er <b>3</b> gunstige utfall.`},{s:diceRow(x=>x>4)+k9chips([1,2,3,4,5,6],x=>x>4?'alt':'x'),c:`Hendelsen «mer enn 4» består av utfallene 5 og 6: <b>2</b> utfall.`}];
      if(m==='2mynt'){ const lv=[['K','M'],['K','M']], lf=p=>p.map(x=>lv[0][x]).join(''); return [{s:probTreeSVG(lv,{depth:1}),c:`Vi kaster to mynter. Den første kan lande på K eller M.`},{s:probTreeSVG(lv,{leaf:lf}),c:`For hvert utfall av den første mynten kan den andre bli K eller M. Utfallsrommet er {KK, KM, MK, MM}: <b>4</b> utfall.`},{s:probTreeSVG(lv,{leaf:lf,hi:p=>p.includes(0)}),c:`Hendelsen «minst én kron» består av KK, KM og MK: <b>3</b> av 4 utfall.`},{s:probTreeSVG(lv,{leaf:lf,hi:p=>p[0]!==p[1]})+k9chips(['KK','KM','MK','MM'],(x,i)=>i===1||i===2?'alt':'x'),c:`Pass på: «én av hver» er <b>to</b> utfall, KM og MK. Derfor er ikke «to like» og «én av hver» like sannsynlige på samme måte som utfallene.`}]; }
      const sz=Array(n).fill(1), lab=sz.map((_,i)=>String(i+1)), odd=lab.filter(x=>+x%2).length;
      return [{s:spinSVG(sz,{labels:lab}),c:`Et lykkehjul har ${n} like store felt med tallene 1 til ${n}.`},{s:spinSVG(sz,{labels:lab})+k9chips(lab),c:`Utfallsrommet er {${lab.join(', ')}}: <b>${n}</b> utfall.`},{s:spinSVG(sz,{labels:lab,hi:i=>(i+1)%2===1})+k9chips(lab,x=>+x%2?'alt':'x'),c:`Hendelsen «oddetall» består av ${odd} utfall.`}]; } });
}
function mountK9Bag(el){
  return k9Model(el,{title:'Sannsynlighet for én hendelse',modes:[['0','Rød'],['1','Blå'],['2','Grønn'],['3','Gul']],fields:[{id:'r',label:'Røde',def:3,lo:0,hi:12},{id:'b',label:'Blå',def:5,lo:0,hi:12},{id:'g',label:'Grønne',def:2,lo:0,hi:12},{id:'y',label:'Gule',def:0,lo:0,hi:12}],
    rand:()=>({r:rnd(1,6),b:rnd(1,6),g:rnd(0,5),y:rnd(0,3)}),
    steps(v,m,e){ const c=[v.r,v.b,v.g,v.y], n=sum(c), k=+m, f=c[k], nm=COL[k][0];
      if(!n){ e.push('Legg minst én kule i posen.'); return null; }
      return [{s:ballsSVG(c),c:`I en pose er det ${c.map((x,i)=>x?`${x} ${COL[i][0]}${x>1&&i!==1?'e':''}`:'').filter(Boolean).join(', ')} kuler. Vi trekker én kule uten å se.`},

        {s:ballsSVG(c,k)+eqH(`P(${nm}) = ${F('gunstige','mulige')} = ${frEq(f,n)}`),c:`Sannsynligheten er <b>gunstige utfall delt på mulige utfall</b>.`},
        {s:ballsSVG(c,k)+eqH(`${frS(f,n)} ≈ ${nf(Math.round(f/n*1000)/1000)} ≈ ${pctT(f,n)}`),c:`Vi kan skrive sannsynligheten som brøk, desimaltall eller prosent. Den er alltid mellom 0 og 1.`},
        {s:ballsSVG(c,[0,1,2,3].filter(i=>i!==k))+eqH(`P(ikke ${nm}) = 1 − ${frS(f,n)} = ${frS(n-f,n)}`),c:`Sannsynligheten for at hendelsen <b>ikke</b> skjer, er 1 minus sannsynligheten for at den skjer.`}]; } });
}
function mountK9Dice2(el){

function mountK9Mult(el){

  gen(L,f){ if(f.t==='mc'){ const c=pick([['Kaste en vanlig terning og se på antall øyne',0],['Kaste en tegnestift: spissen opp eller ned',1],['Trekke et kort fra en godt blandet kortstokk og se om det er rødt eller svart',0],['Kaste to terninger og se på summen',1],['Kaste en mynt',0],['Om det regner eller ikke i morgen',1],['Trekke et lodd fra en bolle med 10 lodd nummerert 1–10',0],['Kaste to mynter: to kron, to mynt eller én av hver',1],['Snurre et lykkehjul med fire like store felt',0],['Snurre et lykkehjul der det røde feltet er dobbelt så stort som de andre',1],['Kaste en fyrstikkeske og se hvilken side den lander på',1]]);
     return {q:`Er utfallene like sannsynlige? <b>${c[0]}</b>`, mc:{opts:['Ja, like sannsynlige','Nei, ikke like sannsynlige'],a:c[1]}, steps:[c[1]?'Nei: noen utfall har større sjanse enn andre.':'Ja: alle utfallene har like stor sjanse.']}; }
   const sets=L===1?[[180,90,90],[90,90,90,90],[120,120,120],[180,180]]:L===2?[[180,120,60],[90,90,180],[60,60,120,120],[240,60,60]]:[[150,90,120],[45,135,90,90],[30,90,120,120],[72,72,72,144]];
   const sz=shuffle(pick(sets).slice()), k=rnd(0,sz.length-1), nm=['blått','gult','rosa','grønt'][k];
   return {q:`${spinSVG(sz,{deg:true})}<p>Hva er sannsynligheten for at lykkehjulet stopper på det ${nm} feltet (felt nr. ${k+1} med klokka fra toppen)?</p>`, fr:sfr(sz[k],360), steps:[`Feltet er ${sz[k]}° av 360°`,`P = ${F(sz[k],360)} = <b>${frS(sz[k],360)}</b>`], model:{id:'k9fair',v:{sz:sz.map(x=>x/gcdA(sz)).join(', ')}}}; } },
 k9statsann:{ title:'Sannsynlighet fra statistikk', levels:LV3, filters:[{k:'t',label:'Type',opts:[['rel','Relativ frekvens'],['forv','Forventet antall'],['velg','Beste estimat']],def:'rel'}],
  gen(L,f){ if(f.t==='rel'){ const n=pick(L===1?[20,50,100]:[40,80,120,250,400]), k=rnd(Math.round(n*.3),Math.round(n*.75)), c=pick([['en tegnestift','med spissen opp'],['en kopp','med bunnen ned'],['en flaskekork','med åpningen opp']]);
     return {q:`${NAVN[rnd(0,NAVN.length-1)]} kastet ${c[0]} ${n} ganger. Den landet ${c[1]} ${k} ganger. Hva er den relative frekvensen? Svar i prosent${n===20||n===50||n===100?'':' med én desimal'}.`, a:Math.round(k/n*1000)/10, u:'%', tol:0.051, steps:[`${k} : ${n} = ${nf(Math.round(k/n*10000)/10000)}`,`= <b>${pctT(k,n)}</b>`], model:{id:'k9relfreq',v:{n,k,ny:1000}}}; }
   if(f.t==='forv'){ const c=pick([['Erfaring viser at {p} % av eggene i en eske er knust.','egg','er knust'],['{p} % av elevene på en skole sykler til skolen.','elever','sykler'],['En fabrikk vet at {p} % av lyspærene er defekte.','lyspærer','er defekte']]), p=pick(L===1?[10,20,25,50]:[4,6,12,15,35]), N=pick(L===1?[100,200,300]:[150,250,400,1200]);
     return {q:`${c[0].replace('{p}',p)} Hvor mange av ${N} ${c[1]} kan vi forvente ${c[2]}?`, a:Math.round(p*N/100*10)/10, tol:0.051, steps:[`${nf(p/100)} · ${N} = <b>${nf(p*N/100)}</b>`]}; }
   const ns=shuffle([rnd(10,30),rnd(40,90),rnd(300,800)]), names=shuffle(NAVN.slice()).slice(0,3), best=ns.indexOf(Math.max(...ns));
   return {q:`Tre elever kastet en tegnestift for å finne sannsynligheten for «spissen opp». ${names.map((x,i)=>`${x} kastet ${ns[i]} ganger`).join(', ')}. Hvem har det beste estimatet?`, mc:{opts:names,a:best}, steps:[`Flest forsøk gir det sikreste estimatet: ${names[best]}`]}; } },
 k9simq:{ title:'Simulering', levels:LV3, filters:[{k:'t',label:'Type',opts:[['forv','Forventet antall'],['est','Fra simulering'],['begrep','Store talls lov']],def:'forv'}],
  gen(L,f){ if(f.t==='forv'){ const c=pick(L===1?[['kaster en mynt','kron',2,[50,100,200]],['kaster en terning','sekser',6,[60,120,300]]]:[['kaster en terning','partall',2,[300,500]],['kaster to mynter','to kron',4,[200,400,1000]],['kaster en terning','mer enn 4',3,[300,900]],['kaster to terninger','summen 7',6,[360,1200]]]), N=pick(c[3]);
     return {q:`Du ${c[0]} ${N} ganger. Omtrent hvor mange ganger kan du forvente å få ${c[1]}?`, a:N/c[2], steps:[`P = 1/${c[2]}`,`${N} · 1/${c[2]} = <b>${N/c[2]}</b>`], model:L===1?{id:'k9sim',v:{mode:c[1]==='kron'?'mynt':'terning',n:Math.max(100,N)}}:null}; }
   if(f.t==='est'){ const n=pick([500,1000,2000]), p=pick([0.12,0.18,0.24,0.3]), k=Math.round(n*(p+(Math.random()-.5)*.04));
     return {q:`En datamaskin simulerte ${nf(n)} straffespark. Keeperen reddet ${nf(k)} av dem. Hva er den relative frekvensen for redning? Svar med tre desimaler.`, a:Math.round(k/n*1000)/1000, tol:0.0011, steps:[`${nf(k)} : ${nf(n)} = <b>${nf(Math.round(k/n*1000)/1000)}</b>`]}; }
   const c=pick([['Jo flere forsøk, desto nærmere kommer den relative frekvensen sannsynligheten.',0],['Har du fått kron fem ganger på rad, er det større sjanse for mynt neste gang.',1],['Kaster du en terning 6 ganger, får du alltid nøyaktig én sekser.',1],['En simulering kan brukes til å anslå sannsynligheter som er vanskelige å regne ut.',0],['Med 10 kast er den relative frekvensen alltid lik sannsynligheten.',1],['Mynten husker ikke hva den landet på sist.',0]]);
   return {q:`Er påstanden sann eller usann? «${c[0]}»`, mc:{opts:['Sann','Usann'],a:c[1]}, steps:[c[1]?'Usann. Hvert kast er uavhengig, og tilfeldigheter jevner seg bare ut over mange forsøk.':'Sann.'], model:{id:'k9sim',v:{mode:'mynt',n:1000}}}; } }

    steps(v,m,e){ const {a,b,c,d}=v, x=a*c/(b+d);

        {s:der([[`${F(a,'x')} = ${F(b+d,c)}`],[`${F(a+' · '+red('x'),strike('x'))} = ${F(b+d,c)} · ${red('x')}`,'Vi multipliserer alle ledd med x og forkorter.'],[`${a} = ${F((b+d)+'x',c)}`],[`${a} · ${red(c)} = ${b+d}x`,`Vi multipliserer med ${c}.`],[dbl(`x = ${Number.isInteger(x)?fmt(x):F(a*c,b+d)}`),`Vi dividerer med ${b+d}.`]]),c:`Løsningen er x = ${Number.isInteger(x)?fmt(x):F(a*c,b+d)}.`}];

function mountK10Sett(el){

function mountK10Graf(el){

        {s:plotSVG(Object.assign({},base,{fns:[f1,f2]})),c:`Likning II: y = x + ${k}.`},

}
function mountK10Prob(el){

function algAlts(v,alts){ const out=[], seen=new Set([ALG.clean(v)]); const add=t=>{ const c=ALG.clean(t); if(seen.has(c)) return; let e; try{ e=ALG.eq(t,v); }catch(x){ return; } if(e!==false) return; seen.add(c); out.push(t); };
  (alts||[]).forEach(add); let g=0; while(out.length<3&&g<40){ g++; const ds=[...String(v).matchAll(/\d+/g)]; if(!ds.length) break; const m=pick(ds), n=+m[0], k=Math.max(0,n+pick([-2,-1,1,2])); add(String(v).slice(0,m.index)+k+String(v).slice(m.index+m[0].length)); }
  return out.slice(0,3); }
const algP=(q,v,form,ph,steps,alts,ans)=>({q, alg:{v,form}, ansHTML:ans||am(v), ph:ph||'f.eks. 2x(x − 3)', steps, alts:algAlts(v,alts).map(am)});
const facChk=(expect)=>u=>{ const toks=String(u).replace(/[·×*]/g,'*').split('*').map(t=>t.trim()).filter(Boolean); if(!toks.length) return {ok:null,msg:'Skriv faktorene med gangetegn, for eksempel 2 · 3 · x · x.'};
  const okTok=toks.every(t=>/^[a-zæøå]$/i.test(t)||(/^\d+$/.test(t)&&isPrime(+t))); const eq=ALG.eq(toks.join('*'),expect); if(eq===null) return {ok:null,msg:'Skriv faktorene med gangetegn, for eksempel 2 · 3 · x · x.'};
  if(!eq) return {ok:false}; if(!okTok) return {ok:false,msg:'Produktet stemmer, men alle tallfaktorene må være primtall og hver variabel skrives for seg.'}; return {ok:true}; };

  return plotSVG(Object.assign({x0:xs[0],x1:xs[1],y0:Math.min(-1,y0),y1:Math.max(1,y1),W:380,H:300,fns:[{f:x=>a*x+b,lab:o.lab}]},o.extra||{})); }

function mountK10Koord(el){
  return k9Model(el,{title:'Koordinatsystemet',fields:[{id:'x',label:'x-koordinat',def:3,lo:-6,hi:6},{id:'y',label:'y-koordinat',def:-2,lo:-6,hi:6}],rand:()=>({x:rnd(-6,6),y:rnd(-6,6)}),
    steps(v){ const {x,y}=v, base={x0:-7,x1:7,y0:-7,y1:7,xs:1,ys:1,W:360,H:360};
      const kv=x>0&&y>0?'første':x<0&&y>0?'andre':x<0&&y<0?'tredje':x>0&&y<0?'fjerde':null;
      return [{s:plotSVG(Object.assign({},base,{pts:[{x:0,y:0,lab:'Origo',c:'var(--ink)'}]})),c:'Koordinatsystemet har en vannrett <b>x-akse</b> (førsteaksen) og en loddrett <b>y-akse</b> (andreaksen). De møtes i origo (0, 0).'},
        {s:plotSVG(Object.assign({},base,{segs:[[0,0,x,0,'var(--red)']]})),c:`Vi går først ${Math.abs(x)} ${x>=0?'til høyre':'til venstre'} langs x-aksen.`},
        {s:plotSVG(Object.assign({},base,{segs:[[0,0,x,0,'var(--red)'],[x,0,x,y,'var(--red)']]})),c:`Så går vi ${Math.abs(y)} ${y>=0?'opp':'ned'} parallelt med y-aksen.`},
        {s:plotSVG(Object.assign({},base,{segs:[[0,0,x,0,'var(--red)',true],[x,0,x,y,'var(--red)',true]],pts:[{x,y,lab:`A(${x}, ${y})`}]})),c:`Punktet er A(${x}, ${y}).${kv?` Det ligger i ${kv} kvadrant.`:' Det ligger på en av aksene.'}`}]; } });
}
function mountK10FGraf(el){
  return k9Model(el,{title:'Fra funksjonsuttrykk til graf',fields:[{id:'a',label:'Tallet foran x',def:2,lo:-5,hi:5,dec:true},{id:'b',label:'Konstantledd',def:-1,lo:-8,hi:8,dec:true}],rand:()=>({a:pick([-2,-1,0.5,1,2,3]),b:rnd(-4,4)}),
    steps(v){ const {a,b}=v, xs=[-2,-1,0,1,2], pts=xs.map(x=>({x,y:a*x+b})), ys=pts.map(p=>p.y), base={x0:-4,x1:4,y0:Math.min(-2,Math.floor(Math.min(...ys))-1),y1:Math.max(2,Math.ceil(Math.max(...ys))+1),xs:1,ys:Math.max(1,Math.round((Math.max(...ys)-Math.min(...ys))/8)),W:380,H:320};
      return [{s:eqH(fxS(a,b)),c:'En <b>funksjon</b> er en regel som gir nøyaktig én y-verdi for hver x-verdi. Vi skriver f(x) i stedet for y.'},
        {s:eqH(fxS(a,b))+vtab(xs,x=>a*x+b),c:`Vi lager en verditabell. For eksempel er f(1) = ${nb(a)} · 1 ${b<0?'−':'+'} ${nb(Math.abs(b))} = ${nb(a+b)}.`},
        {s:plotSVG(Object.assign({},base,{pts})),c:'Hvert par i tabellen blir et punkt (x, f(x)) i koordinatsystemet.'},
        {s:plotSVG(Object.assign({},base,{pts,fns:[{f:x=>a*x+b,lab:'f'}]})),c:'Vi trekker en linje gjennom punktene. Linja er <b>grafen</b> til funksjonen.'}]; } });
}
function mountK10Stig(el){
  return k9Model(el,{title:'Stigningstall',fields:[{id:'x1',label:'Punkt 1: x',def:1,lo:-6,hi:6},{id:'y1',label:'Punkt 1: y',def:1,lo:-8,hi:8},{id:'x2',label:'Punkt 2: x',def:4,lo:-6,hi:6},{id:'y2',label:'Punkt 2: y',def:7,lo:-8,hi:8}],rand:()=>{ const x1=rnd(-4,1), x2=x1+rnd(1,4); return {x1,y1:rnd(-3,3),x2,y2:rnd(-6,8)}; },
    steps(v,_,e){ const {x1,y1,x2,y2}=v; if(x1===x2){ e.push('x-verdiene må være forskjellige.'); return null; } const dx=x2-x1, dy=y2-y1, a=dy/dx, b=y1-a*x1;
      const base={x0:Math.min(-1,x1,x2)-1,x1:Math.max(1,x1,x2)+1,y0:Math.min(-1,y1,y2)-1,y1:Math.max(1,y1,y2)+1,xs:1,ys:Math.max(1,Math.round((Math.max(y1,y2)-Math.min(y1,y2))/8)),W:380,H:320};
      const P=[{x:x1,y:y1,lab:`(${x1}, ${y1})`},{x:x2,y:y2,lab:`(${x2}, ${y2})`}];
      return [{s:plotSVG(Object.assign({},base,{pts:P,fns:[{f:x=>a*x+b}]})),c:'<b>Stigningstallet</b> forteller hvor mye y endrer seg når x øker med 1.'},
        {s:plotSVG(Object.assign({},base,{pts:P,fns:[{f:x=>a*x+b}],segs:[[x1,y1,x2,y1,'var(--red)',false,`Δx = ${dx}`,0,16],[x2,y1,x2,y2,'#2B6CD4',false,`Δy = ${dy}`,30,0]]})),c:`Vi tegner en trekant. Fra punkt 1 til punkt 2 øker x med ${dx}, og y endrer seg med ${dy}.`},
        {s:plotSVG(Object.assign({},base,{pts:P,fns:[{f:x=>a*x+b}],segs:[[x1,y1,x2,y1,'var(--red)',false,`Δx = ${dx}`,0,16],[x2,y1,x2,y2,'#2B6CD4',false,`Δy = ${dy}`,30,0]]}))+der([[`a = ${F('endring i y','endring i x')} = ${F(`${y2} − ${y1<0?'('+y1+')':y1}`,`${x2} − ${x1<0?'('+x1+')':x1}`)} = ${F(dy,dx)}`],[dbl(`a = ${Number.isInteger(a)?nb(a):F(dy/gcd(dy,dx)*Math.sign(dx),Math.abs(dx)/gcd(dy,dx))}`)]]),c:a>0?'Stigningstallet er positivt, så grafen stiger.':a<0?'Stigningstallet er negativt, så grafen synker.':'Stigningstallet er 0, så grafen er vannrett.'}]; } });
}
function mountK10Konst(el){
  return k9Model(el,{title:'Konstantledd',fields:[{id:'a',label:'Stigningstall a',def:1,lo:-4,hi:4,dec:true},{id:'b',label:'Konstantledd b',def:3,lo:-6,hi:6,dec:true}],rand:()=>({a:pick([-2,-1,0.5,1,2]),b:rnd(-5,5)}),
    steps(v){ const {a,b}=v, base={x0:-5,x1:5,y0:-8,y1:8,xs:1,ys:2,W:380,H:320};
      return [{s:eqH(`f(x) = ax + b`),c:'Lineære funksjoner kan skrives f(x) = ax + b. Her er a stigningstallet og b konstantleddet.'},
        {s:plotSVG(Object.assign({},base,{fns:[{f:x=>a*x,c:'#B9C2D6',dash:true},{f:x=>a*x+b,lab:af(fxS(a,b))}]})),c:`Grafen til ${af(fxS(a,b))} er parallell med grafen til y = ${af(mono(a,1)||'0')}, men flyttet ${Math.abs(b)} ${b>=0?'opp':'ned'}.`},
        {s:plotSVG(Object.assign({},base,{fns:[{f:x=>a*x+b}],pts:[{x:0,y:b,lab:`(0, ${nb(b)})`}]})),c:`Konstantleddet b = ${nb(b)} er der grafen skjærer y-aksen, fordi f(0) = a · 0 + b = b.`}]; } });
}
function mountK10Lin(el){
  return k9Model(el,{title:'Lineære funksjoner i hverdagen',fields:[{id:'b',label:'Fastpris (kr)',def:50,lo:0,hi:500},{id:'a',label:'Pris per km (kr)',def:12,lo:1,hi:100},{id:'x',label:'Antall km',def:15,lo:1,hi:100}],rand:()=>({b:pick([40,50,60,80]),a:pick([10,12,15,18]),x:rnd(5,30)}),
    steps(v){ const {a,b,x}=v, X1=Math.max(10,Math.ceil(x*1.3/5)*5), Y1=Math.ceil((a*X1+b)*1.1/50)*50;
      const base={x0:0,x1:X1,y0:0,y1:Y1,W:420,H:300,xl:'km',yl:'kr'};
      return [{s:'',c:`En taxi koster ${b} kr i fastpris og ${a} kr per kilometer.`},
        {s:eqH(`f(x) = ${a}x + ${b}`),c:`Prisen for x km er f(x) = ${a}x + ${b}. Stigningstallet ${a} er prisen per km, og konstantleddet ${b} er fastprisen.`},
        {s:plotSVG(Object.assign({},base,{fns:[{f:t=>a*t+b}],pts:[{x:0,y:b,lab:`${b} kr`}]})),c:'Grafen starter i fastprisen og stiger like mye for hver kilometer.'},
        {s:plotSVG(Object.assign({},base,{fns:[{f:t=>a*t+b}],pts:[{x,y:a*x+b,lab:`${a*x+b} kr`}],segs:[[x,0,x,a*x+b,'var(--red)',true],[0,a*x+b,x,a*x+b,'var(--red)',true]]}))+eqH(`f(${x}) = ${a} · ${x} + ${b} = ${a*x+b}`),c:`En tur på ${x} km koster ${a*x+b} kr.`}]; } });
}
function mountK10BrokF(el){
  return k9Model(el,{title:'Brøkfunksjoner (omvendt proporsjonalitet)',fields:[{id:'k',label:'Konstanten k',def:12,lo:1,hi:100}],rand:()=>({k:pick([6,8,12,24,36,60])}),
    steps(v){ const k=v.k, xs=[1,2,3,4,6].filter(x=>x<=k), base={x0:0,x1:Math.max(8,k/2),y0:0,y1:k*1.1,W:400,H:300};
      return [{s:eqH(`f(x) = ${F(k,'x')}`),c:`I en brøkfunksjon står x i nevneren. Her er f(x) = ${k}/x.`},
        {s:vtab(xs,x=>k/x)+eqH(`x · f(x) = ${k}`),c:`Når x dobles, halveres f(x). Produktet x · f(x) er alltid ${k}. Vi sier at størrelsene er <b>omvendt proporsjonale</b>.`},
        {s:plotSVG(Object.assign({},base,{fns:[{f:x=>x>0.05?k/x:NaN,lab:'f'}],pts:xs.map(x=>({x,y:k/x}))})),c:'Grafen er en kurve (en hyperbel). Den kommer nærmere og nærmere aksene, men treffer dem aldri. x kan ikke være 0.'}]; } });
}
function mountK10Andre(el){
  return k9Model(el,{title:'Andregradsfunksjoner',fields:[{id:'a',label:'a (foran x²)',def:1,lo:-3,hi:3,dec:true},{id:'b',label:'b (foran x)',def:-4,lo:-10,hi:10,dec:true},{id:'c',label:'c',def:3,lo:-10,hi:10,dec:true}],rand:()=>{ const a=pick([1,-1,2,0.5]), h=rnd(-2,3); return {a,b:-2*a*h,c:rnd(-4,4)}; },
    steps(v,_,e){ const {a,b,c}=v; if(!a){ e.push('a kan ikke være 0.'); return null; } const h=-b/(2*a), k=a*h*h+b*h+c, f=x=>a*x*x+b*x+c, xs=[h-2,h-1,h,h+1,h+2].map(r2d);
      const ys=xs.map(f), base={x0:Math.floor(h-4),x1:Math.ceil(h+4),y0:Math.min(-1,Math.floor(Math.min(...ys,k))-1),y1:Math.max(1,Math.ceil(Math.max(...ys,k))+1),xs:1,ys:Math.max(1,Math.round((Math.max(...ys)-Math.min(...ys))/8)),W:400,H:320};
      const E=`f(x) = ${af(quadS(a,b,c))}`;
      return [{s:eqH(E),c:'En andregradsfunksjon har et ledd med x². Grafen er en krum kurve som kalles en <b>parabel</b>.'},
        {s:eqH(E)+vtab(xs,f),c:`Verditabellen er symmetrisk rundt x = ${nb(h)}.`},
        {s:plotSVG(Object.assign({},base,{fns:[{f}],pts:xs.map(x=>({x,y:f(x)}))})),c:a>0?'Når a er positiv, vender parabelen åpningen opp («glad munn»).':'Når a er negativ, vender parabelen åpningen ned («sur munn»).'},
        {s:plotSVG(Object.assign({},base,{fns:[{f}],pts:[{x:h,y:k,lab:`(${nb(h)}, ${nb(k)})`}],segs:[[h,base.y0,h,base.y1,'#9A6BE0',true]]}))+eqH(`x = ${F('−b','2a')} = ${F(nb(-b),nb(2*a))} = ${nb(h)}`),c:`Grafen har et <b>${a>0?'bunnpunkt':'toppunkt'}</b> i (${nb(h)}, ${nb(k)}). Det kalles et ekstremalpunkt. Grafen er symmetrisk om linja x = ${nb(h)}.`}]; } });
}
function mountK10Eksp(el){
  return k9Model(el,{title:'Eksponentiell vekst',fields:[{id:'a',label:'Startverdi',def:1000,lo:1,hi:100000},{id:'p',label:'Prosent per år',def:10,lo:-50,hi:100,dec:true},{id:'n',label:'Antall år',def:5,lo:1,hi:30}],rand:()=>({a:pick([500,1000,2000,10000]),p:pick([5,10,-10,20,-20,3]),n:rnd(3,10)}),
    steps(v){ const {a,p,n}=v, g=1+p/100, f=x=>a*Math.pow(g,x), xs=Array.from({length:Math.min(n,6)+1},(_,i)=>i);
      const base={x0:0,x1:Math.max(n,6),y0:0,y1:Math.max(a,f(Math.max(n,6)))*1.1,W:420,H:300,xl:'år'};
      return [{s:eqH(`Vekstfaktor = 1 ${p<0?'−':'+'} ${F(Math.abs(p),100)} = ${nb(g)}`),c:`Når noe ${p<0?'avtar':'øker'} med ${Math.abs(p)} % per år, ganger vi med vekstfaktoren ${nb(g)} hvert år.`},
        {s:vtab(xs,f,'verdi'),c:`Startverdien er ${nb(a)}. Hvert år ganger vi med ${nb(g)}. Økningen er ikke like stor hvert år.`},
        {s:plotSVG(Object.assign({},base,{fns:[{f}],pts:xs.map(x=>({x,y:f(x)}))})),c:'Grafen krummer. Det kalles <b>eksponentiell</b> vekst (eller nedgang).'},
        {s:eqH(`f(x) = ${nb(a)} · ${nb(g)}<sup>x</sup>`)+eqH(`f(${n}) = ${nb(a)} · ${nb(g)}<sup>${n}</sup> ≈ ${nb(r2d(f(n)))}`),c:`Etter ${n} år er verdien ${nb(r2d(f(n)))}.`}]; } });
}
function mountK10Regr(el){
  return k9Model(el,{title:'Matematiske modeller og regresjon',modes:[['lin','Lineær'],['eksp','Eksponentiell']],fields:[{id:'d',label:'Data (y-verdier)',def:'12, 15, 19, 21, 25, 28',text:true}],
    rand:m=>({d:m==='lin'?Array.from({length:6},(_,i)=>10+3*i+rnd(-2,2)).join(', '):Array.from({length:6},(_,i)=>Math.round(10*Math.pow(1.3,i))+rnd(-1,1)).join(', ')}),onMode:m=>({d:m==='lin'?'12, 15, 19, 21, 25, 28':'10, 13, 17, 22, 29, 37'}),
    steps(v,m,e){ const ys=k9data(v.d); if(ys.length<3){ e.push('Skriv minst tre tall.'); return null; } const xs=ys.map((_,i)=>i), n=ys.length;
      let a,b,f,E; if(m==='lin'){ const mx=sum(xs)/n, my=sum(ys)/n; a=sum(xs.map((x,i)=>(x-mx)*(ys[i]-my)))/sum(xs.map(x=>(x-mx)**2)); b=my-a*mx; f=x=>a*x+b; E=`f(x) = ${nb(r2d(a))}x ${b<0?'−':'+'} ${nb(Math.abs(r2d(b)))}`; }
      else { if(ys.some(y=>y<=0)){ e.push('Eksponentiell modell krever positive tall.'); return null; } const ly=ys.map(Math.log), mx=sum(xs)/n, my=sum(ly)/n; const k=sum(xs.map((x,i)=>(x-mx)*(ly[i]-my)))/sum(xs.map(x=>(x-mx)**2)); b=Math.exp(my-k*mx); a=Math.exp(k); f=x=>b*Math.pow(a,x); E=`f(x) = ${nb(r2d(b))} · ${nb(Math.round(a*1000)/1000)}<sup>x</sup>`; }
      const base={x0:0,x1:n+1,y0:0,y1:Math.max(...ys,f(n+1))*1.1,W:420,H:300};
      return [{s:plotSVG(Object.assign({},base,{pts:xs.map((x,i)=>({x,y:ys[i],c:'var(--pen)'}))})),c:'Vi har målinger som punkter i et koordinatsystem. Ligger de omtrent på en linje, eller krummer de?'},
        {s:plotSVG(Object.assign({},base,{pts:xs.map((x,i)=>({x,y:ys[i],c:'var(--pen)'})),fns:[{f,c:'var(--red)'}]}))+eqH(E),c:`<b>Regresjon</b> finner funksjonen som passer best med punktene. I GeoGebra bruker vi «Regresjonsanalyse». Her: ${m==='lin'?'lineær':'eksponentiell'} modell.`},
        {s:plotSVG(Object.assign({},base,{pts:[...xs.map((x,i)=>({x,y:ys[i],c:'var(--pen)'})),{x:n,y:f(n),lab:nb(r2d(f(n)))}],fns:[{f,c:'var(--red)'}]}))+eqH(`f(${n}) ≈ ${nb(r2d(f(n)))}`),c:`Vi kan bruke modellen til å anslå neste verdi: omtrent ${nb(r2d(f(n)))}. En modell er en forenkling, så svaret er usikkert.`}]; } });
}

 k10stigT:{ title:'Stigningstall', levels:LVa, filters:[{k:'t',label:'Type',opts:[['punkt','Fra to punkter'],['graf','Fra graf'],['tekst','Fra tekst']],def:'punkt'}],
  gen(L,f){ if(f.t==='tekst'){ const c=pick([['En bil bruker {a} liter bensin per mil.','liter per mil'],['En vannkran fyller {a} liter i minuttet.','liter per minutt'],['Et stearinlys brenner ned {a} cm i timen.','cm per time']]), a=rnd(2,12)*(L===1?1:0.5); return {q:`${c[0].replace('{a}',nb(a))} Hva er stigningstallet hvis vi lager en lineær funksjon?`, a:c[0].includes('brenner')?-a:a, steps:[`Stigningstallet er endringen per enhet: ${c[0].includes('brenner')?'−':''}${nb(a)} ${c[1]}`]}; }
   const x1=rnd(-3,2), dx=rnd(1,L===1?3:5), a=L===1?rnd(1,3):pick([-3,-2,-1,1,2,3,0.5,-0.5]), y1=rnd(-3,3), x2=x1+dx, y2=y1+a*dx; if(!Number.isInteger(y2)) return this.gen(L,f);
   if(f.t==='graf'){ const b=y1-a*x1; return {q:`${linPlot(a,b,{extra:{xs:1,ys:1,pts:[{x:x1,y:y1},{x:x2,y:y2}]}})}<p>Finn stigningstallet til grafen.</p>`, a, tol:0.01, steps:[`Fra (${x1}, ${y1}) til (${x2}, ${y2}): Δx = ${dx}, Δy = ${nb(y2-y1)}`,`a = ${nb(y2-y1)} / ${dx} = <b>${nb(a)}</b>`], model:{id:'k10stig',v:{x1,y1,x2,y2}}}; }
   return {q:`En rett linje går gjennom punktene (${x1}, ${y1}) og (${x2}, ${nb(y2)}). Finn stigningstallet.`, a, tol:0.01, steps:[`a = ${F(`${nb(y2)} − ${y1<0?'('+y1+')':y1}`,`${x2} − ${x1<0?'('+x1+')':x1}`)} = ${F(nb(y2-y1),dx)}`,`a = <b>${nb(a)}</b>`], model:{id:'k10stig',v:{x1,y1,x2,y2}}}; } },
 k10konstT:{ title:'Konstantledd', levels:LVa, filters:[{k:'t',label:'Type',opts:[['graf','Fra graf'],['formel','Lag formel']],def:'graf'}],
  gen(L,f){ const a=pick([-2,-1,1,2,3]), b=rnd(-5,6);
   if(f.t==='formel'){ const m=mcFrom(fxS(a,b),[fxS(b,a),fxS(a,-b),fxS(-a,b)]); return {q:`En linje har stigningstall ${a} og skjærer y-aksen i ${b}. Hvilket funksjonsuttrykk har den?`, mc:m, steps:[`f(x) = ax + b med a = ${a} og b = ${b}`]}; }
   return {q:`${linPlot(a,b,{extra:{xs:1,ys:2}})}<p>Hva er konstantleddet b?</p>`, a:b, steps:[`Grafen skjærer y-aksen i (0, ${b})`,`b = <b>${b}</b>`], model:{id:'k10konst',v:{a,b}}}; } },
 k10linT:{ title:'Lineære funksjoner', levels:LVa, filters:[{k:'t',label:'Type',opts:[['verdi','Regn ut'],['baklengs','Finn x'],['formel','Finn a og b']],def:'verdi'}],
  gen(L,f){ const c=pick([['En taxi koster {b} kr i fastpris og {a} kr per km.','km','kr'],['Et treningssenter tar {b} kr i innmelding og {a} kr per måned.','måneder','kr'],['En rørlegger tar {b} kr for oppmøte og {a} kr per time.','timer','kr'],['Et basseng har {b} liter vann. Det fylles med {a} liter i minuttet.','minutter','liter']]);
   const a=pick([10,12,15,20,25,250,300]), b=pick([50,60,80,100,200,500]), x=rnd(2,L===1?10:30), t=c[0].replace('{a}',a).replace('{b}',b);
   if(f.t==='formel'){ return {q:`${t} Lag en funksjon f(x) = ax + b der x er antall ${c[1]}. Hva er a og b?`, multi:[{label:'a',a},{label:'b',a:b}], steps:[`a = ${a} (per ${c[1].replace(/er$/,'')})`,`b = ${b} (fast)`]}; }
   if(f.t==='baklengs'&&L>1){ const y=a*x+b; return {q:`${t} Hvor mange ${c[1]} gir ${y} ${c[2]}?`, a:x, u:c[1], steps:[`${a}x + ${b} = ${y}`,`${a}x = ${y-b}, x = <b>${x}</b>`]}; }
   return {q:`${t} Hva blir det for ${x} ${c[1]}?`, a:a*x+b, u:c[2], steps:[`f(${x}) = ${a} · ${x} + ${b}`,`= <b>${a*x+b}</b>`], model:c[0].includes('taxi')?{id:'k10lin',v:{a,b,x}}:null}; } },
 k10lingraf:{ title:'Grafen til lineære funksjoner', levels:LVa, filters:[{k:'t',label:'Type',opts:[['ab','Finn a og b'],['skj','Skjæring med x-aksen']],def:'ab'}],
  gen(L,f){ const a=pick(L===1?[1,2,3,-1]:[-3,-2,-1,1,2,3,0.5]), b=rnd(-4,5);

 k10brokfT:{ title:'Brøkfunksjoner', levels:LVa, filters:[{k:'t',label:'Type',opts:[['verdi','Regn ut'],['k','Finn konstanten'],['omv','Omvendt proporsjonal?']],def:'verdi'}],
  gen(L,f){ const k=pick([12,24,36,48,60,72,120]);

 k10brokTekst:{ title:'Omvendt proporsjonalitet i hverdagen', levels:LVa, filters:[{k:'t',label:'Type',opts:[['arb','Arbeid'],['fart','Fart og tid']],def:'arb'}],
  gen(L,f){ if(f.t==='fart'){ const s=pick([120,180,240,300,360]), v1=pick([40,60,80]), v2=pick([30,40,60,90,120].filter(v=>v!==v1&&s%v===0)); if(!v2) return this.gen(L,f); return {q:`En tur på ${s} km tar ${s/v1} timer med fart ${v1} km/t. Hvor lang tid tar turen med fart ${v2} km/t?`, a:s/v2, u:'timer', tol:0.01, steps:[`Fart · tid = ${s}`,`t = ${s} / ${v2} = <b>${nb(s/v2)}</b>`]}; }
   const n1=rnd(2,6), d1=pick([6,8,10,12,15,24]), T=n1*d1, n2=pick([2,3,4,5,6,8,10,12].filter(n=>n!==n1&&T%n===0)); return {q:`${n1} malere bruker ${d1} dager på å male et hus. Hvor mange dager bruker ${n2} malere?`, a:T/n2, u:'dager', steps:[`Antall malere · dager = ${T}`,`${T} : ${n2} = <b>${T/n2}</b>`]}; } },
 k10andreT:{ title:'Andregradsfunksjoner', levels:LVa, filters:[{k:'t',label:'Type',opts:[['verdi','Funksjonsverdier'],['ekst','Ekstremalpunkt'],['form','Topp- eller bunnpunkt?']],def:'verdi'}],
  gen(L,f){ const a=pick(L===1?[1,-1]:[1,-1,2,-2,0.5]), h=rnd(-3,3), b=-2*a*h, c=rnd(-5,5), k=a*h*h+b*h+c;

 k10ekspT:{ title:'Eksponentialfunksjoner', levels:LVa, filters:[{k:'t',label:'Type',opts:[['vf','Vekstfaktor'],['verdi','Verdi etter n år'],['type','Lineær eller eksponentiell?']],def:'vf'}],

 k10modT:{ title:'Matematiske modeller', levels:LVa, filters:[{k:'t',label:'Type',opts:[['velg','Velg modell'],['bruk','Bruk modellen']],def:'velg'}],

 brokfunk:{ title:'Brøkfunksjoner', short:'f(x) = k/x, omvendt proporsjonalitet.', learn:`<p>I en brøkfunksjon står x i nevneren. Funksjonen f(x) = k/x beskriver størrelser som er <b>omvendt proporsjonale</b>: produktet x · y er konstant.</p><div class="model" data-model="k10brokf"></div>${HU('Husk','<p>Dobles x, halveres y. x kan ikke være 0.</p>')}`, trainers:[{id:'k10brokfT'}] },

const r0=x=>Math.round(x), rk=x=>Math.round(x*100)/100;
const pctBar=(parts)=>{ // parts: [[label, verdi, farge]]
  const tot=sum(parts.map(p=>p[1])), W=420; let x=10, s='';
  parts.forEach(p=>{ const w=(W-20)*p[1]/tot; s+=`<rect x="${x}" y="16" width="${w}" height="40" fill="${p[2]||'var(--pen-soft)'}" stroke="var(--ink)" stroke-width="1.5"/>`+(w>50?k9t(x+w/2,41,p[0],'s tb'):''); x+=w; });
  return k9svg(W,70,s,'Stolpemodell'); };
const tabK=(head,rows)=>k9tab(head,rows.map(r=>r.map(c=>typeof c==='number'?nf(rk(c)):c)));

function mountK10Pros(el){
  return k9Model(el,{title:'Prosentvis endring',fields:[{id:'g',label:'Gammel pris (kr)',def:800,lo:1,hi:100000,dec:true},{id:'n',label:'Ny pris (kr)',def:600,lo:1,hi:100000,dec:true}],rand:()=>{ const g=pick([200,400,500,800,1200,2500]); return {g,n:g*pick([0.75,0.8,0.9,1.1,1.2,1.25,0.6])}; },
    steps(v){ const {g,n}=v, d=n-g, p=d/g*100;
      return [{s:pctBar([['gammel pris '+nf(g),g]]),c:`En vare kostet ${nf(g)} kr. Nå koster den ${nf(n)} kr.`},
        {s:eqH(`Endring = ${nf(n)} − ${nf(g)} = ${nf(d)} kr`),c:`Prisen har ${d<0?'gått ned':'gått opp'} med ${nf(Math.abs(d))} kr.`},
        {s:der([[`${F('endring','opprinnelig verdi')} · 100 %`],[`= ${F(nf(Math.abs(d)),nf(g))} · 100 %`],[dbl(`= ${nf(r2d(Math.abs(p)))} %`)]]),c:`Vi deler endringen på det vi sammenligner med (den gamle prisen). Prisen har ${d<0?'gått ned':'gått opp'} med ${nf(r2d(Math.abs(p)))} %.`}]; } });
}
function mountK10Vf(el){
  return k9Model(el,{title:'Vekstfaktor',fields:[{id:'g',label:'Pris (kr)',def:500,lo:1,hi:100000,dec:true},{id:'p',label:'Endring i %',def:-20,lo:-99,hi:300,dec:true},{id:'p2',label:'Ny endring i % (0 = ingen)',def:10,lo:-99,hi:300,dec:true}],rand:()=>({g:pick([300,500,800,1500]),p:pick([-30,-20,-10,10,25]),p2:pick([0,10,-10,20])}),
    steps(v){ const {g,p,p2}=v, v1=1+p/100, v2=1+p2/100;
      const st=[{s:eqH(`Vekstfaktor = 1 ${p<0?'−':'+'} ${F(Math.abs(p),100)} = ${nb(v1)}`),c:`En ${p<0?'nedgang':'økning'} på ${Math.abs(p)} % gir vekstfaktoren ${nb(v1)}. ${p<0?`Vi betaler ${nb(100+p)} % av prisen.`:`Ny pris er ${nb(100+p)} % av den gamle.`}`},
        {s:eqH(`${nf(g)} kr · ${nb(v1)} = ${nf(rk(g*v1))} kr`),c:`Ny pris finner vi ved å gange med vekstfaktoren i ett steg.`}];
      if(p2) st.push({s:der([[`${nf(g)} · ${nb(v1)} · ${nb(v2)}`],[dbl(`= ${nf(rk(g*v1*v2))} kr`)]]),c:`Ved flere endringer ganger vi med vekstfaktorene etter hverandre. Legg merke til at ${p}% og ${p2>0?'+':''}${p2}% ikke blir ${p+p2}%: samlet vekstfaktor er ${nb(Math.round(v1*v2*10000)/10000)}.`});
      return st; } });
}
function mountK10FinnP(el){

    steps(v){ const {n,p}=v, vf=1+p/100, g=n/vf;

function mountK10Toll(el){

 prosentendring:{ title:'Prosentvis endring', short:'Endring delt på opprinnelig verdi.', learn:`<p>Når en pris endrer seg, kan vi regne ut hvor mange prosent den har endret seg. Vi sammenligner alltid med den <b>opprinnelige</b> verdien.</p><div class="model" data-model="k10pros"></div>${HU('Formel','<p class="eq">prosentvis endring = endring / opprinnelig verdi · 100 %</p>')}`, trainers:[{id:'k10prosT'}] },

/* ===================== 10. TRINN KAP 4: UTFORSKENDE ARBEID ===================== */
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ';
const caesar=(t,k)=>t.toUpperCase().split('').map(c=>{ const i=ABC.indexOf(c); return i<0?c:ABC[((i+k)%29+29)%29]; }).join('');
const textChk=ans=>u=>{ const a=String(u).trim().toUpperCase().replace(/\s+/g,' '); if(!a) return {ok:null,msg:'Skriv svaret.'}; return {ok:a===ans.toUpperCase()}; };
const ROM=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
const toRom=n=>{ let s=''; ROM.forEach(([v,r])=>{ while(n>=v){ s+=r; n-=v; } }); return s; };
const WORDS=['MATTE','SKOLE','HEMMELIG','KODE','NORGE','BÅT','FJELL','PIZZA','SOMMER','VINTER','TALL','LØSNING','HELT','KATT','HUND','ØYE'];

/* ---------- modeller ---------- */
function mountK10Moped(el){
  return k9Model(el,{title:'Moped og sertifikat',fields:[{id:'k',label:'Kjøpspris (kr)',def:22000,lo:0,hi:200000},{id:'f',label:'Forsikring per år (kr)',def:3600,lo:0,hi:50000},{id:'l',label:'Bensin (liter per mil)',def:0.3,lo:0,hi:3,dec:true},{id:'p',label:'Bensinpris (kr/L)',def:21,lo:0,hi:50,dec:true},{id:'m',label:'Mil per år',def:300,lo:0,hi:5000}],rand:()=>({k:pick([15000,22000,30000]),f:pick([2400,3600,4800]),l:pick([0.25,0.3,0.35]),p:pick([19,21,23]),m:pick([200,300,500])}),
    steps(v){ const {k,f,l,p,m}=v, B=l*p*m, tot=f+B;
      return [{s:'',c:`Du skal kjøpe moped til ${nf(k)} kr. I tillegg kommer forsikring og bensin hvert år. Lappen (klasse AM146) koster også penger.`},
        {s:der([[`Bensin: ${nb(l)} L/mil · ${m} mil = ${nb(l*m)} L`],[`${nb(l*m)} L · ${nb(p)} kr/L = ${nf(rk(B))} kr`]]),c:'Vi regner ut bensinkostnaden for et år.'},
        {s:tabK(['Utgift per år','kr'],[['Forsikring',f],['Bensin',B],['<b>Sum</b>',tot]])+eqH(`Per mil: ${F(nf(rk(tot)),m)} ≈ ${nf(rk(tot/m))} kr`),c:`Driften koster ${nf(rk(tot))} kr per år, eller omtrent ${nf(rk(tot/m))} kr per mil (uten kjøpsprisen).`}]; } });
}
function mountK10Bolig(el){
  return k9Model(el,{title:'Bolig og økonomi',fields:[{id:'a',label:'Rom 1: lengde (m)',def:6,lo:1,hi:20,dec:true},{id:'b',label:'Rom 1: bredde (m)',def:4,lo:1,hi:20,dec:true},{id:'c',label:'Rom 2: lengde (m)',def:3,lo:0,hi:20,dec:true},{id:'d',label:'Rom 2: bredde (m)',def:2.5,lo:0,hi:20,dec:true},{id:'k',label:'Pris per m² (kr)',def:55000,lo:1000,hi:200000}],rand:()=>({a:rnd(5,9),b:rnd(3,6),c:rnd(2,4),d:pick([2,2.5,3]),k:pick([40000,55000,70000])}),
    steps(v){ const {a,b,c,d,k}=v, A=a*b+c*d, P=A*k, E=P*0.15, u=Math.min(26,300/(a+c));
      const fig=k9svg((a+c)*u+80,Math.max(b,d)*u+50,`<rect class="top" x="40" y="20" width="${a*u}" height="${b*u}"/><rect class="top" x="${40+a*u}" y="20" width="${c*u}" height="${d*u}"/>`+k9t(40+a*u/2,14,`${nb(a)} m`,'s')+k9t(34,20+b*u/2,`${nb(b)} m`,'s','end')+k9t(40+a*u+c*u/2,14,`${nb(c)} m`,'s')+k9t(46+a*u+c*u,20+d*u/2,`${nb(d)} m`,'s','start'),'Plantegning');
      return [{s:fig,c:'En leilighet består av to rektangulære deler. Vi finner arealet først.'},
        {s:fig+eqH(`A = ${nb(a)} · ${nb(b)} + ${nb(c)} · ${nb(d)} = ${nb(A)} m²`),c:`Arealet er ${nb(A)} m².`},
        {s:der([[`Pris = ${nb(A)} m² · ${nf(k)} kr/m² = ${nf(rk(P))} kr`],[`Egenkapital 15 % = ${nf(rk(P))} · 0,15 = ${nf(rk(E))} kr`],[`Lån = ${nf(rk(P-E))} kr`]]),c:'Når du kjøper bolig, må du ha minst 15 % egenkapital. Resten kan du låne.'}]; } });
}
function mountK10Jord(el){
  return k9Model(el,{title:'Jorda og beregninger',modes:[['omkr','Omkrets og fart'],['sone','Tidssoner']],fields:[{id:'r',label:'Jordas radius (km)',def:6371,lo:1000,hi:10000},{id:'g',label:'Lengdegrader mellom stedene',def:60,lo:0,hi:180}],
    rand:m=>m==='omkr'?{r:6371}:{g:pick([15,30,45,75,105,135])},
    steps(v,m){ const {r,g}=v;
      if(m==='omkr'){ const O=2*PI*r;
        return [{s:eqH(`O = 2 · π · r = 2 · 3,14 · ${nf(r)} ≈ ${nf(r0(O))} km`),c:'Jorda er nesten en kule. Omkretsen rundt ekvator er 2πr.'},
          {s:eqH(`Fart = ${F(nf(r0(O))+' km','24 t')} ≈ ${nf(r0(O/24))} km/t`),c:`Jorda snurrer én gang rundt på 24 timer. Et punkt på ekvator beveger seg derfor med omtrent ${nf(r0(O/24))} km/t.`}]; }
      const h=g/15;
      return [{s:eqH('360° : 24 timer = 15° per time'),c:'Jorda roterer 360° på 24 timer. Det betyr 15 lengdegrader per time. Derfor har vi tidssoner.'},
        {s:eqH(`${g}° : 15° = ${nb(h)} timer`),c:`To steder med ${g} lengdegrader mellom seg har omtrent ${nb(h)} timer tidsforskjell. Mot øst er klokka mer, mot vest er den mindre.`}]; } });
}
function mountK10Krypt(el){
  return k9Model(el,{title:'Kryptering: Cæsar-chiffer',fields:[{id:'t',label:'Tekst',def:'MATTE',text:true},{id:'k',label:'Nøkkel (forskyvning)',def:3,lo:1,hi:28}],rand:()=>({t:pick(WORDS),k:rnd(1,10)}),
    steps(v){ const t=String(v.t).toUpperCase().replace(/[^A-ZÆØÅ ]/g,'').slice(0,14)||'MATTE', k=v.k, c=caesar(t,k);
      const row=(s,hi)=>`<div class="k10-abc">${ABC.split('').map(ch=>`<span class="${hi&&hi.includes(ch)?'on':''}">${ch}</span>`).join('')}</div>`;
      return [{s:row(ABC,t)+row(caesar(ABC,k),c),c:`I et Cæsar-chiffer flytter vi hver bokstav like mange plasser i alfabetet. Nøkkelen er ${k}. Vi bruker det norske alfabetet med 29 bokstaver.`},
        {s:k9tab(t.split('').map(ch=>ch),[c.split('')]),c:`Vi bytter hver bokstav: ${t.split('').filter(ch=>ch!==' ').slice(0,3).map(ch=>`${ch} → ${caesar(ch,k)}`).join(', ')} …`},
        {s:eqH(`${t} → ${c}`),c:`Den krypterte teksten er <b>${c}</b>. For å dekryptere flytter vi ${k} plasser bakover. Etter Å fortsetter vi fra A igjen.`}]; } });
}
function mountK10Tall(el){
  return k9Model(el,{title:'Ulike tallsystemer',modes:[['bin','Totallsystemet'],['rom','Romertall']],fields:[{id:'n',label:'Tall i titallsystemet',def:13,lo:1,hi:3999}],rand:m=>({n:m==='bin'?rnd(5,60):rnd(10,2025)}),onMode:m=>({n:m==='bin'?13:1994}),
    steps(v,m){ const n=v.n;
      if(m==='bin'){ const b=n.toString(2), ps=b.split('').map((d,i)=>[d,Math.pow(2,b.length-1-i)]);
        return [{s:k9tab(ps.map(p=>p[1]),[ps.map(p=>p[0])]),c:`I totallsystemet (binært) bruker vi bare sifrene 0 og 1. Plassene har verdiene 1, 2, 4, 8, 16, …`},
          {s:eqH(ps.filter(p=>p[0]==='1').map(p=>p[1]).join(' + ')+` = ${n}`),c:`Vi legger sammen verdiene der det står 1.`},
          {s:eqH(`${n}<sub>10</sub> = ${b}<sub>2</sub>`),c:`Tallet ${n} skrives ${b} i totallsystemet. Datamaskiner bruker totallsystemet.`}]; }
      const r=toRom(Math.min(3999,n)); const parts=[]; let x=n; ROM.forEach(([vv,rr])=>{ while(x>=vv){ parts.push(`${rr} = ${vv}`); x-=vv; } });
      return [{s:k9htab([['I','V','X','L','C','D','M'],['1','5','10','50','100','500','1000']]),c:'Romertall bruker bokstaver. En mindre verdi foran en større betyr minus: IV = 4, IX = 9.'},
        {s:eqH(parts.join(', ')),c:'Vi deler tallet i tusener, hundrere, tiere og enere.'},
        {s:eqH(`${n} = ${r}`),c:`${n} skrives <b>${r}</b> med romertall.`}]; } });
}
Object.assign(MODELS,{k10moped:mountK10Moped,k10bolig:mountK10Bolig,k10jord:mountK10Jord,k10krypt:mountK10Krypt,k10tall:mountK10Tall});

function pvBody(id,title,lv,n){
  const m=id.match(/^(\d+)kap\d+-(.+)-niva(\d)$/);
  if(m){ let h=''; try{ h=wsSeeded(m[2],+m[3]); }catch(e){ console.error(e); }
    return `<div class="pv-live">${h}</div>`; }
  const base=id.replace(/-niva\d$/,''), counts=[1,2,3].map(k=>PAGES[base+'-niva'+k]||0), tot=counts.reduce((a,b)=>a+b,0), off=counts.slice(0,lv-1).reduce((a,b)=>a+b,0);
  return Array.from({length:n},(_,k)=>`<figure><div class="pv-img" role="img" aria-label="Side ${k+1} av ${title}, nivå ${lv}" style="background-image:url(ark2p/${base}.jpg);background-size:100% ${tot*100}%;background-position:0 ${tot>1?(off+k)/(tot-1)*100:0}%"></div><figcaption>Side ${k+1} av ${n}${k===n-1?' · fasit':''}</figcaption></figure>`).join(''); }
function openPrev(id,title,lv){
  let d=document.getElementById('pv'); if(!d){ d=document.createElement('dialog'); d.id='pv'; document.body.appendChild(d);
    d.addEventListener('click',e=>{ if(e.target===d||e.target.closest('[data-close]')) d.close(); }); }
  const n=PAGES[id]||1;
  d.innerHTML=`<div class="pv-in"><header class="pv-h"><div><p class="eyebrow">Forhåndsvisning · ${n} ${n===1?'side':'sider'} · fasit bakerst</p><h2>${title} <span class="pv-lv" style="--c:${LVC[lv][0]}">Nivå ${lv}</span></h2></div>
    <div class="pv-act"><a class="btn small" href="ark2/${id}.pdf" target="_blank" rel="noopener" data-file="${id}.pdf">Last ned PDF</a><button type="button" class="btn ghost small" data-close aria-label="Lukk forhåndsvisning">Lukk</button></div></header>
    <div class="pv-pages">${pvBody(id,title,lv,n)}</div></div>`;
  d.showModal(); d.querySelector('.pv-pages').scrollTop=0;
  const pl=d.querySelector('.pv-live'); if(pl){ const z=Math.min(1,(pl.clientWidth-4)/794); pl.querySelectorAll('.ws-sheet').forEach(x=>x.style.zoom=z); }
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-prev]'); if(!b) return; openPrev(b.dataset.prev,b.dataset.title,+b.dataset.lv); });
document.addEventListener('click', async e=>{
  const a=e.target.closest('#pv a[data-file]'); if(!a||!DL) return;
  e.preventDefault();
  try{ const r=await fetch(a.getAttribute('href')); if(!r.ok) throw new Error('fetch'); await DL.save({filename:'Matematikk8-'+a.dataset.file, data:await r.blob()}); }
  catch(err){ const c=err&&err.code; if(c==='declined'||c==='rate_limited') return; window.open(a.href,'_blank','noopener'); }
});
main.addEventListener('click', async e=>{
  const a=e.target.closest('a[data-file]'); if(!a||!DL) return;
  e.preventDefault(); const msg=main.querySelector('[data-dlmsg]');
  try{ const r=await fetch(a.getAttribute('href')); if(!r.ok) throw new Error('fetch'); const blob=await r.blob();
    await DL.save({filename:'Matematikk8-'+a.dataset.file, data:blob}); if(msg) msg.textContent='Lastet ned: '+a.dataset.file; }
  catch(err){ const c=err&&err.code; if(c==='declined') return; if(c==='rate_limited'){ if(msg) msg.textContent='Vent litt, og prøv igjen.'; return; } window.open(a.href,'_blank','noopener'); }
});

  if(p.fr){ const {n,d}=p.fr, val=n/d; right=pre+F(n,d); const seen=new Set([n+'/'+d]);
    for(const [a,b] of shuf([[n+1,d],[n,d+1],[d,n],[n-1,d],[n,d-1],[n*2,d],[n+d,d],[n+1,d+1],[n,d*2]])){ if(b<=0||a===0) continue; const g=gcd(a,b)||1, A=a/g, B=b/g; if(seen.has(A+'/'+B)||Math.abs(A/B-val)<1e-9) continue; seen.add(A+'/'+B); wrong.push(pre+F(A,B)); if(wrong.length===3) break; } }

    for(const [x,y] of shuf([[b,e+1],[b,e-1],[b+1,e],[e,b],[b*2,e],[b,e*2],[b-1,e]])){ if(x<1||y<1) continue; const k=x+'^'+y; if(s.has(k)||Math.pow(x,y)===Math.pow(b,e)) continue; s.add(k); wrong.push(P(x,y)); if(wrong.length===3) break; } }

    while(wrong.length<3&&g<80){ g++; const m=Object.assign({},p.ex); const k=ks[Math.floor(Math.random()*ks.length)]||'c'; const r=Math.random();
      if(r<.35) m[k]=(m[k]||0)+(Math.random()<.5?1:-1); else if(r<.6) m[k]=-(m[k]||1); else if(r<.8&&ks.length>1){ const k2=ks.find(z=>z!==k); const t=m[k]; m[k]=m[k2]; m[k2]=t; } else m[k]=(m[k]||1)*2;

}

    const nL=T.levels?T.levels.length:1; let p; try{ p=T.gen(Math.min(GS.L,nL),f); }catch(e){ continue; }

  desc:'Elevene finner alle primtallene fra 0 til 100 med Eratosthenes’ såld: de fargelegger 2-, 3-, 5- og 7-gangen, og tallene som blir igjen, er primtallene. Etterpå utforsker de mønstre, tvillingprimtall og summer av primtall.',
  inside:['Side 1: elevark med alle tallene 0–100, fremgangsmåte og seks utforskende spørsmål','Side 2: fasit med ferdig silt tabell, svar og primtallene under 100'],board:'#primtavle'}
];
const actImg=(a,k)=>`aktiviteter/${a.id}/s-${String(k).padStart(2,'0')}.jpg`;

  const a=ACTS.find(x=>x.id===id); if(!a) return;
  let d=document.getElementById('pv'); if(!d){ d=document.createElement('dialog'); d.id='pv'; document.body.appendChild(d);

    <div class="pv-act"><a class="btn small" href="aktiviteter/${a.id}.pdf" target="_blank" rel="noopener" data-file="${a.id}.pdf">Last ned PDF</a><button type="button" class="btn ghost small" data-close aria-label="Lukk forhåndsvisning">Lukk</button></div></header>
    <div class="pv-pages">${Array.from({length:a.pages},(_,i)=>`<figure data-p="${i+1}"><img class="pv-img" src="${actImg(a,i+1)}" alt="Side ${i+1} av ${a.title}" loading="${i<3?'eager':'lazy'}"><figcaption>${a.thumbs&&a.thumbs[i]?a.thumbs[i]:`Side ${i+1} av ${a.pages}${i===0?' · instruksjoner':''}`}</figcaption></figure>`).join('')}</div></div>`;
  d.showModal(); const box=d.querySelector('.pv-pages'), f=box.querySelector(`[data-p="${pg}"]`); box.scrollTop=pg>1&&f?f.offsetTop-box.offsetTop-10:0;
}

  const a=e.target.closest('#pv a[data-file^="faktor"], #pv a[href^="aktiviteter/"]'); if(!a||!DL) return;

  try{ const r=await fetch(a.getAttribute('href')); if(!r.ok) throw new Error('fetch'); await DL.save({filename:'Matematikk-'+a.dataset.file, data:await r.blob()}); }
  catch(err){ const c=err&&err.code; if(c==='declined'||c==='rate_limited') return; window.open(a.href,'_blank','noopener'); }
