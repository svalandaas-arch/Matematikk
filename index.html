function renderActivities(){
  main.innerHTML=`<div class="col">
    <nav class="crumb" aria-label="Brødsmuler"><a href="#">Forside</a><span>›</span><span>Klasseaktiviteter</span></nav>
    <header class="topic-head"><p class="eyebrow">For lærere</p><h1>Klasse<span class="hl">aktiviteter</span></h1>
      <p class="lede">Opplegg for hele klassen. Hver aktivitet er én PDF: instruksjonene står på første side, og utskriftene følger etter.</p></header>
    <p class="dlmsg" data-dlmsg aria-live="polite"></p>
    ${ACTS.map(a=>`<section class="box" aria-labelledby="act-${a.id}"><span class="lab">${a.fit}</span><h2 id="act-${a.id}">${a.title}</h2><p>${a.desc}</p>
      <ul style="margin:0;padding-left:1.2em;display:grid;gap:4px">${a.inside.map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="act-thumbs">${[1,2].map(k=>`<button type="button" class="act-th" data-actpv="${a.id}" data-pg="${k}" aria-label="Forhåndsvis side ${k}"><img src="${actImg(a,k)}" alt="" loading="lazy"><span>${a.thumbs?a.thumbs[k-1]:k===1?'Side 1 · instruksjoner':'Side 2–'+a.pages+' · utskrifter'}</span></button>`).join('')}</div>
      <div class="jump"><button type="button" class="btn ghost" data-actpv="${a.id}" data-pg="1">Forhåndsvis alle ${a.pages} sider</button><a class="btn" href="aktiviteter/${a.id}.pdf" target="_blank" rel="noopener" data-file="${a.id}.pdf">Last ned PDF</a><a class="btn ghost" href="aktiviteter/${a.id}.pdf" target="_blank" rel="noopener">Åpne i ny fane</a>${a.board?`<a class="btn" href="${a.board}">Åpne tavleversjon</a>`:''}<a class="btn ghost" href="${a.link}">Se delkapitlet</a></div></section>`).join('')}
    <footer class="foot">Matematikk · Klasseaktiviteter · Hver PDF har instruksjoner eller elevark først, og utskrifter eller fasit etter.</footer></div>`;
}
/* ===================== primtallsjakten: tavleversjon ===================== */
const PB_COL=[null,{n:2,c:'#2343B0',t:'2-gangen'},{n:3,c:'#C2362B',t:'3-gangen'},{n:5,c:'#1B7646',t:'5-gangen'},{n:7,c:'#C77700',t:'7-gangen'}];
let PB=null;
function pbLoad(){ try{ const v=JSON.parse(localStorage.getItem('primtavle2')||'null'); if(v&&v.c&&v.c.length===101) return v; }catch(e){} return {c:Array(101).fill(0),r:Array(101).fill(false),x:Array(101).fill(false),step:0}; }
function pbSave(){ try{ localStorage.setItem('primtavle2',JSON.stringify(PB.s)); }catch(e){} }
function renderPrimBoard(){
  PB={s:pbLoad(), tool:'1', drag:null, timer:null};
  main.innerHTML=`<div class="col pb-col">
    <nav class="crumb" aria-label="Brødsmuler"><a href="#">Forside</a><span>›</span><a href="#aktiviteter">Klasseaktiviteter</a><span>›</span><span>Primtallsjakten på tavla</span></nav>
    <section class="pb" id="pb" aria-label="Primtallsjakten, interaktiv tavle">
      <div class="pb-bar" role="toolbar" aria-label="Verktøy">
        ${PB_COL.slice(1).map((o,i)=>`<button type="button" class="pb-t" data-tool="${i+1}" style="--c:${o.c}" aria-pressed="false"><i></i>${o.t}</button>`).join('')}
        <button type="button" class="pb-t" data-tool="ring" aria-pressed="false"><i class="ring"></i>Ring rundt</button>
        <button type="button" class="pb-t" data-tool="x" aria-pressed="false"><i class="xx"></i>Kryss</button>
        <button type="button" class="pb-t" data-tool="erase" aria-pressed="false"><i class="er"></i>Visk ut</button>
        <span class="sp"></span>
        <button type="button" class="btn ghost small" data-pb="reset">Nullstill</button>
        <button type="button" class="btn ghost small" data-pb="fs">Fullskjerm</button>
      </div>
      <div class="pb-main"><div class="pb-grid" id="pb-grid">${Array.from({length:101},(_,n)=>`<button type="button" class="pb-c" data-n="${n}"><span>${n}</span></button>`).join('')}</div>
        <aside class="pb-side"><p class="pb-cnt"><b id="pb-nr">0</b> ringet rundt</p></aside></div>
    </section>
    <div class="box"><span class="lab">Slik bruker du tavla</span><p>Velg et verktøy og trykk på tallene. Du kan dra over flere tall på én gang. Et tall kan ha flere farger, for eksempel 6, som er både i 2-gangen og 3-gangen. Trykker du på et tall som allerede har den fargen, blir bare den fargen fjernet. Tavla husker det du har gjort i denne nettleseren til du trykker <b>Nullstill</b>.</p>
      <p>Tastatur: <b>1–4</b> velger farge, <b>R</b> ring, <b>X</b> kryss, <b>V</b> visk ut, <b>F</b> fullskjerm.</p>
      <div class="jump"><a class="btn ghost" href="aktiviteter/primtallsjakten.pdf" target="_blank" rel="noopener">Elevarket som PDF</a><a class="btn ghost" href="#kap2-delelighet">Se delkapitlet</a></div></div>
  </div>`;
  const root=main.querySelector('#pb'), grid=root.querySelector('#pb-grid');
  const tint=h=>`color-mix(in srgb,${h} 28%,var(--surface))`;
  const paint=()=>{ let k=0; grid.querySelectorAll('.pb-c').forEach(b=>{ const n=+b.dataset.n, cs=[1,2,3,4].filter(i=>PB.s.c[n]&(1<<(i-1)));
      b.style.setProperty('--c', cs.length===1?PB_COL[cs[0]].c:'var(--ink)');
      b.style.background = cs.length>1 ? `linear-gradient(135deg,${cs.map((i,j)=>`${tint(PB_COL[i].c)} ${j*100/cs.length}% ${(j+1)*100/cs.length}%`).join(',')})` : '';
      b.classList.toggle('col',cs.length>0); b.classList.toggle('multi',cs.length>1); b.classList.toggle('ring',PB.s.r[n]); b.classList.toggle('x',PB.s.x[n]); if(PB.s.r[n]) k++;
      b.setAttribute('aria-label', `${n}${cs.length?', '+cs.map(i=>PB_COL[i].t).join(' og '):''}${PB.s.r[n]?', ringet rundt':''}${PB.s.x[n]?', krysset over':''}`); });
    root.querySelector('#pb-nr').textContent=k;
    root.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.tool===PB.tool)); pbSave(); };
  const apply=(n,mode)=>{ const t=PB.tool, s=PB.s;
    if(t==='erase'){ s.c[n]=0; s.r[n]=false; s.x[n]=false; return; }
    if(t==='ring'){ s.r[n]=mode; return; }
    if(t==='x'){ s.x[n]=mode; return; }
    const bit=1<<(+t-1); s.c[n]=mode?(s.c[n]|bit):(s.c[n]&~bit); };
  const modeFor=n=>{ const t=PB.tool, s=PB.s; if(t==='erase') return true; if(t==='ring') return !s.r[n]; if(t==='x') return !s.x[n]; return !(s.c[n]&(1<<(+t-1))); };
  grid.addEventListener('pointerdown',e=>{ const b=e.target.closest('.pb-c'); if(!b) return; e.preventDefault(); const n=+b.dataset.n; PB.drag=modeFor(n); apply(n,PB.drag); paint(); });
  grid.addEventListener('pointermove',e=>{ if(PB.drag===null) return; const el=document.elementFromPoint(e.clientX,e.clientY), b=el&&el.closest('.pb-c'); if(!b) return; apply(+b.dataset.n,PB.drag); paint(); });
  const end=()=>{ PB.drag=null; }; window.addEventListener('pointerup',end); window.addEventListener('pointercancel',end);
  grid.addEventListener('keydown',e=>{ const b=e.target.closest('.pb-c'); if(!b||(e.key!=='Enter'&&e.key!==' ')) return; e.preventDefault(); const n=+b.dataset.n; apply(n,modeFor(n)); paint(); });
  grid.addEventListener('click',e=>{ if(e.detail===0){ const b=e.target.closest('.pb-c'); if(b){ const n=+b.dataset.n; apply(n,modeFor(n)); paint(); } } });
  root.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.tool){ PB.tool=b.dataset.tool; paint(); }
    if(b.dataset.pb==='reset'){ if(b.dataset.arm){ PB.s={c:Array(101).fill(0),r:Array(101).fill(false),x:Array(101).fill(false),step:0}; paint(); delete b.dataset.arm; b.textContent='Nullstill'; }
      else { b.dataset.arm='1'; b.textContent='Trykk igjen for å tømme'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arm; b.textContent='Nullstill'; } },3500); } }
    if(b.dataset.pb==='fs'){ const fake=()=>{ const on=root.classList.toggle('pb-fake'); b.textContent=on?'Avslutt fullskjerm':'Fullskjerm'; };
      if(root.classList.contains('pb-fake')) fake(); else if(document.fullscreenElement) document.exitFullscreen(); else { try{ const pr=root.requestFullscreen&&root.requestFullscreen(); if(pr&&pr.catch) pr.catch(fake); else if(!pr) fake(); }catch(err){ fake(); } } }
  });
  paint();
}
document.addEventListener('fullscreenchange',()=>{ const b=document.querySelector('[data-pb=fs]'); if(b) b.textContent=document.fullscreenElement?'Avslutt fullskjerm':'Fullskjerm'; });
document.addEventListener('keydown',e=>{ const root=document.getElementById('pb'); if(!root||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k=e.key.toLowerCase(), map={'1':'1','2':'2','3':'3','4':'4','r':'ring','x':'x','v':'erase'};
  if(map[k]){ root.querySelector(`[data-tool="${map[k]}"]`).click(); }
  else if(k==='f') root.querySelector('[data-pb=fs]').click();
  else if(k==='escape'&&root.classList.contains('pb-fake')) root.querySelector('[data-pb=fs]').click(); });
function route(){
  const r=decodeURIComponent(location.hash.slice(1));
  const ch=BOOK.chapters.find(c=>r===c.id||r.startsWith(c.id+'-'));
  let cur='';
  if(GAME){ GAME.destroy(); GAME=null; }
  if(ch&&gradeOf(ch)!==GRADE) setGrade(gradeOf(ch));
  if (r==='laerer'){ renderTeacher(); cur=r; }
  else if (r==='spill'){ renderGames(); cur=r; }
  else if (r==='aktiviteter'){ renderActivities(); cur=r; }
  else if (r==='primtavle'){ renderPrimBoard(); cur='aktiviteter'; }
  else if (ch && r===ch.id){ renderChapter(ch); cur=r; }
  else if (ch && TOPICS[r.slice(ch.id.length+1)]){ renderTopic(ch, r.slice(ch.id.length+1)); cur=r; }
  else renderHome();
  curRoute=cur; renderNav(cur); closeMenu(); window.scrollTo(0,0);
  if (location.hash) main.focus({preventScroll:true});
}
main.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if (b.dataset.jump){ const t=document.getElementById(b.dataset.jump); if(t) t.scrollIntoView({behavior:reduceMotion()?'auto':'smooth', block:'start'}); }
  if (b.id==='reset'){ if(b.dataset.arm){ ST={}; save(); route(); } else { b.dataset.arm='1'; b.textContent='Trykk igjen for å slette all fremgang'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arm; b.textContent='Nullstill fremgangen min'; } },4000); } }
});
const menuBtn=$('#menuBtn'), scrim=$('#scrim');
function openMenu(){ side.classList.add('open'); scrim.hidden=false; menuBtn.setAttribute('aria-expanded','true'); const a=side.querySelector('a'); if(a) a.focus(); }
function closeMenu(){ side.classList.remove('open'); scrim.hidden=true; menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.addEventListener('click', ()=> side.classList.contains('open')?closeMenu():openMenu());
scrim.addEventListener('click', closeMenu);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&side.classList.contains('open')){ closeMenu(); menuBtn.focus(); } });
try{ window.__mat8={TRAINERS,poly,parsePoly,polyEq,TOPICS,BOOK,F,P,fmt,powStr,pfac,MODELS}; }catch(e){}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-grade]'); if(!b) return; const g=+b.dataset.grade; if(g===GRADE) return; setGrade(g);
  const r=decodeURIComponent(location.hash.slice(1)); if(r==='laerer'||r==='spill'||r==='aktiviteter'||r==='primtavle'||r==='') route(); else location.hash=''; });
setGrade(GRADE);
window.addEventListener('hashchange', route);
route();
})();
