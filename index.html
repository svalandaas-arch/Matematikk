<title>Matematikk 8. trinn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a squared maths exercise book. Light = ruteark (blue grid paper), dark = tavle (chalkboard).
   Sticky chapter index on the left, one reading column. Every topic = Lær (step-through model) + Øv (generator). */
:root{
  --paper:#F5F7FB; --grid:rgba(48,92,168,.11); --surface:#FFFFFF; --ink:#141E36; --muted:#56617A;
  --line:#D2DAE8; --pen:#2343B0; --pen-soft:rgba(35,67,176,.08); --hl:rgba(255,211,59,.78);
  --note:#FFF6D8; --note-line:#E0C04F;
  --c1:rgba(35,67,176,.30); --c2:rgba(194,54,43,.28); --c3:rgba(27,118,70,.30); --c12:rgba(110,45,160,.55);
  --red:#C2362B; --red-soft:rgba(194,54,43,.08); --ok:#1B7646; --ok-soft:rgba(27,118,70,.10); --bad:#B5382C; --bad-soft:rgba(181,56,44,.08);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --mc:30px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15211E; --grid:rgba(214,236,224,.055); --surface:#1C2B27; --ink:#E6EEE9; --muted:#9DB1A7;
    --line:#2F433D; --pen:#93B5FF; --pen-soft:rgba(147,181,255,.11); --hl:rgba(242,205,74,.30);
    --note:rgba(242,205,74,.09); --note-line:rgba(242,205,74,.45);
    --c1:rgba(147,181,255,.38); --c2:rgba(255,139,123,.36); --c3:rgba(99,211,152,.36); --c12:rgba(205,150,255,.55);
    --red:#FF8B7B; --red-soft:rgba(255,139,123,.10); --ok:#63D398; --ok-soft:rgba(99,211,152,.12); --bad:#FF8070; --bad-soft:rgba(255,128,112,.11);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15211E; --grid:rgba(214,236,224,.055); --surface:#1C2B27; --ink:#E6EEE9; --muted:#9DB1A7;
  --line:#2F433D; --pen:#93B5FF; --pen-soft:rgba(147,181,255,.11); --hl:rgba(242,205,74,.30);
  --note:rgba(242,205,74,.09); --note-line:rgba(242,205,74,.45);
  --c1:rgba(147,181,255,.38); --c2:rgba(255,139,123,.36); --c3:rgba(99,211,152,.36); --c12:rgba(205,150,255,.55);
    --red:#FF8B7B; --red-soft:rgba(255,139,123,.10); --ok:#63D398; --ok-soft:rgba(99,211,152,.12); --bad:#FF8070; --bad-soft:rgba(255,128,112,.11);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--pen)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h1{font-weight:800;font-size:clamp(2.2rem,6vw,3.5rem);letter-spacing:-.025em}
h2{font-weight:800;font-size:clamp(1.5rem,3.4vw,2rem);letter-spacing:-.015em}
h3{font-weight:600;font-size:1.25rem}
p{margin:0}
code,.math{font-family:var(--f-mono);font-weight:500;font-size:.94em;white-space:nowrap}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%);padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hand{font-family:var(--f-hand);font-weight:700;color:var(--red);line-height:1.1}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .brand{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--ink);text-decoration:none}
.menu-btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.menu-btn svg{width:18px;height:18px}
.side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:40;background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease;
  padding-block:calc(env(safe-area-inset-top,0px) + 22px) 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,30,.42)}
.brand-big{display:block;font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.1;color:var(--ink);text-decoration:none;margin-bottom:22px}
.brand-big small{display:block;font-family:var(--f-mono);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:6px;font-size:.96rem;line-height:1.35}
.nav a:hover{background:var(--pen-soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav a[aria-current="page"] .tally{color:var(--surface);opacity:.8}
.nav .chap{font-weight:700;margin-top:10px}
.nav .grp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav .sub a{padding-left:20px}
.nav .soon{color:var(--muted);padding:6px 10px;font-size:.92rem}
.tally{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tally.done{color:var(--ok);font-weight:700}
@media (min-width:980px){
  .app{grid-template-columns:300px minmax(0,1fr)}
  .topbar,.scrim{display:none!important}
  .side{position:sticky;top:0;height:100vh;transform:none;transition:none;width:auto;z-index:auto}
}
.main{padding-block:44px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.crumb{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumb a{color:var(--muted)}
.lede{font-size:1.15rem;color:var(--muted);max-width:58ch}

/* ---------- buttons & fields ---------- */
.btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--surface);border:1.5px solid var(--ink);
  border-radius:6px;padding:9px 18px;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){background:var(--pen);border-color:var(--pen)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--pen-soft);color:var(--pen);border-color:var(--pen)}
.btn.small{padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.35;cursor:default}
.link-btn{font:inherit;font-size:.92rem;background:none;border:0;color:var(--pen);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.9rem;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:hover{border-color:var(--pen);color:var(--pen)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:3px}
.field label,.flabel{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num-in{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;width:6.5rem;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-align:center}
.num-in.sm{width:4.2rem}
.num-in:focus{border-color:var(--pen);outline:none}
select.num-in{width:4.2rem;cursor:pointer}

/* ---------- home & chapter ---------- */
.home-hero{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.home-hero h1{font-size:clamp(2.6rem,8vw,4.6rem)}
.chapters{display:grid;gap:16px}
.chap-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:start;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:22px 24px;text-decoration:none;color:var(--ink)}
.chap-card:hover{border-color:var(--pen);box-shadow:4px 4px 0 var(--pen)}
.chap-card .num{grid-row:span 3;font-family:var(--f-display);font-weight:800;font-size:4.2rem;line-height:.85;color:var(--pen)}
.chap-card h3{font-size:1.5rem;font-weight:800}
.chap-card .meta{color:var(--muted);font-size:.95rem}
.chap-card.soon{border-style:dashed;border-color:var(--line);background:transparent;color:var(--muted)}
.chap-card.soon .num{color:var(--line)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.steps-how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:s}
.steps-how li{counter-increment:s;display:flex;flex-direction:column;gap:6px}
.steps-how li::before{content:counter(s);font-family:var(--f-hand);font-weight:700;font-size:2.2rem;line-height:1;color:var(--red)}
.steps-how b{font-family:var(--f-display);font-size:1.1rem}
.steps-how span{color:var(--muted);font-size:.96rem}
.chap-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 24px;align-items:end}
.chap-hero .num{font-family:var(--f-display);font-weight:800;font-size:clamp(5rem,15vw,8.5rem);line-height:.78;color:var(--pen);grid-row:span 2}
.chap-hero .lede{grid-column:1/-1;margin-top:14px}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.goals h2{font-family:var(--f-hand);font-weight:700;font-size:1.9rem;color:var(--red);letter-spacing:0;margin-bottom:6px}
.goals ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.goals li{display:flex;gap:10px}
.goals li::before{content:"";flex:none;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;margin-top:5px}
.group{display:flex;flex-direction:column;gap:14px}
.group-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.group-head .eyebrow{color:var(--pen)}
.rows{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.rows li{border-bottom:1px solid var(--line)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:14px 4px;text-decoration:none;color:var(--ink)}
.rows a:hover{background:var(--pen-soft)}
.rows .t{font-family:var(--f-display);font-weight:600;font-size:1.18rem}
.rows .d{grid-column:1;color:var(--muted);font-size:.95rem}
.rows .p{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:84px}
.rows .p .bar{width:84px;margin:0}
footer.foot{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

/* ---------- topic ---------- */
.topic-head{display:flex;flex-direction:column;gap:14px}
.jump{display:flex;gap:10px;flex-wrap:wrap}
.part{display:flex;flex-direction:column;gap:22px}
.part-title{display:flex;align-items:center;gap:14px;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.part-title .tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--surface);padding:3px 8px;border-radius:4px}
.learn{display:flex;flex-direction:column;gap:20px}
.learn > p,.learn > ul{max-width:66ch}
.learn ul,.learn ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.box .lab{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pen);font-weight:700}
.rule{background:var(--pen-soft);border:1.5px dashed var(--pen);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.rule .lab{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1;color:var(--pen)}
.trap{border:1.5px solid var(--red);border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;background:var(--red-soft)}
.trap .lab{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1;color:var(--red)}
.scroll{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.t th{font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--muted);background:var(--pen-soft)}
table.t td{font-family:var(--f-mono)}
.order{list-style:none;padding:0!important;display:grid;gap:8px!important;counter-reset:o}
.order li{counter-increment:o;display:flex;gap:12px;align-items:baseline}
.order li::before{content:counter(o);flex:none;font-family:var(--f-mono);font-weight:700;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--pen);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.terms{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.term{border:2px solid var(--pen);background:var(--pen-soft);color:var(--ink);border-radius:8px;padding:4px 12px}
.term.done{border-color:var(--ok);background:var(--ok-soft)}
.opb{color:var(--red);font-size:1.3rem;padding:0 2px}

/* ---------- step-through model ---------- */
.model{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.model-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.model-head h3{font-size:1.15rem}
.model-head .tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pen);font-weight:700}
.model-ctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.model-ctl .op{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;padding-bottom:6px;color:var(--muted)}
.model-ctl .sp{flex:1}
.model-err{color:var(--bad);font-weight:700;font-size:.9rem;padding:0 18px}
.model-err:empty{display:none}
.stage{padding:20px 18px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--mc) var(--mc);display:flex;flex-direction:column;align-items:center;gap:16px;overflow-x:auto}
.stage.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start;gap:20px}
.stage .pane{display:flex;flex-direction:column;gap:10px;min-width:0;align-items:center}
.stage .pane > .flabel{align-self:flex-start}
.caption{margin:0 18px 0;background:var(--note);border:1.5px dashed var(--note-line);border-radius:8px;padding:12px 16px;font-size:1rem;min-height:3.2em}
.caption.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.caption b{font-weight:700}
.stepbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 18px}
.stepbar .ind{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stepbar .sp{flex:1}
.legend{font-size:.85rem;color:var(--muted);padding:0 18px 16px}

/* column add/sub */
.cols{display:grid;justify-content:center;font-family:var(--f-mono)}
.cc{display:flex;flex-direction:column;align-items:center;width:var(--mc)}
.cc > span{height:var(--mc);display:flex;align-items:center;justify-content:center;width:100%;position:relative}
.cc .cr{height:20px;font-family:var(--f-hand);font-weight:700;font-size:1.15rem;color:var(--red);align-items:flex-end}
.cc .dg{font-size:1.3rem;font-weight:700}
.cc .ln{height:2px;background:var(--ink)}
.cc .rs{font-size:1.3rem;font-weight:700;color:var(--pen)}
.cc .pl{height:16px;font-size:.62rem;color:var(--muted);letter-spacing:.04em}
.cc.on .dg,.cc.on .rs{background:var(--hl);border-radius:4px}
.cc.on .pl{color:var(--red);font-weight:700}
.cc .opc{color:var(--red);font-size:1.3rem;font-weight:700}
.struck{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)!important;font-size:.95rem!important;position:absolute;top:-4px;left:3px}
.newv{position:absolute;right:-2px;bottom:-2px;font-family:var(--f-hand);font-size:1.15rem;color:var(--red);font-weight:700}

/* multiplication */
.alg{display:inline-flex;flex-direction:column;font-family:var(--f-mono);font-weight:700;font-size:1.2rem}
.alg .row{display:flex;justify-content:flex-end}
.alg .cell{width:var(--mc);height:var(--mc);display:inline-flex;align-items:center;justify-content:center}
.alg .cell.act{background:var(--hl);border-radius:4px}
.alg .carry .cell{height:18px;font-family:var(--f-hand);font-size:1.05rem;color:var(--red);align-items:flex-end}
.alg .top{border-bottom:2px solid var(--ink)}
.alg .sum{border-top:2px solid var(--ink);margin-top:2px}
.alg .plus{color:var(--red)}
.alg .res{color:var(--pen)}
.arrow-svg path.a{fill:none;stroke:var(--red);stroke-width:2}
.arrow-svg path.h{fill:var(--red)}
.agrid{display:grid;gap:4px;width:100%;max-width:360px}
.alabel{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.acell{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--pen);background:var(--pen-soft);color:var(--pen);font-family:var(--f-mono);font-weight:700;border-radius:4px;transition:opacity .2s}
.acell.dim,.alabel.dim{opacity:.3}
.asum{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);word-break:break-word;text-align:center}

/* division */
.scale-note{font-family:var(--f-mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;line-height:1.7}
.scale-note .hand{font-size:1.2rem}
.dgrid{display:grid;grid-auto-rows:var(--mc);font-family:var(--f-mono);font-weight:700;font-size:1.2rem}
.dcell{display:flex;align-items:center;justify-content:center;position:relative}
.dcell.sym{color:var(--muted)}
.dcell.q{color:var(--pen)}
.dcell.uline{border-bottom:5px double var(--pen)}
.dcell.line{box-shadow:inset 0 -2px 0 var(--ink)}
.dcell.cur{background:var(--hl);border-radius:4px}
.dcell.fin{color:var(--red)}
.dcell.arr{color:var(--red);font-size:1rem}
.dcell .pm{position:absolute;top:-4px;right:-4px;font-size:.7rem;color:var(--red)}

/* number line */

<script>
(function(){
"use strict";

/* ===================== small helpers ===================== */
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const rndNZ = (a,b) => { let n=0; while(n===0) n=rnd(a,b); return n; };
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const fmt = n => String(n).replace('-', '−').replace('.', ',');
const par = n => n < 0 ? `(${fmt(n)})` : fmt(n);
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻'};
const sup = s => String(s).split('').map(c => SUP[c] || c).join('');
const P = (b,e) => `${b}<sup>${e}</sup>`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let uid = 0;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===================== number line (SVG) ===================== */
function numLine(lo, hi, items, aria){
  const W=580, H=128, y=96, pad=22, span=hi-lo, sx=(W-2*pad)/span, x=v=>pad+(v-lo)*sx;
  let tick = span<=30 ? 1 : span<=60 ? 5 : span<=150 ? 10 : 25;
  let lab = span<=16 ? 1 : span<=30 ? 2 : tick;
  const id = 'nl'+(++uid);
  let s = `<svg class="nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria||'Tallinje')}"><defs>
    <marker id="${id}p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd p" d="M0 0L10 5L0 10z"/></marker>
    <marker id="${id}n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd n" d="M0 0L10 5L0 10z"/></marker></defs>`;
  s += `<line class="ax" x1="${pad-10}" y1="${y}" x2="${W-pad+10}" y2="${y}"/>`;
  for(let v=Math.ceil(lo/tick)*tick; v<=hi; v+=tick){

function divMicro(steps){ const m=[]; steps.forEach((st,si)=>{ m.push({ph:'bring',si}); m.push({ph:'divide',si}); if(st.visible){ m.push({ph:'multiply',si}); m.push({ph:'subtract',si}); } }); return m; }

function mountDiv(el){

      let cs=-1, cp=null; if(cm>=0){ cs=micro[cm].si; cp=micro[cm].ph; }

      for(let p=0;p<R.used.length;p++){ const gc=R.posToCol[p]+1; const show = p<R.realLen || rankOf(R.steps,cs,cp,R.colToStep[p])>=1; if(show) add(gc,1,R.used[p],''); }
      const realHasDec = R.dividend.intLen < R.realLen;
      if (R.dividend.intLen < R.used.length){ let show=realHasDec; if(!show){ const os=R.colToStep[R.realLen]; show = os!==undefined && rankOf(R.steps,cs,cp,os)>=1; } if(show) add(R.posToCol[R.dividend.intLen],1,',',''); }
      const li=R.steps.length-1, lr=rankOf(R.steps,cs,cp,li), done = R.steps.length>0 && li===cs && lr>=(R.steps[li].visible?4:2);

      if (done && R.truncated) add(R.qCol[R.q.length-1]+2,1,'…','q');

        const cur=si===cs;

        if (rk>=3) for(let p=st.subStart;p<=st.colEnd;p++) add(R.posToCol[p]+1,row+1,st.ss[p-st.subStart],'line');
        row+=2;
      }
      if (done){ const last=R.steps[li]; if(last.visible){ const rs=String(last.remAfter), e=last.colEnd, s0=e-(rs.length-1); for(let p=s0;p<=e;p++) add(R.posToCol[p]+1,row,rs[p-s0],'fin'); } }
      if (cs>=0){ const st=R.steps[cs]; if(cp==='bring'||cp==='divide') add(R.posToCol[st.col]+1,2,'↓','arr'); if((cp==='divide'||cp==='multiply'||cp==='subtract') && st.qi!==null && st.qi>=firstReal) add(R.qCol[st.qi]+1,2,'↑','arr'); }

    }};

  el.querySelector('[data-act=rand]').onclick=()=>{ const dv = Math.random()<.6 ? rnd(2,9) : rnd(11,25); const qq = rnd(12,180); ia.value = dv*qq + (Math.random()<.25?rnd(1,dv-1):0); ib.value=dv; build(); };

}

    err.textContent=''; if(Math.abs(a)>lim||Math.abs(b)>lim){ err.textContent=`Bruk tall fra −${lim} til ${lim}, så alt får plass på tallinja.`; a=Math.max(-lim,Math.min(lim,a)); b=Math.max(-lim,Math.min(lim,b)); }

    if (i===0){ h=big(); c=`Vi skal regne ut potensen <b>${b}${sup(e)}</b> («${b} opphøyd i ${e}»).`; }
    else if (i===1){ h=big(1,1)+`<div class="legend-row"><span><span class="badge b">${b}</span><b>Grunntall:</b> tallet som skal ganges</span><span><span class="badge e">${e}</span><b>Eksponent:</b> hvor mange ganger det står</span></div>`; c=`Grunntallet er <b>${b}</b> og eksponenten er <b>${e}</b>.`; }
    else if (e===0){ h=big()+`<div class="expand"><span class="chip grp">1</span></div>`; c=`Eksponenten er 0. Alle tall (unntatt 0) opphøyd i 0 er <b>1</b>. Det ser du fordi ${b}${sup(1)} : ${b}${sup(1)} = ${b}${sup(0)}, og et tall delt på seg selv er 1.`; }
    else if (e===1){ h=big()+`<div class="expand"><span class="chip">${b}</span></div>`; c=`Eksponenten er 1, så tallet står bare én gang. ${b}${sup(1)} = <b>${b}</b>.`; }
    else if (i===2){ h=big()+`<div class="expand">${Array(e).fill(`<span class="chip">${b}</span>`).join(' · ')}</div>`; c=`Eksponenten sier at ${b} skal ganges med seg selv, slik at det står <b>${e} ${b}-tall</b>: ${Array(e).fill(b).join(' · ')}.`; }
    else if (i<n-1){ const k=i-1; const part=b**k; let row=`<span class="chip grp">${part}</span>`; for(let j=k;j<e;j++) row+=` · <span class="chip">${b}</span>`;
      h=big()+`<div class="expand">${row}</div>`; c=`${b**(k-1)} · ${b} = <b>${part}</b>. ${k<e?`Nå gjenstår ${e-k} ${e-k===1?'faktor':'faktorer'}.`:''}`; }
    else { h=big()+`<div class="eq">${b}${sup(e)} = ${Array(e).fill(b).join(' · ')} = <span class="hl">${v}</span></div>`; c=`<b>Svar:</b> ${b}${sup(e)} = ${v}.`; }
    if (i===n-1 && (e<=1)) c += '';
    stage.innerHTML=h; capt.innerHTML=c; capt.classList.toggle('done', i===n-1);
  }};
  const ctl=stepper(el, ()=>M, {min:0});
  [ib,ie].forEach(x=>x.addEventListener('change', ()=>ctl.reset()));
  ctl.reset();
  return { load(v){ ib.value=v.b; ie.value=v.e; ctl.reset(); } };
}

/* ===================== MODEL: potensregler ===================== */
function mountPowRules(el){
  el.innerHTML = modelShell('Steg for steg: ganging og deling av potenser','Trinnvis modell',
    `<div class="field"><label for="pr-a">Grunntall</label><input class="num-in sm" id="pr-a" type="number" min="2" max="9" value="2"></div>
     <div class="field"><label for="pr-m">m</label><input class="num-in sm" id="pr-m" type="number" min="1" max="6" value="2"></div>
     <div class="field"><label for="pr-n">n</label><input class="num-in sm" id="pr-n" type="number" min="1" max="6" value="4"></div>
     <div class="field"><label for="pr-k">k</label><input class="num-in sm" id="pr-k" type="number" min="1" max="6" value="3"></div>
     <span class="flabel" style="padding-bottom:8px">(a<sup>m</sup> · a<sup>n</sup>) : a<sup>k</sup></span>`);
  const I=id=>el.querySelector(id), err=el.querySelector('.model-err'), stage=el.querySelector('.stage'), capt=el.querySelector('.caption');
  function vals(){ err.textContent=''; const c=(x,lo,hi,d)=>{ const v=parseInt(x.value,10); return isNaN(v)?d:Math.max(lo,Math.min(hi,v)); };
    const a=c(I('#pr-a'),2,9,2), m=c(I('#pr-m'),1,6,2), n=c(I('#pr-n'),1,6,4); let k=c(I('#pr-k'),1,6,3);
    if (k>m+n){ err.textContent='k kan ikke være større enn m + n i denne modellen.'; k=m+n; } return {a,m,n,k}; }
  const chips=(a,cnt,cls)=>Array(cnt).fill(`<span class="chip ${cls||''}">${a}</span>`).join(' · ');
  const M={ count:6, render(i){
    const {a,m,n,k}=vals(), s=m+n, r=s-k, task=`(${P(a,m)} · ${P(a,n)}) : ${P(a,k)}`;
    let h='', c='';
    if (i===0){ h=`<div class="eq">${task}</div>`; c='Vi skal forenkle et uttrykk med både ganging og deling. Alle potensene har <b>samme grunntall</b>.'; }
    else if (i===1){ h=`<div class="eq">${P(a,m)} · ${P(a,n)}</div><div class="expand">(${chips(a,m)}) · (${chips(a,n,'alt')})</div>`; c=`Vi starter med gangingen. Skriver vi ut potensene, ser vi ${m} + ${n} = <b>${s}</b> faktorer med ${a}.`; }
    else if (i===2){ h=`<div class="eq">${P(a,m)} · ${P(a,n)} = ${P(a,`${m}+${n}`)} = ${P(a,s)}</div>`; c=`<b>Regel:</b> Når vi ganger potenser med samme grunntall, beholder vi grunntallet og <b>legger sammen eksponentene</b>.`; }
    else if (i===3){ h=`<div class="eq">${P(a,s)} : ${P(a,k)}</div><div class="expand">${Array(s).fill(0).map((_,j)=>`<span class="chip${j<k?' x':''}">${a}</span>`).join(' · ')}</div><div class="expand" style="font-size:1rem">delt på ${chips(a,k,'alt x')}</div>`; c=`Deling er som en brøk: ${k} faktorer over og ${k} under streken kan strykes mot hverandre. Da står ${s} − ${k} = <b>${r}</b> faktorer igjen.`; }
    else if (i===4){ h=`<div class="eq">${P(a,s)} : ${P(a,k)} = ${P(a,`${s}−${k}`)} = ${P(a,r)}</div>`; c=`<b>Regel:</b> Når vi deler potenser med samme grunntall, beholder vi grunntallet og <b>trekker fra eksponentene</b>.`; }
    else { h=`<div class="eq">${task} = ${P(a,r)} = <span class="hl">${a**r}</span></div>`; c = r===0 ? `Forenklet blir det ${a}${sup(0)}, og alt (unntatt 0) opphøyd i 0 er <b>1</b>.` : `Forenklet potens er <b>${a}${sup(r)}</b>. Skrevet som vanlig tall blir det <b>${a**r}</b>.`; }
    stage.innerHTML=h; capt.innerHTML=c; capt.classList.toggle('done', i===5);
  }};
  const ctl=stepper(el, ()=>M, {min:0});
  el.querySelectorAll('input').forEach(x=>x.addEventListener('change', ()=>ctl.reset()));
  ctl.reset();
  return {};
}

/* text problems with several terms: scenario builders */
const scnPay=(p,item,pMin,pMax,aMin,aMax)=>{ const a=rnd(aMin,aMax), pr=rnd(pMin,pMax), m=a*pr; const notes=[50,100,200,500,1000].filter(n=>n>m); let s=notes[0]||1000; if(notes.length>1&&Math.random()<.35) s=notes[1];
  return {text:`${p} kjøper ${a} ${item} til ${pr} kr per stykk og betaler med en ${s}-kroneseddel. Hvor mye får ${p} igjen?`, expr:`${s} − ${a} · ${pr}`, ans:s-m, u:'kr', steps:[`Totalpris: <b>${a} · ${pr} = ${m} kr</b>`,`Igjen: <b>${s} − ${m} = ${s-m} kr</b>`]}; };
const scnBox=(p,cont,item,aMin,aMax,bMin,bMax,cMin,cMax)=>{ const a=rnd(aMin,aMax), b=rnd(bMin,bMax), c=rnd(cMin,cMax), m=a*b;
  return {text:`${p} har ${a} ${cont} med ${b} ${item} i hver. I tillegg har ${p} ${c} løse ${item}. Hvor mange ${item} er det til sammen?`, expr:`${a} · ${b} + ${c}`, ans:m+c, steps:[`I ${cont}: <b>${a} · ${b} = ${m}</b>`,`Med de løse: <b>${m} + ${c} = ${m+c}</b>`]}; };
const scnShare=(p,item,gMin,gMax,perMin,perMax,eMin,eMax)=>{ const g=rnd(gMin,gMax), per=rnd(perMin,perMax), tot=g*per, ex=rnd(eMin,eMax);
  return {text:`${p} deler ${tot} ${item} likt på ${g} personer. Etterpå får hver person ${ex} ${item} til. Hvor mange ${item} har hver person nå?`, expr:`${tot} : ${g} + ${ex}`, ans:per+ex, steps:[`Etter delingen: <b>${tot} : ${g} = ${per}</b>`,`Med det ekstra: <b>${per} + ${ex} = ${per+ex}</b>`]}; };
const scnCombo=(p,i1,i2,unit,aMin,aMax,bMin,bMax,cMin,cMax)=>{ const a=rnd(aMin,aMax), b=rnd(bMin,bMax), c=rnd(cMin,cMax), s=a+b;
  return {text:`${p} lager ${c} sett. Hvert sett har ${a} ${i1} og ${b} ${i2}. Hvor mange ${unit} er det til sammen?`, expr:`${c} · (${a} + ${b})`, ans:c*s, steps:[`I hvert sett: <b>${a} + ${b} = ${s}</b>`,`I alle ${c} settene: <b>${c} · ${s} = ${c*s}</b>`]}; };
const scnSubDiv=(p,spMin,spMax,gMin,gMax)=>{ const g=rnd(gMin,gMax), per=rnd(10,40), rem=g*per, sp=rnd(spMin,spMax), st=rem+sp;
  return {text:`${p} hadde ${st} kr, brukte ${sp} kr og delte resten likt på ${g} venner. Hvor mye fikk hver venn?`, expr:`(${st} − ${sp}) : ${g}`, ans:per, u:'kr', steps:[`Igjen etter kjøpet: <b>${st} − ${sp} = ${rem} kr</b>`,`Delt på ${g}: <b>${rem} : ${g} = ${per} kr</b>`]}; };
const scnTwo=(p,i1,p1Min,p1Max,aMin,aMax,i2,p2Min,p2Max,bMin,bMax)=>{ const a=rnd(aMin,aMax), p1=rnd(p1Min,p1Max), m1=a*p1, b=rnd(bMin,bMax), p2=rnd(p2Min,p2Max), m2=b*p2;
  return {text:`${p} kjøper ${a} ${i1} til ${p1} kr per stykk og ${b} ${i2} til ${p2} kr per stykk. Hva koster alt til sammen?`, expr:`${a} · ${p1} + ${b} · ${p2}`, ans:m1+m2, u:'kr', steps:[`Kjøp 1: <b>${a} · ${p1} = ${m1} kr</b>`,`Kjøp 2: <b>${b} · ${p2} = ${m2} kr</b>`,`Til sammen: <b>${m1} + ${m2} = ${m1+m2} kr</b>`]}; };
const scnBatch=(p,item,bMin,bMax,perMin,perMax,pkMin,pkMax)=>{ const b=rnd(bMin,bMax), per=rnd(perMin,perMax), tot=b*per; let pk, pp, rem, sold, tries=0;
  do { pk=rnd(pkMin,pkMax); pp=rnd(4,10); rem=pk*pp; sold=tot-rem; tries++; } while(sold<=0 && tries<40);
  if (sold<=0){ pk=2; pp=Math.floor(tot/4); rem=pk*pp; sold=tot-rem; }
  return {text:`${p} laget ${b} brett med ${per} ${item} på hvert. ${sold} ${item} ble solgt, og resten ble pakket likt i ${pk} esker. Hvor mange ${item} kom i hver eske?`, expr:`(${b} · ${per} − ${sold}) : ${pk}`, ans:pp, steps:[`Laget til sammen: <b>${b} · ${per} = ${tot}</b>`,`Igjen etter salget: <b>${tot} − ${sold} = ${rem}</b>`,`I hver eske: <b>${rem} : ${pk} = ${pp}</b>`]}; };
const scnBudget=(p,i1,p1,a,i2,p2,b)=>{ const m1=a*p1, m2=b*p2, tc=m1+m2, bud=Math.ceil((tc+rnd(50,200))/10)*10;
  return {text:`${p} har et budsjett på ${bud} kr og kjøper ${a} ${i1} til ${p1} kr per stykk og ${b} ${i2} til ${p2} kr per stykk. Hvor mye er igjen av budsjettet?`, expr:`${bud} − (${a} · ${p1} + ${b} · ${p2})`, ans:bud-tc, u:'kr', steps:[`Kjøp 1: <b>${a} · ${p1} = ${m1} kr</b>`,`Kjøp 2: <b>${b} · ${p2} = ${m2} kr</b>`,`Brukt: <b>${m1} + ${m2} = ${tc} kr</b>`,`Igjen: <b>${bud} − ${tc} = ${bud-tc} kr</b>`]}; };

function divSteps(n,d){
  const R=buildDiv(String(n),String(d)), out=[];
  R.steps.forEach(st=>{ if(st.visible) out.push(`${st.ws} : ${d} = <b>${st.qd}</b>, fordi ${d} · ${st.qd} = ${st.ss}. Rest: ${st.remAfter}.`);
    else if(st.hasQ) out.push(`${st.ws} er mindre enn ${d}. Vi skriver <b>0</b> og henter ned neste siffer.`); });
  return out;
}

function parsePoly(s){
  s=String(s).toLowerCase().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>SUPR[c]).join('')).replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*]/g,'').replace(/,/g,'.');

function mountPrim(el){

function evalTerms(m, vals){ const parts=[]; ['x2','x','y','c'].forEach(k=>{ if(m[k]) parts.push({k,c:m[k]}); });
  const sg=(i,c)=> i===0 ? (c<0?'−':'') : (c<0?' − ':' + ');
  const sub=parts.map((p,i)=>{ const ac=Math.abs(p.c); if(p.k==='c') return sg(i,p.c)+ac; const v=vals[p.k[0]], vv=`${par(v)}${p.k==='x2'?'²':''}`; return sg(i,p.c)+(ac===1?vv:`${ac} · ${vv}`); }).join('');
  const hasPow=parts.some(p=>p.k==='x2');
  const pw=hasPow ? parts.map((p,i)=>{ const ac=Math.abs(p.c); if(p.k==='c') return sg(i,p.c)+ac; if(p.k==='x2'){ const v2=vals.x**2; return sg(i,p.c)+(ac===1?v2:`${ac} · ${v2}`); } const v=vals[p.k[0]]; return sg(i,p.c)+(ac===1?par(v):`${ac} · ${par(v)}`); }).join('') : null;
  const nums=parts.map(p=>p.k==='c'?p.c:p.c*(p.k==='x2'?vals.x**2:vals[p.k[0]]));
  const numStr=nums.map((n,i)=>i===0?fmt(n):(n<0?' − ':' + ')+Math.abs(n)).join('');
  return {sub, pw, numStr, total:nums.reduce((s,n)=>s+n,0)}; }

/* ===================== progress (this browser only) ===================== */
const KEY='mat8-fremgang-v2', GOAL=10;
let ST={}; try{ ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ ST={}; }
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} };
const tStat = id => ST[id] || (ST[id]={c:0,t:0,best:0});
function topicStat(tid){ const tr=TOPICS[tid].trainers; let n=0; tr.forEach(x=>n+=Math.min(GOAL,(ST[x.id]||{}).c||0)); return {n, t:tr.length*GOAL}; }
function chapterStat(ch){ let n=0,t=0; ch.groups.forEach(g=>g.topics.forEach(tid=>{ const s=topicStat(tid); n+=s.n; t+=s.t; })); return {n,t}; }
const pct = s => s.t ? Math.round(100*s.n/s.t) : 0;

/* ===================== trainer UI ===================== */
function norm(s){ return String(s).trim().toLowerCase().replace(/[−–—]/g,'-').replace(/[a-zæøå°%²]+/gi,'').replace(/\s+/g,'').replace(/,/g,'.').replace(/\.+$/,''); }
function numOk(input, ans){ const s=norm(input); if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return Math.abs(parseFloat(s)-ans)<1e-9; }
function mountTrainer(el, id, onModel){
  const C=TRAINERS[id]; const st={L:1, f:{}, cur:null, answered:false, streak:0};
  (C.filters||[]).forEach(f=>st.f[f.k]=f.def);
  const opt = (k,label,opts,cur) => `<div class="optrow"><span class="flabel">${label}</span><div class="seg" data-k="${k}">${opts.map(([v,t])=>`<button data-v="${v}" aria-pressed="${String(v)===String(cur)}">${t}</button>`).join('')}</div></div>`;
  el.innerHTML = `<div class="tr-head"><h3>${C.title}</h3><div class="score"><span>Riktige: <b data-sc="c">0</b> av <b data-sc="t">0</b></span><span>På rad: <b data-sc="s">0</b></span></div></div>
    ${(C.levels||C.filters)?`<div class="tr-opts">${C.levels?opt('L','Nivå',C.levels.map((t,i)=>[i+1,t]),1):''}${(C.filters||[]).map(f=>opt(f.k,f.label,f.opts,f.def)).join('')}</div>`:''}
    <div class="tr-body">${C.intro?`<p class="tally" style="text-align:center">${C.intro}</p>`:''}
      <p class="eyebrow" data-lab style="text-align:center"></p>
      <div class="tr-q" data-q aria-live="polite"></div>
      <form class="tr-form" novalidate data-form></form>
      <p class="fb" data-fb aria-live="polite"></p>
      <div class="tr-actions" data-acts hidden><button class="btn ghost small" type="button" data-a="sol">Vis løsning</button><button class="btn ghost small" type="button" data-a="model" hidden>Se den i modellen ↑</button><button class="btn small" type="button" data-a="next">Neste oppgave →</button></div>
      <div class="sol" data-sol hidden></div>
    </div>`;
  const q=el.querySelector('[data-q]'), form=el.querySelector('[data-form]'), fb=el.querySelector('[data-fb]'), acts=el.querySelector('[data-acts]'), sol=el.querySelector('[data-sol]'), lab=el.querySelector('[data-lab]');
  const fid='tr-'+id;
  const ansText = p => p.ansHTML ? p.ansHTML : p.pa ? P(p.pa.b,p.pa.e) : p.fr ? F(p.fr.n,p.fr.d) : p.ex ? (p.pre?p.pre+' ':'')+poly(p.ex) : p.fac ? `${p.fac} = ${powStr(pfac(p.fac))}` : p.multi ? p.multi.map(m=>`${m.label} = ${fmt(m.a)}`).join(', ') : p.mc ? p.mc.opts[p.mc.a] : (p.pre?p.pre+' ':'')+fmt(p.a)+(p.u?' '+p.u:'');
  function score(){ const s=tStat(id); el.querySelector('[data-sc=c]').textContent=s.c; el.querySelector('[data-sc=t]').textContent=s.t; el.querySelector('[data-sc=s]').textContent=st.streak; }
  function next(focus){
    const p=C.gen(st.L, st.f); st.cur=p; st.answered=false;
    lab.textContent=p.label||''; lab.hidden=!p.label;
    q.className='tr-q'+(p.expr?' expr':''); q.innerHTML = p.expr ? `${p.q} = ?` : p.q;
    const sub=`<button class="btn" type="submit">Sjekk</button>`, pre=p.pre?`<span class="pre">${p.pre}</span>`:'';
    if (p.mc) form.innerHTML=`<div class="mc">${p.mc.opts.map((o,i)=>`<button type="button" class="mcb" data-mc="${i}">${o}</button>`).join('')}</div>`;
    else if (p.pa) form.innerHTML=`<span class="powin"><input class="ans b" id="${fid}-b" autocomplete="off" inputmode="numeric" aria-label="Grunntall" placeholder="grunntall"><input class="ans e" id="${fid}-e" autocomplete="off" inputmode="numeric" aria-label="Eksponent" placeholder="eksp."></span>${sub}`;
    else if (p.fr) form.innerHTML=`<span class="fin"><input class="ans" id="${fid}-t" autocomplete="off" inputmode="text" aria-label="Teller"><span class="fl"></span><input class="ans" id="${fid}-n" autocomplete="off" inputmode="numeric" aria-label="Nevner"></span>${sub}`;
    else if (p.multi) form.innerHTML=p.multi.map((m,i)=>`<label class="ml">${m.label} =<input class="ans sm" id="${fid}-${i}" autocomplete="off" inputmode="text"></label>`).join('')+sub;
    else if (p.ex||p.fac) form.innerHTML=`${pre}<input class="ans wide" id="${fid}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="Svar" placeholder="${p.ph||(p.fac?'f.eks. 2 · 2 · 3':'f.eks. 3x + 2')}">${sub}`;
    else form.innerHTML=`${pre}<input class="ans" id="${fid}" autocomplete="off" inputmode="text" aria-label="Svar" placeholder="Svar">${p.u?`<span class="unit">${p.u}</span>`:''}${sub}`;
    fb.textContent=''; fb.className='fb'; acts.hidden=true; sol.hidden=true;
    sol.innerHTML=`<span class="hand">Føring</span><ol>${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${p.extra||''}<p class="ansline">Svar: <span>${ansText(p)}</span></p>`;
    el.querySelector('[data-a=model]').hidden=!(p.model&&onModel);
    el.querySelector('[data-a=sol]').textContent='Vis løsning';
    if (focus){ const i=form.querySelector('input,.mcb'); if(i) i.focus({preventScroll:true}); }
  }
  function check(p, ins, mcI){
    if (p.mc) return {ok: mcI===p.mc.a};
    if (p.pa){ const b=parseInt(norm(ins[0].value),10), x=parseInt(norm(ins[1].value),10); if(isNaN(b)||isNaN(x)) return {ok:null, msg:'Fyll inn både grunntall og eksponent.'}; return {ok: b===p.pa.b && x===p.pa.e}; }
    if (p.fr){ const tn=norm(ins[0].value), dn=norm(ins[1].value); if(!/^-?\d+$/.test(tn)||(dn&&!/^-?\d+$/.test(dn))) return {ok:null, msg:'Skriv hele tall i teller og nevner.'};
      const t=parseInt(tn,10), d=dn?parseInt(dn,10):1; if(d===0) return {ok:null, msg:'Nevneren kan ikke være 0.'};
      const same = t*p.fr.d === p.fr.n*d; if(!same) return {ok:false};
      if(p.fr.simp && (gcd(t,d)!==1 || d<0) && !(t===0)) return {ok:false, msg:'Riktig verdi, men brøken kan forkortes mer.'}; return {ok:true}; }
    if (p.multi){ let any=false; const r=p.multi.map((m,i)=>{ const v=numOk(ins[i].value, m.a); if(v===null) any=true; return v; }); if(any) return {ok:null, msg:'Fyll inn alle feltene med tall.'}; return {ok:r.every(Boolean), each:r}; }
    if (p.ex){ const r=parsePoly(ins[0].value); if(!r) return {ok:null, msg:'Skriv et uttrykk, for eksempel 3x + 2.'}; const eq=polyEq(r.m,p.ex); if(eq&&r.dup) return {ok:false, msg:'Riktig verdi, men trekk sammen leddene helt.'}; return {ok:eq}; }
    if (p.fac){ const f=parseFac(ins[0].value); if(!f) return {ok:null, msg:'Skriv faktorene med gangetegn, for eksempel 2 · 2 · 3.'}; const prod=f.reduce((s,v)=>s*v,1);
      if(prod!==p.fac) return {ok:false}; if(!f.every(isPrime)) return {ok:false, msg:'Produktet stemmer, men alle faktorene må være primtall.'}; return {ok:true}; }
    const v=numOk(ins[0].value, p.a); if(v===null) return {ok:null, msg:'Skriv inn et tall.'}; return {ok:v};
  }
  function submit(mcI){
    if (st.answered){ next(true); return; }
    const p=st.cur, ins=[...form.querySelectorAll('input')], res=check(p, ins, mcI);
    if (res.ok===null){ fb.className='fb bad'; fb.textContent=res.msg; return; }
    st.answered=true; const s=tStat(id); s.t++;
    if (p.mc){ form.querySelectorAll('.mcb').forEach((b,i)=>{ b.disabled=true; if(i===p.mc.a) b.classList.add('ok'); else if(i===mcI) b.classList.add('bad'); }); }
    else ins.forEach((i,k)=>{ const ok = res.each ? res.each[k] : res.ok; i.classList.add(ok?'ok':'bad'); i.readOnly=true; });
    if (res.ok){ s.c++; st.streak++; s.best=Math.max(s.best,st.streak); fb.className='fb ok'; fb.textContent=pick(['Riktig!','Helt riktig!','Bra jobba!','Stemmer!'])+(st.streak>=3?` ${st.streak} på rad.`:''); }
    else { st.streak=0; fb.className='fb bad'; fb.innerHTML=`${res.msg?res.msg+' ':'Ikke helt. '}Riktig svar er ${ansText(p)}. Se føringen under.`; sol.hidden=false; el.querySelector('[data-a=sol]').textContent='Skjul løsning'; }
    save(); score(); acts.hidden=false; el.querySelector('[data-a=next]').focus({preventScroll:true}); refreshNav();
  }
  form.addEventListener('submit', e=>{ e.preventDefault(); submit(); });
  el.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    if (b.dataset.mc!==undefined){ if(!st.answered) submit(+b.dataset.mc); return; }
    const seg=b.closest('.seg[data-k]');
    if (seg){ const k=seg.dataset.k; seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); if(k==='L') st.L=+b.dataset.v; else st.f[k]=b.dataset.v; next(false); return; }
    if (b.dataset.a==='next') next(true);
    if (b.dataset.a==='sol'){ sol.hidden=!sol.hidden; b.textContent=sol.hidden?'Vis løsning':'Skjul løsning'; }
    if (b.dataset.a==='model' && st.cur.model && onModel) onModel(st.cur.model);
  });
  score(); next(false);
}

 divisjon:{ title:'Divisjon', short:'Divisjon med oppstilling, rest og desimaler.',
   learn:`<p>I <code>936 : 6 = 156</code> kalles 936 <b>dividend</b>, 6 kalles <b>divisor</b> og 156 kalles <b>kvotient</b>. Hver runde i oppstillingen har fire trinn: <b>hent ned</b>, <b>del</b>, <b>gang</b> og <b>trekk fra</b>.</p>
     <div class="model" data-model="div"></div>

 'flere-ledd':{ title:'Regning med flere ledd', short:'Ledd, regnerekkefølge og tekstoppgaver.',
   learn:`<div class="box"><span class="lab">1 · Hva er et ledd?</span>
       <p>Tenk på <b>pluss</b> og <b>minus</b> som sakser. De kutter regnestykket i deler som kalles <b>ledd</b>.</p>
       <div class="terms">${T('10')}${O('+')}${T('4 · 3')}${O('−')}${T('12 : 2')}</div>

 'negative-tall':{ title:'Negative tall', short:'Tallinja, pluss og minus, og fortegnsregler.',
   learn:`<p>Negative tall er mindre enn null. Vi møter dem i temperaturer, på bankkontoen, i heisen og under havflaten. På tallinja ligger de til venstre for null.</p>

 potenser:{ title:'Potenser', short:'Grunntall, eksponent og spesialregler.',
   learn:`<div class="box"><span class="lab">1 · Potensens byggeklosser</span>
       <p>En potens er en snarvei for å skrive at et tall skal ganges med seg selv flere ganger.</p>
       <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center"><div class="pow"><span class="b">2</span><span class="e">4</span></div>

       <p class="eq" style="text-align:left">2 · 2 · 2 · 2 = <span class="hl">16</span></p></div>
     <div class="model" data-model="pow"></div>
     <div class="rule"><span class="lab">3 · Tre spesialregler</span><ul>

     <div class="trap"><span class="lab">Den klassiske fella</span><p>Ikke gang grunntallet med eksponenten! <code>2³</code> er <b>ikke</b> 2 · 3 = 6. Riktig er <code>2 · 2 · 2 = 8</code>.</p>
       <p>Pass også på parentesen: <code>(−2)² = 4</code>, men <code>−2² = −4</code>.</p></div>`,
   trainers:[{id:'pow'}] },
 potensregler:{ title:'Regning med potenser', short:'Ganging og deling av potenser med samme grunntall.',
   learn:`<div class="box"><span class="lab">1 · Ganging med samme grunntall</span>
       <p>Behold grunntallet og <b>legg sammen eksponentene</b>.</p><p class="eq">${P(2,3)} · ${P(2,2)} = ${P(2,'3+2')} = ${P(2,5)}</p>
       <p>Hvorfor? <code>(2 · 2 · 2) · (2 · 2)</code> er fem totall ganget sammen.</p></div>

       <p>Behold grunntallet og <b>trekk fra eksponentene</b>.</p><p class="eq">${P(3,5)} : ${P(3,2)} = ${P(3,'5−2')} = ${P(3,3)}</p>

       <p><b>Reglene gjelder ikke for pluss og minus:</b> <code>2³ + 2²</code> blir <b>ikke</b> <code>2⁵</code>. Riktig er 8 + 4 = 12.</p></div>`,
   trainers:[{id:'powrules'}] }

Object.assign(TOPICS, {
 delelighet:{ title:'Delelighet og primtall', short:'Faktorer, delelighetsregler, primtall og sammensatte tall.',
  learn:`<p>Et tall er <b>delelig</b> med et annet tall når divisjonen går opp uten rest. Tallet vi deler med, er da en <b>faktor</b>. 24 er delelig med 6 fordi 24 : 6 = 4. Vi sier også at 6 går opp i 24.</p>
   <p>Et <b>primtall</b> har nøyaktig to faktorer: 1 og seg selv. Et <b>sammensatt tall</b> har flere. Rektangelmodellen viser forskjellen: kan prikkene legges i et rektangel med mer enn én rad?</p>

 faktorisering:{ title:'Primtallsfaktorisering', short:'Faktortre, største felles faktor og minste felles multiplum.',
  learn:`<p>Alle sammensatte tall kan skrives som et produkt av primtall på nøyaktig én måte. Det kalles <b>primtallsfaktorisering</b>. Et <b>faktortre</b> viser hvordan vi finner faktorene.</p>

    <p><b>Største felles faktor (SFF)</b> er produktet av faktorene tallene har felles (grønne): 2 · 3 = <b>6</b>. Det er det største tallet som går opp i begge.</p>
    <p><b>Minste felles multiplum (MFM)</b> tar med alle faktorene, men de felles bare én gang: 2 · 2 · 3 · 3 = <b>36</b>. Det er det minste tallet begge går opp i.</p>

 forkorting:{ title:'Utvide og forkorte brøker', short:'Like store brøker med ulik skrivemåte.',
  learn:`<p>En brøk har <b>teller</b> og <b>nevner</b>. Nevneren forteller hvor mange like store deler det hele er delt i. Telleren forteller hvor mange deler vi har.</p>

 'brok-desimal':{ title:'Brøk, desimaltall og prosent', short:'Tre skrivemåter for samme tall.',

 'brok-add':{ title:'Addisjon og subtraksjon av brøker', short:'Fellesnevner, like store biter og forkorting.',

 uttrykk:{ title:'Algebraiske uttrykk', short:'Variabler, sette inn verdier og lage uttrykk fra tekst.',
  learn:`<p>I algebra bruker vi bokstaver for tall som kan variere, eller som vi ikke kjenner ennå. Bokstaven kalles en <b>variabel</b>. Et <b>algebraisk uttrykk</b> er for eksempel 3x + 4.</p>

 forenkling:{ title:'Addisjon og subtraksjon av uttrykk', short:'Like ledd, nullpar og minus foran parentes.',

 parenteser:{ title:'Parenteser i uttrykk', short:'Gange inn i parentes med arealmodell.',

 monster:{ title:'Mønster i tall', short:'Figurtall, tabeller og formler.',

 likninger:{ title:'Likninger', short:'Skålvekt, balanse og føring.',

 problemlosning:{ title:'Problemløsning med likninger', short:'Fra tekst via strimmeldiagram til likning.',
