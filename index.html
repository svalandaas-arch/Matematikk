<title>Matematikk 8. og 9. trinn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a squared maths exercise book. Light = ruteark (blue grid paper), dark = tavle (chalkboard).
   Sticky chapter index on the left, one reading column. Every topic = Lær (step-through model) + Øv (generator). */
:root{
  --paper:#F5F7FB; --grid:rgba(48,92,168,.11); --surface:#FFFFFF; --ink:#141E36; --muted:#56617A;
  --line:#D2DAE8; --pen:#2343B0; --pen-soft:rgba(35,67,176,.08); --hl:rgba(255,211,59,.78);
  --note:#FFF6D8; --note-line:#E0C04F;
  --c1:rgba(35,67,176,.30); --c2:rgba(194,54,43,.28); --c3:rgba(27,118,70,.30); --c12:rgba(110,45,160,.55);
  --red:#C2362B; --red-soft:rgba(194,54,43,.08); --ok:#1B7646; --ok-soft:rgba(27,118,70,.10); --bad:#B5382C; --bad-soft:rgba(181,56,44,.08);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --mc:30px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15211E; --grid:rgba(214,236,224,.055); --surface:#1C2B27; --ink:#E6EEE9; --muted:#9DB1A7;
    --line:#2F433D; --pen:#93B5FF; --pen-soft:rgba(147,181,255,.11); --hl:rgba(242,205,74,.30);
    --note:rgba(242,205,74,.09); --note-line:rgba(242,205,74,.45);
    --c1:rgba(147,181,255,.38); --c2:rgba(255,139,123,.36); --c3:rgba(99,211,152,.36); --c12:rgba(205,150,255,.55);
    --red:#FF8B7B; --red-soft:rgba(255,139,123,.10); --ok:#63D398; --ok-soft:rgba(99,211,152,.12); --bad:#FF8070; --bad-soft:rgba(255,128,112,.11);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15211E; --grid:rgba(214,236,224,.055); --surface:#1C2B27; --ink:#E6EEE9; --muted:#9DB1A7;
  --line:#2F433D; --pen:#93B5FF; --pen-soft:rgba(147,181,255,.11); --hl:rgba(242,205,74,.30);
  --note:rgba(242,205,74,.09); --note-line:rgba(242,205,74,.45);
  --c1:rgba(147,181,255,.38); --c2:rgba(255,139,123,.36); --c3:rgba(99,211,152,.36); --c12:rgba(205,150,255,.55);
    --red:#FF8B7B; --red-soft:rgba(255,139,123,.10); --ok:#63D398; --ok-soft:rgba(99,211,152,.12); --bad:#FF8070; --bad-soft:rgba(255,128,112,.11);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--pen)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h1{font-weight:800;font-size:clamp(2.2rem,6vw,3.5rem);letter-spacing:-.025em}
h2{font-weight:800;font-size:clamp(1.5rem,3.4vw,2rem);letter-spacing:-.015em}
h3{font-weight:600;font-size:1.25rem}
p{margin:0}
code,.math{font-family:var(--f-mono);font-weight:500;font-size:.94em;white-space:nowrap}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%);padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hand{font-family:var(--f-hand);font-weight:700;color:var(--red);line-height:1.1}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .brand{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--ink);text-decoration:none}
.menu-btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.menu-btn svg{width:18px;height:18px}
.side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:40;background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease;
  padding-block:calc(env(safe-area-inset-top,0px) + 22px) 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,30,.42)}
.brand-big{display:block;font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.1;color:var(--ink);text-decoration:none;margin-bottom:22px}
.brand-big small{display:block;font-family:var(--f-mono);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:6px;font-size:.96rem;line-height:1.35}
.nav a:hover{background:var(--pen-soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav a[aria-current="page"] .tally{color:var(--surface);opacity:.8}
.nav .chap{font-weight:700;margin-top:10px}
.nav .grp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav .sub a{padding-left:20px}
.nav .soon{color:var(--muted);padding:6px 10px;font-size:.92rem}
.tally{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tally.done{color:var(--ok);font-weight:700}
@media (min-width:980px){
  .app{grid-template-columns:300px minmax(0,1fr)}
  .topbar,.scrim{display:none!important}
  .side{position:sticky;top:0;height:100vh;transform:none;transition:none;width:auto;z-index:auto}
}
.main{padding-block:44px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.crumb{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumb a{color:var(--muted)}
.lede{font-size:1.15rem;color:var(--muted);max-width:58ch}

/* ---------- buttons & fields ---------- */
.btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--surface);border:1.5px solid var(--ink);
  border-radius:6px;padding:9px 18px;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){background:var(--pen);border-color:var(--pen)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--pen-soft);color:var(--pen);border-color:var(--pen)}
.btn.small{padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.35;cursor:default}
.link-btn{font:inherit;font-size:.92rem;background:none;border:0;color:var(--pen);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.9rem;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:hover{border-color:var(--pen);color:var(--pen)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:3px}
.field label,.flabel{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num-in{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;width:6.5rem;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-align:center}
.num-in.sm{width:4.2rem}
.num-in:focus{border-color:var(--pen);outline:none}
select.num-in{width:4.2rem;cursor:pointer}

/* ---------- home & chapter ---------- */
.home-hero{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.home-hero h1{font-size:clamp(2.6rem,8vw,4.6rem)}
.chapters{display:grid;gap:16px}
.chap-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:start;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:22px 24px;text-decoration:none;color:var(--ink)}
.chap-card:hover{border-color:var(--pen);box-shadow:4px 4px 0 var(--pen)}
.chap-card .num{grid-row:span 3;font-family:var(--f-display);font-weight:800;font-size:4.2rem;line-height:.85;color:var(--pen)}
.chap-card h3{font-size:1.5rem;font-weight:800}
.chap-card .meta{color:var(--muted);font-size:.95rem}
.chap-card.soon{border-style:dashed;border-color:var(--line);background:transparent;color:var(--muted)}
.chap-card.soon .num{color:var(--line)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.steps-how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:s}
.steps-how li{counter-increment:s;display:flex;flex-direction:column;gap:6px}
.steps-how li::before{content:counter(s);font-family:var(--f-hand);font-weight:700;font-size:2.2rem;line-height:1;color:var(--red)}
.steps-how b{font-family:var(--f-display);font-size:1.1rem}
.steps-how span{color:var(--muted);font-size:.96rem}
.chap-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 24px;align-items:end}
.chap-hero .num{font-family:var(--f-display);font-weight:800;font-size:clamp(5rem,15vw,8.5rem);line-height:.78;color:var(--pen);grid-row:span 2}
.chap-hero .lede{grid-column:1/-1;margin-top:14px}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.goals h2{font-family:var(--f-hand);font-weight:700;font-size:1.9rem;color:var(--red);letter-spacing:0;margin-bottom:6px}
.goals ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.goals li{display:flex;gap:10px}
.goals li::before{content:"";flex:none;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;margin-top:5px}
.group{display:flex;flex-direction:column;gap:14px}
.group-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.group-head .eyebrow{color:var(--pen)}
.rows{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.rows li{border-bottom:1px solid var(--line)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:14px 4px;text-decoration:none;color:var(--ink)}
.rows a:hover{background:var(--pen-soft)}
.rows .t{font-family:var(--f-display);font-weight:600;font-size:1.18rem}
.rows .d{grid-column:1;color:var(--muted);font-size:.95rem}
.rows .p{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:84px}
.rows .p .bar{width:84px;margin:0}
footer.foot{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

/* ---------- topic ---------- */
.topic-head{display:flex;flex-direction:column;gap:14px}
.jump{display:flex;gap:10px;flex-wrap:wrap}
.part{display:flex;flex-direction:column;gap:22px}
.part-title{display:flex;align-items:center;gap:14px;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.part-title .tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--surface);padding:3px 8px;border-radius:4px}
.learn{display:flex;flex-direction:column;gap:20px}
.learn > p,.learn > ul{max-width:66ch}
.learn ul,.learn ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.box .lab{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pen);font-weight:700}
.rule{background:var(--pen-soft);border:1.5px dashed var(--pen);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.rule .lab{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1;color:var(--pen)}
.trap{border:1.5px solid var(--red);border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;background:var(--red-soft)}
.trap .lab{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1;color:var(--red)}
.scroll{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.t th{font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--muted);background:var(--pen-soft)}
table.t td{font-family:var(--f-mono)}
.order{list-style:none;padding:0!important;display:grid;gap:8px!important;counter-reset:o}
.order li{counter-increment:o;display:flex;gap:12px;align-items:baseline}
.order li::before{content:counter(o);flex:none;font-family:var(--f-mono);font-weight:700;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--pen);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.terms{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.term{border:2px solid var(--pen);background:var(--pen-soft);color:var(--ink);border-radius:8px;padding:4px 12px}
.term.done{border-color:var(--ok);background:var(--ok-soft)}
.opb{color:var(--red);font-size:1.3rem;padding:0 2px}

/* ---------- step-through model ---------- */
.model{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.model-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.model-head h3{font-size:1.15rem}
.model-head .tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pen);font-weight:700}
.model-ctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.model-ctl .op{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;padding-bottom:6px;color:var(--muted)}
.model-ctl .sp{flex:1}
.model-err{color:var(--bad);font-weight:700;font-size:.9rem;padding:0 18px}
.model-err:empty{display:none}
.stage{padding:20px 18px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--mc) var(--mc);display:flex;flex-direction:column;align-items:center;gap:16px;overflow-x:auto}
.stage.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start;gap:20px}
.stage .pane{display:flex;flex-direction:column;gap:10px;min-width:0;align-items:center}
.stage .pane > .flabel{align-self:flex-start}
.caption{margin:0 18px 0;background:var(--note);border:1.5px dashed var(--note-line);border-radius:8px;padding:12px 16px;font-size:1rem;min-height:3.2em}
.caption.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.caption b{font-weight:700}
.stepbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 18px}
.stepbar .ind{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stepbar .sp{flex:1}
.legend{font-size:.85rem;color:var(--muted);padding:0 18px 16px}

/* column add/sub */
.cols{display:grid;justify-content:center;font-family:var(--f-mono)}
.cc{display:flex;flex-direction:column;align-items:center;width:var(--mc)}
.cc > span{height:var(--mc);display:flex;align-items:center;justify-content:center;width:100%;position:relative}
.cc .cr{height:20px;font-family:var(--f-hand);font-weight:700;font-size:1.15rem;color:var(--red);align-items:flex-end}
.cc .dg{font-size:1.3rem;font-weight:700}
.cc .ln{height:2px;background:var(--ink)}
.cc .rs{font-size:1.3rem;font-weight:700;color:var(--pen)}
.cc .pl{height:16px;font-size:.62rem;color:var(--muted);letter-spacing:.04em}
.cc.on .dg,.cc.on .rs{background:var(--hl);border-radius:4px}
.cc.on .pl{color:var(--red);font-weight:700}
.cc .opc{color:var(--red);font-size:1.3rem;font-weight:700}
.struck{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)!important;font-size:.95rem!important;position:absolute;top:-4px;left:3px}
.newv{position:absolute;right:-2px;bottom:-2px;font-family:var(--f-hand);font-size:1.15rem;color:var(--red);font-weight:700}

/* multiplication */
.alg{display:inline-flex;flex-direction:column;font-family:var(--f-mono);font-weight:700;font-size:1.2rem}
.alg .row{display:flex;justify-content:flex-end}
.alg .cell{width:var(--mc);height:var(--mc);display:inline-flex;align-items:center;justify-content:center}
.alg .cell.act{background:var(--hl);border-radius:4px}
.alg .carry .cell{height:18px;font-family:var(--f-hand);font-size:1.05rem;color:var(--red);align-items:flex-end}
.alg .top{border-bottom:2px solid var(--ink)}
.alg .sum{border-top:2px solid var(--ink);margin-top:2px}
.alg .plus{color:var(--red)}
.alg .res{color:var(--pen)}
.arrow-svg path.a{fill:none;stroke:var(--red);stroke-width:2}
.arrow-svg path.h{fill:var(--red)}
.agrid{display:grid;gap:4px;width:100%;max-width:360px}
.alabel{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.acell{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--pen);background:var(--pen-soft);color:var(--pen);font-family:var(--f-mono);font-weight:700;border-radius:4px;transition:opacity .2s}
.acell.dim,.alabel.dim{opacity:.3}
.asum{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);word-break:break-word;text-align:center}

/* division */
.scale-note{font-family:var(--f-mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;line-height:1.7}
.scale-note .hand{font-size:1.2rem}
.dgrid{display:grid;grid-auto-rows:var(--mc);font-family:var(--f-mono);font-weight:700;font-size:1.2rem}
.dcell{display:flex;align-items:center;justify-content:center;position:relative}
.dcell.sym{color:var(--muted)}
.dcell.q{color:var(--pen)}
.dcell.uline{border-bottom:5px double var(--pen)}
.dcell.line{box-shadow:inset 0 -2px 0 var(--ink)}
.dcell.cur{background:var(--hl);border-radius:4px}
.dcell.fin{color:var(--red)}
.dcell.arr{color:var(--red);font-size:1rem}
.dcell .pm{position:absolute;top:-4px;right:-4px;font-size:.7rem;color:var(--red)}

/* number line */

.ws .qx{font-size:12.5pt!important}
.ws .q{font-size:10.5pt}

.ws .q table.t{margin:1mm 0!important;font-size:10pt}
.ws .coordbox{display:grid;grid-template-columns:1fr 52mm;gap:4mm;align-items:start}
.ws .talk{margin-top:6mm;border:1.4px dashed var(--lv);border-radius:2.5mm;padding:3mm 4mm;break-inside:avoid}

.ws .self{margin-top:6mm;border-top:1.5px solid var(--ink);padding-top:3mm;display:grid;grid-template-columns:auto 1fr auto;gap:4mm;align-items:center;break-inside:avoid;font-size:9.5pt}

.ws .self .wch span::before{content:"";width:3.6mm;height:3.6mm;border:1.4px solid var(--ink);border-radius:50%}
.ws .self .nx{font-family:var(--f-mono);font-size:8pt;color:var(--lv);text-align:right}
.ws .pb{break-before:page;height:0}
.ws .key .top h1{font-size:19pt}
.ws .kt{margin-top:4mm;display:grid;grid-template-columns:22mm 1fr;border-top:1px solid var(--line);break-inside:avoid}

.ws .kt>.l{display:grid;grid-template-columns:repeat(var(--kc,3),1fr);gap:1mm 5mm;padding:2mm 0}
.ws .ka{display:grid;grid-template-columns:5mm 1fr;gap:1mm;font-size:9.5pt;break-inside:avoid}

.ws .ka .a{font-family:var(--f-mono);font-weight:700}

.ws .ka svg,.ws .ka table{display:none}
.ws .knote{margin-top:5mm;font-size:9pt;color:var(--muted)}
.wsg{display:flex;flex-direction:column;gap:16px}
.wsg-intro{margin:0;color:var(--muted);max-width:62ch}

 html.ws-printing body>*:not(#ws-print){display:none!important}

<div class="app">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Innhold
    </button>
    <a class="brand" href="#">Matematikk 8</a>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <nav class="side" id="side" aria-label="Innhold"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script>
(function(){
"use strict";

/* ===================== small helpers ===================== */
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const rndNZ = (a,b) => { let n=0; while(n===0) n=rnd(a,b); return n; };
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const fmt = n => String(n).replace('-', '−').replace('.', ',');
const par = n => n < 0 ? `(${fmt(n)})` : fmt(n);
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻'};
const sup = s => String(s).split('').map(c => SUP[c] || c).join('');
const P = (b,e) => `${b}<sup>${e}</sup>`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let uid = 0;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===================== number line (SVG) ===================== */
function numLine(lo, hi, items, aria){
  const W=580, H=128, y=96, pad=22, span=hi-lo, sx=(W-2*pad)/span, x=v=>pad+(v-lo)*sx;
  let tick = span<=30 ? 1 : span<=60 ? 5 : span<=150 ? 10 : 25;
  let lab = span<=16 ? 1 : span<=30 ? 2 : tick;
  const id = 'nl'+(++uid);
  let s = `<svg class="nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria||'Tallinje')}"><defs>
    <marker id="${id}p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd p" d="M0 0L10 5L0 10z"/></marker>
    <marker id="${id}n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd n" d="M0 0L10 5L0 10z"/></marker></defs>`;
  s += `<line class="ax" x1="${pad-10}" y1="${y}" x2="${W-pad+10}" y2="${y}"/>`;
  for(let v=Math.ceil(lo/tick)*tick; v<=hi; v+=tick){
    s += `<line class="${v===0?'tk0':'tk'}" x1="${x(v)}" y1="${y-6}" x2="${x(v)}" y2="${y+6}"/>`;
    if (v % lab === 0) s += `<text class="lb${v===0?' lb0':''}" x="${x(v)}" y="${y+22}" text-anchor="middle">${fmt(v)}</text>`;
  }
  items.forEach(it => {
    if (it.t === 'arc' && it.from !== it.to){
      const x1=x(it.from), x2=x(it.to), rx=Math.abs(x2-x1)/2, ry=Math.min(rx, it.h || 60), c = it.c || 'p';
      s += `<path class="arc ${c}${it.dash?' d':''}" d="M${x1} ${y-3} A${rx} ${ry} 0 0 ${x2>x1?1:0} ${x2} ${y-3}" marker-end="url(#${id}${c})"/>`;
      if (it.label) s += `<text class="al ${c}" x="${(x1+x2)/2}" y="${Math.max(12, y-3-ry-6)}" text-anchor="middle">${esc(it.label)}</text>`;
    } else if (it.t === 'dot'){
      s += `<circle class="${it.c}" cx="${x(it.at)}" cy="${y}" r="${it.r||6}"/>`;
    } else if (it.t === 'face'){
      const x0=x(it.at), d=it.dir, c=it.c;
      s += `<line class="arc ${c}" x1="${x0}" y1="${y-16}" x2="${x0+22*d}" y2="${y-16}" marker-end="url(#${id}${c})"/>`;
    }
  });
  return `<div class="scroll">${s}</svg></div>`;
}

/* ===================== stepper controller ===================== */
function stepper(root, getModel, opts){
  opts = opts || {};
  const min = opts.min !== undefined ? opts.min : -1;
  let i = min;
  const prev = root.querySelector('[data-s=prev]'), next = root.querySelector('[data-s=next]'),
        all = root.querySelector('[data-s=all]'), reset = root.querySelector('[data-s=reset]'), ind = root.querySelector('.ind');
  function draw(){
    const m = getModel(); if (!m) return;
    const n = m.count;
    i = Math.max(min, Math.min(n-1, i));
    m.render(i);
    prev.disabled = i <= min; next.disabled = i >= n-1;
    next.textContent = i < 0 ? 'Start' : 'Neste steg →';
    ind.textContent = i < 0 ? `${n} steg` : `Steg ${i+1} av ${n}`;
  }
  prev.onclick = () => { i--; draw(); };
  next.onclick = () => { i++; draw(); };
  if (all) all.onclick = () => { i = 1e9; draw(); };
  if (reset) reset.onclick = () => { i = min; draw(); };
  return { draw, reset(){ i = min; draw(); } };
}
const STEPBAR = `<div class="stepbar"><button class="btn ghost small" data-s="prev">← Forrige</button><button class="btn small" data-s="next">Start</button><span class="ind"></span><span class="sp"></span><button class="link-btn" data-s="all">Vis alt</button><button class="link-btn" data-s="reset">Start på nytt</button></div>`;
function modelShell(title, tag, ctl, extra){
  return `<div class="model-head"><h3>${title}</h3><span class="tag">${tag||'Trinnvis modell'}</span></div>
    ${ctl?`<div class="model-ctl">${ctl}</div><p class="model-err" aria-live="polite"></p>`:''}
    <div class="stage"></div><p class="caption" aria-live="polite"></p>${STEPBAR}${extra||''}`;
}

/* ===================== MODEL: oppstilling + / − ===================== */
const PLACE = ['enere','tiere','hundrere','tusener','titusener','hundretusener'];
const PL_SHORT = ['E','T','H','Tu','TT','HT'];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const digitsLow = n => { if (n===0) return [0]; const d=[]; while(n>0){ d.push(n%10); n=Math.floor(n/10);} return d; };
function buildAdd(a,b){
  const A=digitsLow(a), B=digitsLow(b), L=Math.max(A.length,B.length), steps=[]; let carry=0;
  for(let i=0;i<L;i++){
    const da=A[i]||0, db=B[i]||0, cin=carry, sum=da+db+cin, r=sum%10, cout=Math.floor(sum/10);
    let t = cin ? `<b>${cap(PLACE[i])}:</b> ${da} + ${db} + mentetallet ${cin} = ${sum}. ` : `<b>${cap(PLACE[i])}:</b> ${da} + ${db} = ${sum}. `;
    t += cout ? `Vi skriver ${r} og husker ${cout} (mentetall) til neste kolonne.` : `Vi skriver ${r}.`;
    steps.push({col:i, r, cout, text:t}); carry=cout;
  }
  return {steps, A, B, L, finalCarry:carry};
}
function buildSub(a,b){
  const A=digitsLow(a), B=digitsLow(b), L=A.length, w=A.slice(), steps=[];
  for(let i=0;i<L;i++){
    const orig=w[i], db=B[i]||0; let borrowed=false; const casc=[];
    if (w[i] < db){ let j=i+1; while(w[j]===0){ w[j]=9; casc.push(j); j++; } w[j]-=1; casc.push(j); w[i]+=10; borrowed=true; }
    const top=w[i], r=top-db;
    const t = borrowed
      ? `<b>${cap(PLACE[i])}:</b> ${orig} er mindre enn ${db}, så vi låner 10 fra naboen. ${orig} blir ${top}. ${top} − ${db} = ${r}.`
      : `<b>${cap(PLACE[i])}:</b> ${top} − ${db} = ${r}.`;
    steps.push({col:i, r, borrowed, casc, snap:w.slice(), text:t});
  }
  return {steps, A, B, L};
}
function mountAddSub(el){
  el.innerHTML = modelShell('Oppstillingsalgoritmen','Trinnvis modell',
    `<div class="field"><label for="as-a">Første tall</label><input class="num-in" id="as-a" inputmode="numeric" value="356"></div>
     <div class="field"><span class="flabel">Regneart</span><div class="seg" data-g="op"><button aria-pressed="true" data-v="+" aria-label="Addisjon">+</button><button aria-pressed="false" data-v="-" aria-label="Subtraksjon">−</button></div></div>
     <div class="field"><label for="as-b">Andre tall</label><input class="num-in" id="as-b" inputmode="numeric" value="278"></div>
     <span class="sp"></span><button class="btn ghost small" data-act="rand">Tilfeldig eksempel</button>`,
    `<p class="legend" data-leg></p>`);
  const ia=el.querySelector('#as-a'), ib=el.querySelector('#as-b'), err=el.querySelector('.model-err'), stage=el.querySelector('.stage'), capt=el.querySelector('.caption'), leg=el.querySelector('[data-leg]');
  let op='+', M=null;
  function setOp(v){ op=v; el.querySelectorAll('[data-g=op] button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v)); }
  function build(){
    err.textContent='';
    let a=parseInt(ia.value,10), b=parseInt(ib.value,10);
    if (isNaN(a)||isNaN(b)||a<0||b<0){ err.textContent='Skriv inn to positive hele tall.'; return; }
    if (a>999999||b>999999){ err.textContent='Bruk tall opp til 999 999, så det får plass på arket.'; return; }
    if (op==='-' && b>a){ [a,b]=[b,a]; ia.value=a; ib.value=b; err.textContent='Vi byttet om tallene: det største tallet må stå øverst ved subtraksjon.'; }
    const R = op==='+' ? buildAdd(a,b) : buildSub(a,b);
    const total = op==='+' ? R.L + (R.finalCarry?1:0) : R.L;
    leg.innerHTML = op==='+' ? '<b class="hand" style="font-size:1.2rem">Røde tall</b> over kolonnene er mentetall: det vi husker og legger til i neste kolonne.'
      : '<b class="hand" style="font-size:1.2rem">Røde tall</b> viser lån: 10 over et siffer betyr at vi har lånt 10 dit. Overstrøkne sifre har lånt bort 1 til naboen.';
    M = { count: R.steps.length, render(i){
      let carry = Array(total).fill(null), snap = R.A.slice(), lent = new Set(), got = new Set();
      if (op==='+'){ for(let k=0;k<=i;k++){ const s=R.steps[k]; if(s.cout && k+1<total) carry[k+1]=s.cout; } }
      else { if(i>=0) snap=R.steps[i].snap.slice(); for(let k=0;k<=i;k++){ const s=R.steps[k]; if(s.borrowed){ got.add(s.col); s.casc.forEach(c=>lent.add(c)); } } }
      let h = `<div class="cols" style="grid-template-columns:repeat(${total+1},var(--mc))">`;
      h += `<div class="cc"><span class="cr"></span><span class="dg"></span><span class="dg opc">${op==='+'?'+':'−'}</span><span class="ln"></span><span class="rs"></span><span class="pl"></span></div>`;
      for(let c=0;c<total;c++){
        const u = total-1-c, extra = op==='+' && u>=R.A.length && u>=R.B.length;
        const on = i>=0 && i<R.steps.length && R.steps[i].col===u;
        let cr = op==='+' ? (carry[u]||'') : (got.has(u)?'10':'');
        let top = '';
        if (!extra){
          const o = R.A[u]!==undefined?R.A[u]:0, cur = snap[u]!==undefined?snap[u]:o;
          top = (op==='-' && lent.has(u)) ? `<span class="struck">${o}</span><span class="newv">${cur}</span>` : `${o}`;
        }
        const bot = extra ? '' : (R.B[u]!==undefined ? R.B[u] : (u<R.A.length? '' : ''));
        let res='';
        if (u<=i && !extra && R.steps[u]) res = R.steps[u].r;
        if (extra && i===R.steps.length-1 && R.finalCarry) res = R.finalCarry;
        h += `<div class="cc${on?' on':''}"><span class="cr">${cr}</span><span class="dg">${top}</span><span class="dg">${bot}</span><span class="ln"></span><span class="rs">${res}</span><span class="pl">${extra?'':(PL_SHORT[u]||'')}</span></div>`;
      }
      stage.innerHTML = h + '</div>';
      capt.classList.remove('done');
      if (i<0) capt.innerHTML = 'Vi starter alltid med enerne, lengst til høyre. Trykk <b>Start</b> for å begynne.';
      else if (i===R.steps.length-1){ capt.classList.add('done'); capt.innerHTML = `${R.steps[i].text}<br>Ferdig! Svaret er ${fmt(op==='+'?a+b:a-b)}.`; }
      else capt.innerHTML = R.steps[i].text;
    }};
    ctl.reset();
  }
  const ctl = stepper(el, ()=>M);
  el.querySelectorAll('[data-g=op] button').forEach(b=>b.onclick=()=>{ setOp(b.dataset.v); build(); });
  [ia,ib].forEach(x=>x.addEventListener('change', build));
  [ia,ib].forEach(x=>x.addEventListener('keydown', e=>{ if(e.key==='Enter') build(); }));
  el.querySelector('[data-act=rand]').onclick=()=>{ const d=rnd(2,4), mx=10**d-1, mn=10**(d-1); let a=rnd(mn,mx), b=rnd(mn,mx); if(op==='-'&&b>a)[a,b]=[b,a]; ia.value=a; ib.value=b; build(); };
  build();
  return { load(v){ ia.value=v.a; ib.value=v.b; setOp(v.op); build(); } };
}

/* ===================== MODEL: multiplikasjon + arealmodell ===================== */
function mountMult(el){
  el.innerHTML = modelShell('Multiplikasjon med oppstilling og arealmodell','Trinnvis modell',
    `<div class="field"><label for="mu-a">Første faktor</label><input class="num-in sm" id="mu-a" inputmode="numeric" value="84"></div>
     <span class="op">·</span>
     <div class="field"><label for="mu-b">Andre faktor</label><input class="num-in sm" id="mu-b" inputmode="numeric" value="12"></div>
     <span class="sp"></span><button class="btn ghost small" data-act="rand">Tilfeldig eksempel</button>`);
  const stage=el.querySelector('.stage'); stage.classList.add('split');
  const ia=el.querySelector('#mu-a'), ib=el.querySelector('#mu-b'), capt=el.querySelector('.caption');
  const clamp = v => Math.max(1, Math.min(999, v||1));
  const placeTerms = n => { const s=String(n); return s.split('').map((d,i)=>Number(d)*10**(s.length-1-i)).filter(t=>t>0); };
  const placeName = p => ({1:'ener',10:'tier',100:'hundrer',1000:'tusener',10000:'titusener',100000:'hundretusener'})[p] || 'plass';
  function model(step){
    const a=clamp(parseInt(ia.value,10)), b=clamp(parseInt(ib.value,10));
    const digs=String(b).split('').map(Number).reverse();
    const rows=digs.map((digit,shift)=>({digit,shift,value:a*digit*10**shift})).filter(r=>r.digit!==0||String(b).length===1);
    const counts=rows.map(r=>String(Math.floor(r.value/10**r.shift)).length);
    const totalRow=counts.reduce((s,c)=>s+c,0);
    const sumSteps = rows.length>1 ? String(a*b).length : 0;
    const maxStep=totalRow+sumSteps;
    let cur=null;
    if (step>0){
      if (step>totalRow) cur={type:'sum',digitIndex:step-totalRow-1};
      else { let rem=step; for(let i=0;i<rows.length;i++){ if(rem<=counts[i]){ cur={type:'row',rowIndex:i,digitIndex:rem-1}; break; } rem-=counts[i]; } }
    }
    return {a,b,rows,counts,totalRow,maxStep,cur,sumSteps};
  }
  function algo(step, md){
    const {a,b,rows,counts,totalRow,cur}=md, CELL=parseFloat(getComputedStyle(el).getPropertyValue('--mc'))||30;
    const aStr=String(a), bStr=String(b), offset=bStr.length+1, width=String(a*b).length+1;
    const W=Math.max(aStr.length+offset, width+offset), pos=ci=>W-1-ci;
    let aA=null, aB=null;
    if (cur && cur.type==='row'){ const row=rows[cur.rowIndex]; aA=offset+Math.min(cur.digitIndex, aStr.length-1); aB=row.shift; }
    const carryOver=Array(aStr.length+1).fill(null), aD=aStr.split('').map(Number).reverse();
    rows.forEach((row,i)=>{ const prior=counts.slice(0,i).reduce((s,c)=>s+c,0), rev=Math.max(0,Math.min(counts[i],step-prior)); let c=0;
      aD.forEach((d,j)=>{ const p=d*row.digit+c; c=Math.floor(p/10); if(c>0 && rev>j && cur && cur.type==='row' && cur.rowIndex===i) carryOver[j+1]=c; }); });
    let h='<div class="alg" role="img" aria-label="Oppstilling">';
    h+='<div class="row carry">'; for(let ci=0;ci<W;ci++){ const ai=pos(ci)-offset, c=ai>=0?carryOver[ai]:null; h+=`<span class="cell">${c??''}</span>`; } h+='</div>';
    const top=(aStr+'·'+bStr).padStart(W,' ').split('');
    h+='<div class="row top">'; top.forEach((ch,ci)=>{ const p=pos(ci); h+=`<span class="cell${(p===aA||p===aB)?' act':''}">${ch===' '?'':ch}</span>`; }); h+='</div>';
    if (aA!==null){ const cx=p=>(W-1-p)*CELL+CELL/2, f=cx(aA), t=cx(aB), id='mh'+(++uid);
      h+=`<svg class="arrow-svg" width="${W*CELL}" height="24" style="display:block"><defs><marker id="${id}" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path class="h" d="M0,0 L6,3 L0,6 Z"/></marker></defs><path class="a" d="M ${f} 2 C ${f} 20, ${t} 20, ${t} 5" marker-end="url(#${id})"/></svg>`;
    } else h+='<div style="height:24px"></div>';
    const last=rows.length-1;
    rows.forEach((row,i)=>{
      const prior=counts.slice(0,i).reduce((s,c)=>s+c,0), rev=Math.max(0,Math.min(counts[i],step-prior)), active=step>prior&&step<=prior+counts[i];
      const vD=String(Math.floor(row.value/10**row.shift)).split('').map(Number).reverse();
      const plusPos=(i===last&&rows.length>1)?offset+row.shift+vD.length:null;
      h+='<div class="row">';
      for(let ci=0;ci<W;ci++){ const p=pos(ci), vi=p-offset-row.shift, d=(vi>=0&&vi<vD.length)?vD[vi]:null;
        if (d===null && p===plusPos) h+=`<span class="cell plus" style="opacity:${rev>0?1:0}">+</span>`;
        else { const vis=d!==null&&vi<rev; h+=`<span class="cell${active&&vis?' act':''}" style="opacity:${vis?1:0}">${vis?d:''}</span>`; }
      }
      h+='</div>';
    });
    if (rows.length>1){
      const pD=String(a*b).split('').map(Number).reverse();
      h+='<div class="row sum">';
      for(let ci=0;ci<W;ci++){ const pi=pos(ci)-offset, d=(pi>=0&&pi<pD.length)?pD[pi]:null, vis=d!==null&&step>totalRow&&pi<step-totalRow;
        h+=`<span class="cell res${vis&&pi===step-totalRow-1?' act':''}" style="opacity:${vis?1:0}">${vis?d:''}</span>`; }
      h+='</div>';
    }
    return h+'</div>';
  }
  function area(md){
    const {a,b,cur,rows}=md, aT=placeTerms(a), bT=placeTerms(b);
    const active = cur&&cur.type==='row' ? rows[cur.rowIndex].digit*10**rows[cur.rowIndex].shift : null;
    const tot=aT.reduce((s,t)=>s+t,0)||1, bTot=bT.reduce((s,t)=>s+t,0)||1;
    const fr=aT.map(t=>`minmax(52px, ${Math.max(.5,(t/tot)*aT.length*1.2)}fr)`).join(' ');
    let h=`<div class="agrid" style="grid-template-columns:2.6rem ${fr}"><div></div>`;
    aT.forEach(t=>h+=`<div class="alabel">${t}</div>`);
    bT.forEach(bt=>{ const dim=active!==null&&active!==bt;
      h+=`<div class="alabel${dim?' dim':''}" style="justify-content:flex-end;padding-right:6px">${bt}</div>`;
      aT.forEach(at=>{ const hh=Math.max(46, bT.length===1?80:46+(bt/bTot)*90); h+=`<div class="acell${dim?' dim':''}" style="min-height:${hh}px;font-size:clamp(.9rem,2.2vw,1.25rem)">${at*bt}</div>`; });
    });
    h+='</div>';
    return `<p class="asum" style="text-align:left">Vi deler opp tallene: ${a} blir ${aT.join(' + ')}, og ${b} blir ${bT.join(' + ')}. Hver boks er en del av regnestykket.</p>${h}<p class="asum">${aT.flatMap(x=>bT.map(y=>x*y)).join(' + ')} = ${a*b}</p>`;
  }
  let M={ get count(){ return model(0).maxStep; }, render(i){
    const step=i+1, md=model(step), {a,b,rows,cur}=md;
    stage.innerHTML = `<div class="pane"><span class="flabel">Utregning</span>${algo(step,md)}</div><div class="pane"><span class="flabel">Arealmodell</span>${area(md)}</div>`;
    capt.classList.remove('done');
    if (step===0) capt.innerHTML = `La oss regne ut ${a} · ${b}. Vi tar ett siffer fra ${b} av gangen og ganger med ${a}, med enerne først. Trykk <b>Start</b>.`;
    else if (cur.type==='row'){ const row=rows[cur.rowIndex], vStr=String(Math.floor(row.value/10**row.shift)), digit=Number(vStr.split('').reverse()[cur.digitIndex]), place=10**(row.shift+cur.digitIndex);
      capt.innerHTML = `Vi ganger ${a} med sifferet <b>${row.digit}</b>${row.shift>0?` (som betyr ${row.digit*10**row.shift})`:''}. På ${placeName(place)}plassen skriver vi <b>${digit}</b>.${cur.digitIndex===vStr.length-1?` Delsvaret blir ${row.value}.`:''}`; }
    else { const prod=a*b, digit=Number(String(prod).split('').reverse()[cur.digitIndex]);
      capt.innerHTML = `Nå legger vi sammen delsvarene: ${rows.map(r=>r.value).join(' + ')} = ${prod}. På ${placeName(10**cur.digitIndex)}plassen i summen står <b>${digit}</b>.`; }

/* ===================== MODEL: divisjon med oppstilling ===================== */
const PHASE_RANK = {bring:1, divide:2, multiply:3, subtract:4};
function parseDec(s){ s=String(s).trim().replace(',','.'); if(s.indexOf('.')===-1) return {digits:s.split('').map(Number), intLen:s.length}; const p=s.split('.'); return {digits:(p[0]+p[1]).split('').map(Number), intLen:p[0].length}; }

function fmtDec(o){ return o.intLen>=o.digits.length ? o.digits.join('') : o.digits.slice(0,o.intLen).join('')+','+o.digits.slice(o.intLen).join(''); }
function simDiv(dd, intCount, dv, maxExt){
  maxExt = maxExt===undefined?3:maxExt;
  let pos=0, rem=0, started=false, ext=0, truncated=false, commaPos=null, commaIns=false;
  const q=[], steps=[], used=dd.slice(), realLen=dd.length;
  while(true){
    if (pos>=used.length){ if(rem===0) break; if(ext>=maxExt){ truncated=true; break; } used.push(0); ext++; }
    const digit=used[pos], work=rem*10+digit, col=pos; pos++;
    const qd=Math.floor(work/dv), lastInt=(col===intCount-1), mustWrite = qd>0||started||(lastInt&&!started);
    const ws=String(work);
    const st={col, colStart:col-(ws.length-1), colEnd:col, ws, qd, visible:qd>0, hasQ:mustWrite, usedExt:col>=realLen, commaHere:false, qi:null};
    if (mustWrite){ started=true; q.push(String(qd)); st.qi=q.length-1;
      if (st.visible){ const sub=dv*qd; st.ss=String(sub); st.subStart=col-(st.ss.length-1); rem=work-sub; } else rem=work;
    } else rem=work;
    st.remAfter=rem; steps.push(st);
    if (lastInt && !commaIns){ commaPos=q.length; commaIns=true; }
  }
  if (commaPos!==null && commaPos>=q.length) commaPos=null;
  const colToStep={}, qToStep=[];
  steps.forEach((s,i)=>{ colToStep[s.col]=i; if(s.qi!==null) qToStep[s.qi]=i; });
  if (commaPos!==null){ const si=qToStep[commaPos]; if(si!==undefined) steps[si].commaHere=true; }
  return {steps, q, commaPos, used, truncated, realLen, colToStep, qToStep};
}
function buildDiv(aRaw, bRaw){
  const a=parseDec(aRaw), b=parseDec(bRaw); let dividend=a, divisor=b, scale=null;
  const bDec=b.digits.length-b.intLen;
  if (bDec>0){ dividend=shiftDec(a,bDec); divisor=shiftDec(b,bDec);
    scale={factor:10**bDec, oa:fmtDec(a), ob:fmtDec(b), na:fmtDec(dividend), nb:fmtDec(divisor).replace(/^0+(?=\d)/,'')}; }
  const dv=parseInt(divisor.digits.join(''),10);
  const dvDigits=String(dv).split('').map(Number);
  const sim=simDiv(dividend.digits, dividend.intLen, dv);
  const roles=[], posToCol=[], n=sim.used.length;
  for(let i=0;i<n;i++){ if(i===dividend.intLen && n>dividend.intLen) roles.push({role:'cd'}); posToCol[i]=roles.length; roles.push({role:'dd',pos:i}); }
  roles.push({role:'colon'}); dvDigits.forEach(d=>roles.push({role:'dv',digit:d})); roles.push({role:'eq'});
  const qCol=[];
  for(let i=0;i<sim.q.length;i++){ if(sim.commaPos===i) roles.push({role:'cq'}); qCol[i]=roles.length; roles.push({role:'qd',qi:i}); }
  return Object.assign({dividend, dv, scale, roles, posToCol, qCol}, sim);
}
function divMicro(steps){ const m=[]; steps.forEach((st,si)=>{ m.push({ph:'bring',si}); m.push({ph:'divide',si}); if(st.visible){ m.push({ph:'multiply',si}); m.push({ph:'subtract',si}); } }); return m; }
function rankOf(steps, cs, cp, si){ if(si<cs) return steps[si].visible?4:2; if(si===cs) return PHASE_RANK[cp]||0; return 0; }
function qStr(R){ let s=''; R.q.forEach((d,i)=>{ if(R.commaPos===i) s+=','; s+=d; }); return s.replace(/^0+(?=\d)/,'') + (R.truncated?' …':''); }
function divExplain(R, m){
  const st=R.steps[m.si], dv=R.dv, p=[];
  if (m.ph==='bring'){
    if (st.commaHere) p.push('Nå er hele tallet ferdig delt. Vi setter komma i svaret og fortsetter med desimaler.');
    p.push(st.usedExt ? 'Vi henter ned en null.' : `Vi henter ned sifferet <b>${R.used[st.col]}</b>.`);
    p.push(st.colStart<st.colEnd ? `Resten fra før og sifferet vi hentet ned, gir <b>${st.ws}</b>.` : `Nå har vi <b>${st.ws}</b>.`);
  } else if (m.ph==='divide'){
    if (st.visible){ p.push(`Hvor mange ganger går ${dv} opp i ${st.ws}?`); p.push(`Svaret er <b>${st.qd}</b>, fordi ${dv} · ${st.qd} = ${st.ss}, mens ${dv} · ${st.qd+1} = ${dv*(st.qd+1)} hadde blitt for mye.`); }
    else if (st.hasQ) p.push(`${st.ws} er mindre enn ${dv}, så ${dv} går 0 ganger opp. Vi skriver <b>0</b> i svaret og henter ned neste siffer.`);
    else p.push(`${st.ws} er mindre enn ${dv}, så vi må ta med ett siffer til.`);
  } else if (m.ph==='multiply'){
    p.push(`Vi skriver <b>${st.ss}</b> under ${st.ws}, fordi ${dv} · ${st.qd} = ${st.ss}.`);
  } else {
    p.push(`${st.ws} − ${st.ss} = <b>${st.remAfter}</b>. Det er resten.`);
    if (m.si===R.steps.length-1){ if(st.remAfter===0) p.push('Ingen rest igjen.'); else if(R.truncated) p.push('Desimalene fortsetter, så vi stopper her.'); }

}
function mountDiv(el){
  el.innerHTML = modelShell('Divisjon med oppstilling','Trinnvis modell',
    `<div class="field"><label for="dv-a">Dividend</label><input class="num-in" id="dv-a" inputmode="decimal" value="936"></div>
     <span class="op">:</span>
     <div class="field"><label for="dv-b">Divisor</label><input class="num-in sm" id="dv-b" inputmode="decimal" value="6"></div>
     <span class="sp"></span><button class="btn ghost small" data-act="rand">Tilfeldig eksempel</button>`,
    `<p class="legend">Pilene viser hvor vi er. Et lite <b class="neg">+</b> betyr at resten er slått sammen med sifferet vi hentet ned. Du kan bruke komma, for eksempel 2,94 : 0,6.</p>`);
  const ia=el.querySelector('#dv-a'), ib=el.querySelector('#dv-b'), err=el.querySelector('.model-err'), stage=el.querySelector('.stage'), capt=el.querySelector('.caption');
  let M=null;
  const valid = s => /^\d{1,6}(?:[.,]\d{1,4})?$/.test(s.trim());
  function build(){
    err.textContent='';
    const as=ia.value.trim(), bs=ib.value.trim();
    if (!valid(as)||!valid(bs)){ err.textContent='Skriv inn to positive tall. Du kan bruke komma for desimaltall.'; return; }
    if (parseFloat(bs.replace(',','.'))===0){ err.textContent='Vi kan ikke dele på 0.'; return; }
    const R=buildDiv(as,bs), micro=divMicro(R.steps);
    M={ count: micro.length, render(cm){
      const cells=[], add=(c,r,t,cls)=>cells.push(`<div class="dcell ${cls||''}" style="grid-column:${c};grid-row:${r}">${t}</div>`);
      let cs=-1, cp=null; if(cm>=0){ cs=micro[cm].si; cp=micro[cm].ph; }
      R.roles.forEach((r,idx)=>{ const gc=idx+1; if(r.role==='dv') add(gc,1,r.digit,''); else if(r.role==='colon') add(gc,1,':','sym'); else if(r.role==='eq') add(gc,1,'=','sym'); });
      for(let p=0;p<R.used.length;p++){ const gc=R.posToCol[p]+1; const show = p<R.realLen || rankOf(R.steps,cs,cp,R.colToStep[p])>=1; if(show) add(gc,1,R.used[p],''); }
      const realHasDec = R.dividend.intLen < R.realLen;
      if (R.dividend.intLen < R.used.length){ let show=realHasDec; if(!show){ const os=R.colToStep[R.realLen]; show = os!==undefined && rankOf(R.steps,cs,cp,os)>=1; } if(show) add(R.posToCol[R.dividend.intLen],1,',',''); }
      const li=R.steps.length-1, lr=rankOf(R.steps,cs,cp,li), done = R.steps.length>0 && li===cs && lr>=(R.steps[li].visible?4:2);
      // leading zeros in the quotient are hidden except the one before a comma
      const firstReal = R.q.findIndex((d,i)=> d!=='0' || i===R.q.length-1 || R.commaPos===i+1);
      for(let i=0;i<R.q.length;i++){ const si=R.qToStep[i], rk=rankOf(R.steps,cs,cp,si); if(rk<2) continue; if(i<firstReal) continue;
        const gc=R.qCol[i]+1; add(gc,1,R.q[i],'q'+(done?' uline':'')); if(R.commaPos===i) add(gc-1,1,',','q'+(done?' uline':'')); }
      if (done && R.truncated) add(R.qCol[R.q.length-1]+2,1,'…','q');
      let row=3;
      for(let si=0;si<R.steps.length;si++){ const rk=rankOf(R.steps,cs,cp,si); if(rk<1) break; const st=R.steps[si]; if(!st.visible) continue;
        const cur=si===cs;
        for(let p=st.colStart;p<=st.colEnd;p++){ const pm = (p===st.colEnd && st.colStart<st.colEnd) ? '<span class="pm">+</span>' : ''; add(R.posToCol[p]+1,row,st.ws[p-st.colStart]+pm, cur?'cur':''); }
        if (rk>=3) for(let p=st.subStart;p<=st.colEnd;p++) add(R.posToCol[p]+1,row+1,st.ss[p-st.subStart],'line');

      if (cs>=0){ const st=R.steps[cs]; if(cp==='bring'||cp==='divide') add(R.posToCol[st.col]+1,2,'↓','arr'); if((cp==='divide'||cp==='multiply'||cp==='subtract') && st.qi!==null && st.qi>=firstReal) add(R.qCol[st.qi]+1,2,'↑','arr'); }

      html+=`<div class="dgrid" role="img" aria-label="Divisjon med oppstilling" style="grid-template-columns:${widths.join(' ')}">${cells.join('')}</div>`;

      else capt.innerHTML = divExplain(R, micro[cm]);
      if (done){ capt.classList.add('done'); capt.innerHTML = `Ferdig! ${as} : ${bs} = ${qStr(R)}`+(R.truncated?'':` <span style="font-weight:400">Sjekk: ${qStr(R)} · ${bs} = ${as}</span>`); }

}

/* ===================== MODEL: negative tall på tallinja ===================== */

      if (step===3) items.push({t:'dot',at:tot,c:'en '+(tot>=0?'p':'n'),r:7});
      html=`<div class="eq">${fmt(a)} ${op==='+'?'+':'−'} ${par(b)} = ${step===3?fmt(tot):'?'}</div>`+numLine(-R,R,items,'Pluss og minus på tallinja');
      if (step===1){ title='Steg 1: Startpunkt og retning';
        text=`Vi starter på <b>${fmt(a)}</b>. Tegnet i midten (${op==='+'?'+':'−'}) gjør at vi ${op==='-'?'snur oss mot <span class="neg">venstre (minus)</span>':'ser mot <span class="pos">høyre (pluss)</span>'}.`; }
      else if (step===2){ title='Steg 2: Bevegelse';
        text=`Det andre tallet er <code>${fmt(b)}</code>. Et ${b<0?'negativt':'positivt'} tall betyr at vi går ${b<0?'<span class="neg">baklengs</span>':'<span class="pos">forlengs</span>'} ${Math.abs(b)} steg i retningen vi står.`; }
      else { title='Steg 3: Sluttposisjon';
        text = (op==='-'&&b<0) ? `Vi så mot venstre og gikk baklengs. Da beveger vi oss i praksis mot <span class="pos">høyre</span>! Vi lander på <b>${fmt(tot)}</b>. Å trekke fra et negativt tall er det samme som å legge til.`
          : `Etter bevegelsen lander vi på <b>${fmt(tot)}</b>. <code>${fmt(a)} ${op==='+'?'+':'−'} ${par(b)} = ${fmt(tot)}</code>.`; }
    }
    stage.innerHTML=html; capt.innerHTML=`<b>${title}</b><br>${text}`; capt.classList.toggle('done', step===3);
  }};
  const ctl=stepper(el, ()=>M, {min:0});
  el.querySelectorAll('[data-g=mode] button').forEach(b=>b.onclick=()=>{ setMode(b.dataset.v); ctl.reset(); });
  [ia,ib,sel].forEach(x=>{ x.addEventListener('change', ()=>ctl.reset()); });
  setMode('mult'); ctl.reset();
  return { load(v){ setMode(v.mode, true); ia.value=v.a; ib.value=v.b; if(v.op) sel.value=v.op; ctl.reset(); } };
}

/* ===================== MODEL: potens ===================== */
function mountPow(el){
  el.innerHTML = modelShell('Steg for steg: regn ut en potens','Trinnvis modell',
    `<div class="field"><label for="pw-b">Grunntall</label><input class="num-in sm" id="pw-b" type="number" min="1" max="12" value="3"></div>
     <div class="field"><label for="pw-e">Eksponent</label><input class="num-in sm" id="pw-e" type="number" min="0" max="6" value="3"></div>`);
  const ib=el.querySelector('#pw-b'), ie=el.querySelector('#pw-e'), err=el.querySelector('.model-err'), stage=el.querySelector('.stage'), capt=el.querySelector('.caption');
  function vals(){ err.textContent=''; let b=parseInt(ib.value,10), e=parseInt(ie.value,10);
    if(isNaN(b)||b<1||b>12){ err.textContent='Velg et grunntall fra 1 til 12.'; b=Math.max(1,Math.min(12,b||3)); }
    if(isNaN(e)||e<0||e>6){ err.textContent='Velg en eksponent fra 0 til 6.'; e=Math.max(0,Math.min(6,isNaN(e)?3:e)); } return {b,e}; }
  const M={ get count(){ const {e}=vals(); return e<=1 ? 3 : 3 + (e-1) + 1; }, render(i){
    const {b,e}=vals(), v=b**e, n=M.count;
    const big=(hb,he)=>`<div class="pow" aria-label="${b} opphøyd i ${e}"><span class="b${hb?' on':''}">${b}</span><span class="e${he?' on':''}">${e}</span></div>`;
    let h='', c='';
    if (i===0){ h=big(); c=`Vi skal regne ut potensen <b>${b}${sup(e)}</b> («${b} opphøyd i ${e}»).`; }
    else if (i===1){ h=big(1,1)+`<div class="legend-row"><span><span class="badge b">${b}</span><b>Grunntall:</b> tallet som skal ganges</span><span><span class="badge e">${e}</span><b>Eksponent:</b> hvor mange ganger det står</span></div>`; c=`Grunntallet er <b>${b}</b> og eksponenten er <b>${e}</b>.`; }
    else if (e===0){ h=big()+`<div class="expand"><span class="chip grp">1</span></div>`; c=`Eksponenten er 0. Alle tall (unntatt 0) opphøyd i 0 er <b>1</b>. Det ser du fordi ${b}${sup(1)} : ${b}${sup(1)} = ${b}${sup(0)}, og et tall delt på seg selv er 1.`; }
    else if (e===1){ h=big()+`<div class="expand"><span class="chip">${b}</span></div>`; c=`Eksponenten er 1, så tallet står bare én gang. ${b}${sup(1)} = <b>${b}</b>.`; }
    else if (i===2){ h=big()+`<div class="expand">${Array(e).fill(`<span class="chip">${b}</span>`).join(' · ')}</div>`; c=`Eksponenten sier at ${b} skal ganges med seg selv, slik at det står <b>${e} ${b}-tall</b>: ${Array(e).fill(b).join(' · ')}.`; }
    else if (i<n-1){ const k=i-1; const part=b**k; let row=`<span class="chip grp">${part}</span>`; for(let j=k;j<e;j++) row+=` · <span class="chip">${b}</span>`;
      h=big()+`<div class="expand">${row}</div>`; c=`${b**(k-1)} · ${b} = <b>${part}</b>. ${k<e?`Nå gjenstår ${e-k} ${e-k===1?'faktor':'faktorer'}.`:''}`; }
    else { h=big()+`<div class="eq">${b}${sup(e)} = ${Array(e).fill(b).join(' · ')} = <span class="hl">${v}</span></div>`; c=`<b>Svar:</b> ${b}${sup(e)} = ${v}.`; }
    if (i===n-1 && (e<=1)) c += '';
    stage.innerHTML=h; capt.innerHTML=c; capt.classList.toggle('done', i===n-1);
  }};
  const ctl=stepper(el, ()=>M, {min:0});
  [ib,ie].forEach(x=>x.addEventListener('change', ()=>ctl.reset()));
  ctl.reset();
  return { load(v){ ib.value=v.b; ie.value=v.e; ctl.reset(); } };
}

/* ===================== MODEL: potensregler ===================== */
function mountPowRules(el){
  el.innerHTML = modelShell('Steg for steg: ganging og deling av potenser','Trinnvis modell',
    `<div class="field"><label for="pr-a">Grunntall</label><input class="num-in sm" id="pr-a" type="number" min="2" max="9" value="2"></div>
     <div class="field"><label for="pr-m">m</label><input class="num-in sm" id="pr-m" type="number" min="1" max="6" value="2"></div>
     <div class="field"><label for="pr-n">n</label><input class="num-in sm" id="pr-n" type="number" min="1" max="6" value="4"></div>
     <div class="field"><label for="pr-k">k</label><input class="num-in sm" id="pr-k" type="number" min="1" max="6" value="3"></div>
     <span class="flabel" style="padding-bottom:8px">(a<sup>m</sup> · a<sup>n</sup>) : a<sup>k</sup></span>`);
  const I=id=>el.querySelector(id), err=el.querySelector('.model-err'), stage=el.querySelector('.stage'), capt=el.querySelector('.caption');
  function vals(){ err.textContent=''; const c=(x,lo,hi,d)=>{ const v=parseInt(x.value,10); return isNaN(v)?d:Math.max(lo,Math.min(hi,v)); };
    const a=c(I('#pr-a'),2,9,2), m=c(I('#pr-m'),1,6,2), n=c(I('#pr-n'),1,6,4); let k=c(I('#pr-k'),1,6,3);
    if (k>m+n){ err.textContent='k kan ikke være større enn m + n i denne modellen.'; k=m+n; } return {a,m,n,k}; }
  const chips=(a,cnt,cls)=>Array(cnt).fill(`<span class="chip ${cls||''}">${a}</span>`).join(' · ');
  const M={ count:6, render(i){
    const {a,m,n,k}=vals(), s=m+n, r=s-k, task=`(${P(a,m)} · ${P(a,n)}) : ${P(a,k)}`;
    let h='', c='';
    if (i===0){ h=`<div class="eq">${task}</div>`; c='Vi skal forenkle et uttrykk med både ganging og deling. Alle potensene har <b>samme grunntall</b>.'; }
    else if (i===1){ h=`<div class="eq">${P(a,m)} · ${P(a,n)}</div><div class="expand">(${chips(a,m)}) · (${chips(a,n,'alt')})</div>`; c=`Vi starter med gangingen. Skriver vi ut potensene, ser vi ${m} + ${n} = <b>${s}</b> faktorer med ${a}.`; }
    else if (i===2){ h=`<div class="eq">${P(a,m)} · ${P(a,n)} = ${P(a,`${m}+${n}`)} = ${P(a,s)}</div>`; c=`<b>Regel:</b> Når vi ganger potenser med samme grunntall, beholder vi grunntallet og <b>legger sammen eksponentene</b>.`; }
    else if (i===3){ h=`<div class="eq">${P(a,s)} : ${P(a,k)}</div><div class="expand">${Array(s).fill(0).map((_,j)=>`<span class="chip${j<k?' x':''}">${a}</span>`).join(' · ')}</div><div class="expand" style="font-size:1rem">delt på ${chips(a,k,'alt x')}</div>`; c=`Deling er som en brøk: ${k} faktorer over og ${k} under streken kan strykes mot hverandre. Da står ${s} − ${k} = <b>${r}</b> faktorer igjen.`; }
    else if (i===4){ h=`<div class="eq">${P(a,s)} : ${P(a,k)} = ${P(a,`${s}−${k}`)} = ${P(a,r)}</div>`; c=`<b>Regel:</b> Når vi deler potenser med samme grunntall, beholder vi grunntallet og <b>trekker fra eksponentene</b>.`; }
    else { h=`<div class="eq">${task} = ${P(a,r)} = <span class="hl">${a**r}</span></div>`; c = r===0 ? `Forenklet blir det ${a}${sup(0)}, og alt (unntatt 0) opphøyd i 0 er <b>1</b>.` : `Forenklet potens er <b>${a}${sup(r)}</b>. Skrevet som vanlig tall blir det <b>${a**r}</b>.`; }
    stage.innerHTML=h; capt.innerHTML=c; capt.classList.toggle('done', i===5);
  }};
  const ctl=stepper(el, ()=>M, {min:0});
  el.querySelectorAll('input').forEach(x=>x.addEventListener('change', ()=>ctl.reset()));
  ctl.reset();
  return {};
}

/* text problems with several terms: scenario builders */
const scnPay=(p,item,pMin,pMax,aMin,aMax)=>{ const a=rnd(aMin,aMax), pr=rnd(pMin,pMax), m=a*pr; const notes=[50,100,200,500,1000].filter(n=>n>m); let s=notes[0]||1000; if(notes.length>1&&Math.random()<.35) s=notes[1];
  return {text:`${p} kjøper ${a} ${item} til ${pr} kr per stykk og betaler med en ${s}-kroneseddel. Hvor mye får ${p} igjen?`, expr:`${s} − ${a} · ${pr}`, ans:s-m, u:'kr', steps:[`Totalpris: <b>${a} · ${pr} = ${m} kr</b>`,`Igjen: <b>${s} − ${m} = ${s-m} kr</b>`]}; };
const scnBox=(p,cont,item,aMin,aMax,bMin,bMax,cMin,cMax)=>{ const a=rnd(aMin,aMax), b=rnd(bMin,bMax), c=rnd(cMin,cMax), m=a*b;
  return {text:`${p} har ${a} ${cont} med ${b} ${item} i hver. I tillegg har ${p} ${c} løse ${item}. Hvor mange ${item} er det til sammen?`, expr:`${a} · ${b} + ${c}`, ans:m+c, steps:[`I ${cont}: <b>${a} · ${b} = ${m}</b>`,`Med de løse: <b>${m} + ${c} = ${m+c}</b>`]}; };
const scnShare=(p,item,gMin,gMax,perMin,perMax,eMin,eMax)=>{ const g=rnd(gMin,gMax), per=rnd(perMin,perMax), tot=g*per, ex=rnd(eMin,eMax);
  return {text:`${p} deler ${tot} ${item} likt på ${g} personer. Etterpå får hver person ${ex} ${item} til. Hvor mange ${item} har hver person nå?`, expr:`${tot} : ${g} + ${ex}`, ans:per+ex, steps:[`Etter delingen: <b>${tot} : ${g} = ${per}</b>`,`Med det ekstra: <b>${per} + ${ex} = ${per+ex}</b>`]}; };
const scnCombo=(p,i1,i2,unit,aMin,aMax,bMin,bMax,cMin,cMax)=>{ const a=rnd(aMin,aMax), b=rnd(bMin,bMax), c=rnd(cMin,cMax), s=a+b;
  return {text:`${p} lager ${c} sett. Hvert sett har ${a} ${i1} og ${b} ${i2}. Hvor mange ${unit} er det til sammen?`, expr:`${c} · (${a} + ${b})`, ans:c*s, steps:[`I hvert sett: <b>${a} + ${b} = ${s}</b>`,`I alle ${c} settene: <b>${c} · ${s} = ${c*s}</b>`]}; };
const scnSubDiv=(p,spMin,spMax,gMin,gMax)=>{ const g=rnd(gMin,gMax), per=rnd(10,40), rem=g*per, sp=rnd(spMin,spMax), st=rem+sp;
  return {text:`${p} hadde ${st} kr, brukte ${sp} kr og delte resten likt på ${g} venner. Hvor mye fikk hver venn?`, expr:`(${st} − ${sp}) : ${g}`, ans:per, u:'kr', steps:[`Igjen etter kjøpet: <b>${st} − ${sp} = ${rem} kr</b>`,`Delt på ${g}: <b>${rem} : ${g} = ${per} kr</b>`]}; };
const scnTwo=(p,i1,p1Min,p1Max,aMin,aMax,i2,p2Min,p2Max,bMin,bMax)=>{ const a=rnd(aMin,aMax), p1=rnd(p1Min,p1Max), m1=a*p1, b=rnd(bMin,bMax), p2=rnd(p2Min,p2Max), m2=b*p2;
  return {text:`${p} kjøper ${a} ${i1} til ${p1} kr per stykk og ${b} ${i2} til ${p2} kr per stykk. Hva koster alt til sammen?`, expr:`${a} · ${p1} + ${b} · ${p2}`, ans:m1+m2, u:'kr', steps:[`Kjøp 1: <b>${a} · ${p1} = ${m1} kr</b>`,`Kjøp 2: <b>${b} · ${p2} = ${m2} kr</b>`,`Til sammen: <b>${m1} + ${m2} = ${m1+m2} kr</b>`]}; };
const scnBatch=(p,item,bMin,bMax,perMin,perMax,pkMin,pkMax)=>{ const b=rnd(bMin,bMax), per=rnd(perMin,perMax), tot=b*per; let pk, pp, rem, sold, tries=0;
  do { pk=rnd(pkMin,pkMax); pp=rnd(4,10); rem=pk*pp; sold=tot-rem; tries++; } while(sold<=0 && tries<40);
  if (sold<=0){ pk=2; pp=Math.floor(tot/4); rem=pk*pp; sold=tot-rem; }
  return {text:`${p} laget ${b} brett med ${per} ${item} på hvert. ${sold} ${item} ble solgt, og resten ble pakket likt i ${pk} esker. Hvor mange ${item} kom i hver eske?`, expr:`(${b} · ${per} − ${sold}) : ${pk}`, ans:pp, steps:[`Laget til sammen: <b>${b} · ${per} = ${tot}</b>`,`Igjen etter salget: <b>${tot} − ${sold} = ${rem}</b>`,`I hver eske: <b>${rem} : ${pk} = ${pp}</b>`]}; };
const scnBudget=(p,i1,p1,a,i2,p2,b)=>{ const m1=a*p1, m2=b*p2, tc=m1+m2, bud=Math.ceil((tc+rnd(50,200))/10)*10;
  return {text:`${p} har et budsjett på ${bud} kr og kjøper ${a} ${i1} til ${p1} kr per stykk og ${b} ${i2} til ${p2} kr per stykk. Hvor mye er igjen av budsjettet?`, expr:`${bud} − (${a} · ${p1} + ${b} · ${p2})`, ans:bud-tc, u:'kr', steps:[`Kjøp 1: <b>${a} · ${p1} = ${m1} kr</b>`,`Kjøp 2: <b>${b} · ${p2} = ${m2} kr</b>`,`Brukt: <b>${m1} + ${m2} = ${tc} kr</b>`,`Igjen: <b>${bud} − ${tc} = ${bud-tc} kr</b>`]}; };

function divSteps(n,d){
  const R=buildDiv(String(n),String(d)), out=[];
  R.steps.forEach(st=>{ if(st.visible) out.push(`${st.ws} : ${d} = <b>${st.qd}</b>, fordi ${d} · ${st.qd} = ${st.ss}. Rest: ${st.remAfter}.`);
    else if(st.hasQ) out.push(`${st.ws} er mindre enn ${d}. Vi skriver <b>0</b> og henter ned neste siffer.`); });
  return out;
}

const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; };
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d)=>{ const show=v=>typeof v==='number'?fmt(v):v;
  if(d===undefined||d===1) return `<span class="math">${show(n)}</span>`;
  if(typeof n==='number'&&n<0) return `−<span class="frac"><span>${-n}</span><span>${show(d)}</span></span>`;
  return `<span class="frac"><span>${show(n)}</span><span>${show(d)}</span></span>`; };
const simp=(n,d)=>{ const g=gcd(n,d)||1; return [n/g,d/g]; };

const isPrime=n=>{ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; };
const pfac=n=>{ const f=[]; let m=n; for(let p=2;p*p<=m;p++) while(m%p===0){ f.push(p); m/=p; } if(m>1) f.push(m); return f; };

const coprime=q=>{ let p; do { p=rnd(1,q-1); } while(gcd(p,q)!==1); return p; };
const dsum=n=>String(n).split('').reduce((s,c)=>s+ +c,0);
const r2=v=>Math.round(v*1e6)/1e6;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mcFrom(right, wrongs){ const uniq=[]; wrongs.forEach(w=>{ if(w!==right && !uniq.includes(w)) uniq.push(w); }); const opts=shuffle([right, ...uniq.slice(0,3)]); return {opts, a:opts.indexOf(right)}; }
const keyExp=k=>{ if(k==='c') return -1; const e=k.slice(1); return e?+e:1; };
function poly(m){
  const ks=Object.keys(m).filter(k=>r2(m[k])).sort((a,b)=>{ const ea=keyExp(a), eb=keyExp(b); if(ea!==eb) return eb-ea; return a<b?-1:1; });
  let s=''; ks.forEach(k=>{ const c=r2(m[k]), ac=Math.abs(c); let t;
    if(k==='c') t=fmt(ac); else { const e=k.slice(1); t=(ac===1?'':fmt(ac))+k[0]+(e&&e!=='1'?`<sup>${e}</sup>`:''); }
    s += !s ? (c<0?'−':'')+t : (c<0?' − ':' + ')+t; });
  return s||'0';
}
/* terms kept in the given order (not combined) */
function termsStr(list){ let s=''; list.forEach(t=>{ if(!t.v) return; const ac=Math.abs(t.v); const body = t.k==='c' ? fmt(ac) : (ac===1?'':fmt(ac))+t.k[0]+(t.k.length>1?`<sup>${t.k.slice(1)}</sup>`:''); s += !s ? (t.v<0?'−':'')+body : (t.v<0?' − ':' + ')+body; }); return s||'0'; }
const SUPR={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
function parsePoly(s){
  s=String(s).toLowerCase().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>SUPR[c]).join('')).replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*]/g,'').replace(/,/g,'.');
  s=s.replace(/^f\(x\)=/,'').replace(/^y=/,'');
  if(!s) return null; if(!/^[+-]/.test(s)) s='+'+s;
  const terms=s.match(/[+-][^+-]*/g); if(!terms||terms.join('')!==s) return null;
  const out={}, seen={};
  for(const t of terms){ const m=t.match(/^([+-])(\d+(?:\.\d+)?)?(?:([a-z])(?:\^(\d+))?)?$/); if(!m||(!m[2]&&!m[3])) return null;
    const co=(m[1]==='-'?-1:1)*(m[2]?parseFloat(m[2]):1), key=m[3]?(m[3]+(m[4]&&m[4]!=='1'?m[4]:'')):'c';
    out[key]=(out[key]||0)+co; seen[key]=(seen[key]||0)+1; }
  return {m:out, dup:Object.values(seen).some(v=>v>1)};
}
function polyEq(a,b){ const ks=new Set([...Object.keys(a),...Object.keys(b)]); for(const k of ks) if(Math.abs((a[k]||0)-(b[k]||0))>1e-9) return false; return true; }
function parseFac(s){ s=String(s).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>SUPR[c]).join('')).replace(/\s+/g,''); if(!s) return null;
  const parts=s.split(/[·*×x]/); const out=[];
  for(const p of parts){ const m=p.match(/^(\d+)(?:\^(\d+))?$/); if(!m) return null; for(let i=0;i<(m[2]?+m[2]:1);i++) out.push(+m[1]); }
  return out; }

function treeSVG(n,k){ const f=[], chain=[n]; let m=n; while(m>1 && !isPrime(m)){ let p=2; while(m%p) p++; f.push(p); m/=p; chain.push(m); }

function mountPrim(el){

function evalTerms(m, vals){ const parts=[]; ['x2','x','y','c'].forEach(k=>{ if(m[k]) parts.push({k,c:m[k]}); });
  const sg=(i,c)=> i===0 ? (c<0?'−':'') : (c<0?' − ':' + ');
  const sub=parts.map((p,i)=>{ const ac=Math.abs(p.c); if(p.k==='c') return sg(i,p.c)+ac; const v=vals[p.k[0]], vv=`${par(v)}${p.k==='x2'?'²':''}`; return sg(i,p.c)+(ac===1?vv:`${ac} · ${vv}`); }).join('');
  const hasPow=parts.some(p=>p.k==='x2');
  const pw=hasPow ? parts.map((p,i)=>{ const ac=Math.abs(p.c); if(p.k==='c') return sg(i,p.c)+ac; if(p.k==='x2'){ const v2=vals.x**2; return sg(i,p.c)+(ac===1?v2:`${ac} · ${v2}`); } const v=vals[p.k[0]]; return sg(i,p.c)+(ac===1?par(v):`${ac} · ${par(v)}`); }).join('') : null;
  const nums=parts.map(p=>p.k==='c'?p.c:p.c*(p.k==='x2'?vals.x**2:vals[p.k[0]]));
  const numStr=nums.map((n,i)=>i===0?fmt(n):(n<0?' − ':' + ')+Math.abs(n)).join('');
  return {sub, pw, numStr, total:nums.reduce((s,n)=>s+n,0)}; }

/* ===================== progress (this browser only) ===================== */
const KEY='mat8-fremgang-v2', GOAL=10;
let ST={}; try{ ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ ST={}; }
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} };
const tStat = id => ST[id] || (ST[id]={c:0,t:0,best:0});
function topicStat(tid){ const tr=TOPICS[tid].trainers; let n=0; tr.forEach(x=>n+=Math.min(GOAL,(ST[x.id]||{}).c||0)); return {n, t:tr.length*GOAL}; }
function chapterStat(ch){ let n=0,t=0; ch.groups.forEach(g=>g.topics.forEach(tid=>{ const s=topicStat(tid); n+=s.n; t+=s.t; })); return {n,t}; }
const pct = s => s.t ? Math.round(100*s.n/s.t) : 0;

/* ===================== trainer UI ===================== */
function norm(s){ return String(s).trim().toLowerCase().replace(/[−–—]/g,'-').replace(/[a-zæøå°%²]+/gi,'').replace(/\s+/g,'').replace(/,/g,'.').replace(/\.+$/,''); }
function numOk(input, ans){ const s=norm(input); if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return Math.abs(parseFloat(s)-ans)<1e-9; }
function mountTrainer(el, id, onModel){
  const C=TRAINERS[id]; const st={L:1, f:{}, cur:null, answered:false, streak:0};
  (C.filters||[]).forEach(f=>st.f[f.k]=f.def);
  const opt = (k,label,opts,cur) => `<div class="optrow"><span class="flabel">${label}</span><div class="seg" data-k="${k}">${opts.map(([v,t])=>`<button data-v="${v}" aria-pressed="${String(v)===String(cur)}">${t}</button>`).join('')}</div></div>`;
  el.innerHTML = `<div class="tr-head"><h3>${C.title}</h3><div class="score"><span>Riktige: <b data-sc="c">0</b> av <b data-sc="t">0</b></span><span>På rad: <b data-sc="s">0</b></span></div></div>
    ${(C.levels||C.filters)?`<div class="tr-opts">${C.levels?opt('L','Nivå',C.levels.map((t,i)=>[i+1,t]),1):''}${(C.filters||[]).map(f=>opt(f.k,f.label,f.opts,f.def)).join('')}</div>`:''}
    <div class="tr-body">${C.intro?`<p class="tally" style="text-align:center">${C.intro}</p>`:''}
      <p class="eyebrow" data-lab style="text-align:center"></p>
      <div class="tr-q" data-q aria-live="polite"></div>
      <form class="tr-form" novalidate data-form></form>
      <p class="fb" data-fb aria-live="polite"></p>
      <div class="tr-actions" data-acts hidden><button class="btn ghost small" type="button" data-a="sol">Vis løsning</button><button class="btn ghost small" type="button" data-a="model" hidden>Se den i modellen ↑</button><button class="btn small" type="button" data-a="next">Neste oppgave →</button></div>
      <div class="sol" data-sol hidden></div>
    </div>`;
  const q=el.querySelector('[data-q]'), form=el.querySelector('[data-form]'), fb=el.querySelector('[data-fb]'), acts=el.querySelector('[data-acts]'), sol=el.querySelector('[data-sol]'), lab=el.querySelector('[data-lab]');
  const fid='tr-'+id;
  const ansText = p => p.ansHTML ? p.ansHTML : p.pa ? P(p.pa.b,p.pa.e) : p.fr ? F(p.fr.n,p.fr.d) : p.ex ? (p.pre?p.pre+' ':'')+poly(p.ex) : p.fac ? `${p.fac} = ${powStr(pfac(p.fac))}` : p.multi ? p.multi.map(m=>`${m.label} = ${fmt(m.a)}`).join(', ') : p.mc ? p.mc.opts[p.mc.a] : (p.pre?p.pre+' ':'')+fmt(p.a)+(p.u?' '+p.u:'');

    else if (p.pa) form.innerHTML=`<span class="powin"><input class="ans b" id="${fid}-b" autocomplete="off" inputmode="numeric" aria-label="Grunntall" placeholder="grunntall"><input class="ans e" id="${fid}-e" autocomplete="off" inputmode="numeric" aria-label="Eksponent" placeholder="eksp."></span>${sub}`;

    else if (p.multi) form.innerHTML=p.multi.map((m,i)=>`<label class="ml">${m.label} =<input class="ans sm" id="${fid}-${i}" autocomplete="off" inputmode="text"></label>`).join('')+sub;

    if (focus){ const i=form.querySelector('input,.mcb'); if(i) i.focus({preventScroll:true}); }
  }
  function check(p, ins, mcI){
    if (p.mc) return {ok: mcI===p.mc.a};
    if (p.pa){ const b=parseInt(norm(ins[0].value),10), x=parseInt(norm(ins[1].value),10); if(isNaN(b)||isNaN(x)) return {ok:null, msg:'Fyll inn både grunntall og eksponent.'}; return {ok: b===p.pa.b && x===p.pa.e}; }
    if (p.fr){ const tn=norm(ins[0].value), dn=norm(ins[1].value); if(!/^-?\d+$/.test(tn)||(dn&&!/^-?\d+$/.test(dn))) return {ok:null, msg:'Skriv hele tall i teller og nevner.'};
      const t=parseInt(tn,10), d=dn?parseInt(dn,10):1; if(d===0) return {ok:null, msg:'Nevneren kan ikke være 0.'};

    <tr><td style="font-family:var(--f-body)">3 mer enn x</td><td>x + 3</td></tr><tr><td style="font-family:var(--f-body)">5 mindre enn x</td><td>x − 5</td></tr><tr><td style="font-family:var(--f-body)">dobbelt så mye som x</td><td>2x</td></tr><tr><td style="font-family:var(--f-body)">x delt på 4</td><td>x : 4 eller ${F('x',4)}</td></tr><tr><td style="font-family:var(--f-body)">x ganget med seg selv</td><td>x<sup>2</sup></td></tr></tbody></table></div></div>
   <div class="model" data-model="subst"></div>
   <div class="rule"><span class="lab">Husk</span><p>3x betyr 3 · x. Setter du inn negative tall, bruker du parentes: når x = −2, blir 3x = 3 · (−2) = −6.</p></div>`,
  trainers:[{id:'innsett'},{id:'lagutr'}] },
 forenkling:{ title:'Addisjon og subtraksjon av uttrykk', short:'Like ledd, nullpar og minus foran parentes.',
  learn:`<p>Vi kan bare trekke sammen <b>like ledd</b>: x-ledd med x-ledd og tall med tall. Algebrabrikkene viser hvorfor: en lang x-brikke og en liten enerbrikke er ikke like store.</p>
   <div class="model" data-model="tiles"></div>
   <div class="trap"><span class="lab">Vanlig feil</span><p>3x + 2 er <b>ikke</b> 5x. Det er ulike ledd og kan ikke trekkes sammen.</p>${tileRow(tilesOf({x:3,c:2}))}</div>
   <div class="rule"><span class="lab">Parenteser</span><ul><li><b>Pluss foran parentes:</b> fjern parentesen. 4x + (2x − 3) = 6x − 3</li><li><b>Minus foran parentes:</b> snu alle fortegn inni. 4x − (2x − 3) = 4x − 2x + 3 = 2x + 3</li></ul></div>`,
  trainers:[{id:'forenkle'}] },
 'gange-alg':{ title:'Multiplikasjon, divisjon og potenser', short:'Gange og dele uttrykk, og x · x = x².',
  learn:`<p>Når vi ganger algebraiske uttrykk, ganger vi tallene for seg og bokstavene for seg. Arealmodellen viser hvorfor x · x blir x².</p>
   <div class="model" data-model="algmul"></div>
   <div class="rule"><span class="lab">Regler</span><ul><li>3 · 4x = 12x</li><li>2x · 3x = 6x<sup>2</sup></li><li>12x : 4 = 3x</li><li>x<sup>2</sup> · x<sup>3</sup> = x<sup>5</sup> (potensregelen fra kapittel 1)</li></ul></div>`,
  trainers:[{id:'gangealg'}] },
 parenteser:{ title:'Parenteser i uttrykk', short:'Gange inn i parentes med arealmodell.',
  learn:`<p>Et tall foran en parentes skal ganges med <b>alle</b> leddene i parentesen. Arealmodellen viser hvorfor: arealet av hele rektangelet er summen av de to delene.</p>
   <div class="model" data-model="paren"></div>
   <div class="rule"><span class="lab">Husk</span><ul><li>3(x + 4) = 3x + 12</li><li>−2(x − 5) = −2x + 10</li><li>−(x + 7) = −x − 7</li></ul></div>`,
  trainers:[{id:'parentes'}] },
 monster:{ title:'Mønster i tall', short:'Figurtall, tabeller og formler.',
  learn:`<p>Mange mønstre vokser like mye for hver figur. Da kan vi lage en <b>formel</b> som gir antallet i figur n, uten å tegne alle figurene.</p>
   <div class="model" data-model="pattern"></div>
   <div class="rule"><span class="lab">Formelen</span><p class="eq">antall = økning · n + fast del</p><p>Økningen finner du i tabellen. Den faste delen er det som er likt i alle figurene.</p></div>`,
  trainers:[{id:'monster'}] },
 likninger:{ title:'Likninger', short:'Skålvekt, balanse og føring.',
  learn:`<p>En <b>likning</b> er to uttrykk med likhetstegn mellom. Å løse likningen er å finne verdien av x som gjør begge sidene like store. Tenk på en skålvekt i balanse.</p>
   <div class="model" data-model="balance"></div>
   <div class="rule"><span class="lab">Gyllen regel</span><p>Det du gjør på den ene siden, må du gjøre på den andre. Da holder vekta seg i balanse.</p></div>
   <div class="box"><span class="lab">Føring</span><p class="eq" style="text-align:left">3x + 5 = 20</p><p class="eq" style="text-align:left">3x = 15 <span class="hand">| −5</span></p><p class="eq" style="text-align:left">x = 5 <span class="hand">| :3</span></p><p>Sjekk: 3 · 5 + 5 = 20 ✓</p></div>`,
  trainers:[{id:'likning'}] },
 problemlosning:{ title:'Problemløsning med likninger', short:'Fra tekst via strimmeldiagram til likning.',
  learn:`<p>En likning er et godt verktøy for tekstoppgaver. Et <b>strimmeldiagram</b> hjelper deg å se hvordan tallene henger sammen før du skriver likningen.</p>
   <div class="rule"><span class="lab">Fem steg</span><ol class="order"><li><span>Les oppgaven og finn ut hva du skal finne.</span></li><li><span>Tegn et strimmeldiagram.</span></li><li><span>Kall det ukjente tallet x.</span></li><li><span>Sett opp likningen og løs den.</span></li><li><span>Svar med hele setninger og sjekk at svaret passer.</span></li></ol></div>
   <div class="model" data-model="tape"></div>`,
  trainers:[{id:'problem'}] },
 koordinater:{ title:'Koordinatsystemet', short:'Punkter, akser, origo og kvadranter.',
  learn:`<p>Et <b>koordinatsystem</b> har en vannrett x-akse og en loddrett y-akse. De krysser i <b>origo</b>, (0, 0). Hvert punkt har to koordinater: (x, y).</p>
   <div class="model" data-model="coord"></div>
   <div class="rule"><span class="lab">Husk</span><ul><li>Først x (bortover), så y (opp eller ned).</li><li>Positiv x er til høyre, negativ x til venstre. Positiv y er opp, negativ y ned.</li><li>Kvadrantene nummereres mot klokka, med start oppe til høyre.</li></ul></div>`,
  trainers:[{id:'koord'}] },
 funksjonsuttrykk:{ title:'Fra situasjon til funksjon', short:'Tekst, tabell, graf og formel.',
  learn:`<p>En <b>funksjon</b> er en regel som gir ett svar for hver verdi vi setter inn. Den samme funksjonen kan vises på fire måter: med ord, i en tabell, som graf og som formel.</p>
   <div class="model" data-model="situation"></div>
   <div class="rule"><span class="lab">Lineære funksjoner</span><p class="eq">f(x) = ax + b</p><ul><li><b>a</b> er stigningstallet: hvor mye f(x) endrer seg når x øker med 1.</li><li><b>b</b> er konstantleddet: verdien når x = 0, altså startverdien.</li></ul></div>`,
  trainers:[{id:'funk'}] },
 grafer:{ title:'Tegne grafer', short:'Verditabell, punkter, stigningstall og konstantledd.',
  learn:`<p>Grafen til en lineær funksjon er en rett linje. Vi kan tegne den med en verditabell, eller ved å bruke konstantleddet og stigningstallet direkte.</p>
   <div class="model" data-model="graph"></div>
   <div class="box"><span class="lab">Stigningstallet bestemmer retningen</span>${plane({x0:-5,x1:5,y0:-5,y1:5,s:18,items:[{t:'line',a:2,b:0,c:''},{t:'line',a:0,b:2,c:'g'},{t:'line',a:-1,b:-1,c:'r'},{t:'txt',x:3.2,y:4.5,s:'a = 2',c:'b'},{t:'txt',x:-3.6,y:2.6,s:'a = 0',c:'g'},{t:'txt',x:-3,y:3.4,s:'a = −1',c:'r'}],aria:'Tre linjer med ulike stigningstall'})}<p>Positiv a: grafen stiger. Negativ a: grafen synker. a = 0: grafen er vannrett.</p></div>`,
  trainers:[{id:'grafles'}] },
 diagrammer:{ title:'Avlesing og tolking', short:'Les av og forklar grafer og diagrammer fra hverdagen.',
  learn:`<p>Grafer fra hverdagen forteller historier. Se alltid først på aksene: hva står bortover, hva står oppover, og hvilke enheter brukes?</p>
   <div class="model" data-model="trip"></div>
   <div class="rule"><span class="lab">Tolk formen</span><ul><li><b>Bratt</b> graf: rask endring.</li><li><b>Vannrett</b> graf: ingen endring.</li><li><b>Synkende</b> graf: verdien blir mindre.</li></ul></div>`,
  trainers:[{id:'diagram'}] }
});

const $ = s => document.querySelector(s);
const main=$('#main'), side=$('#side');
function chapterOf(tid){ for(const ch of BOOK.chapters) for(const g of ch.groups) if(g.topics.includes(tid)) return {ch,g}; }
const order = ch => ch.groups.flatMap(g=>g.topics);
const gradeOf = ch => (ch&&ch.grade)||8;
let GRADE=(()=>{ try{ return +localStorage.getItem('mat8-grade')===9?9:8; }catch(e){ return 8; } })();
const setGrade=g=>{ GRADE=g; try{ localStorage.setItem('mat8-grade',String(g)); }catch(e){} document.title=`Matematikk ${g}. trinn`; };
const CHS = () => BOOK.chapters.filter(c=>gradeOf(c)===GRADE);
const gradeTids = (g) => BOOK.chapters.filter(c=>gradeOf(c)===(g||GRADE)).flatMap(order);
const gradeSw = () => `<div class="grade-sw" role="group" aria-label="Velg trinn">${[8,9].map(g=>`<button type="button" data-grade="${g}" aria-pressed="${GRADE===g}">${g}. trinn</button>`).join('')}</div>`;
const bar = s => `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${s.t}" aria-valuenow="${s.n}" aria-label="${pct(s)} prosent fullført"><i style="width:${pct(s)}%"></i></div>`;
const tally = s => s.t && s.n>=s.t ? `<span class="tally done">✓ mestret</span>` : `<span class="tally">${pct(s)} %</span>`;
let curRoute='';
function renderNav(route){
  let h=`<a class="brand-big" href="#">Matematikk<small>${GRADE}. trinn</small></a>${gradeSw()}<ul class="nav"><li><a href="#" ${route===''?'aria-current="page"':''}><span>Forside</span></a></li><li><a href="#spill" ${route==='spill'?'aria-current="page"':''}><span>Spill</span><span class="tally">5 spill</span></a></li><li><a href="#laerer" ${route==='laerer'?'aria-current="page"':''}><span>For lærere</span><span class="tally">PDF</span></a></li>`;
  CHS().forEach(ch=>{
    h+=`<li><a class="chap" href="#${ch.id}" ${route===ch.id?'aria-current="page"':''}><span>Kap ${ch.num} · ${ch.title}</span></a></li>`;
    ch.groups.forEach(g=>{ h+=`<li class="grp">${g.title}</li>`; g.topics.forEach(tid=>{ const r=`${ch.id}-${tid}`; h+=`<li class="sub"><a href="#${r}" ${route===r?'aria-current="page"':''}><span>${TOPICS[tid].title}</span>${tally(topicStat(tid))}</a></li>`; }); });
  });
  side.innerHTML = h+`</ul>`;
}
function refreshNav(){ renderNav(curRoute); }

function renderTopic(ch, tid){
  const t=TOPICS[tid], {g}=chapterOf(tid), ord=order(ch), idx=ord.indexOf(tid), prev=ord[idx-1], next=ord[idx+1];
  main.innerHTML=`<div class="col">
    <nav class="crumb" aria-label="Brødsmuler"><a href="#">Forside</a><span>›</span><a href="#${ch.id}">Kapittel ${ch.num}</a><span>›</span><span>${g.title}</span></nav>
